<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--hd1:#1a44cc;--hd2:#2f6df5;--sh:0 6px 24px rgba(20,40,100,.08);--side:linear-gradient(180deg,#1a44cc,#0f2a7a)}
[data-theme=dark]{--bg:#070b16;--card:#0f1627;--tx:#e8edf9;--mut:#93a1bd;--pri:#5b8cff;--soft:#16223d;--bd:#1d2a45;--hd1:#10265e;--hd2:#1d44a3;--sh:0 6px 24px rgba(0,0,0,.35);--side:linear-gradient(180deg,#0c1c45,#060a14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;min-height:44px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--pri)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 5px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
svg{flex-shrink:0;vertical-align:middle}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.mut{color:var(--mut)}
.logo{font-weight:800;letter-spacing:.2em;font-size:19px}.logo span{font-weight:300;margin-left:.3em}
.shell{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.side .brand{padding:22px 22px 12px}.side .brand small{display:block;opacity:.65;font-size:12px;margin-top:2px;letter-spacing:.04em}
.ng{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}.chv{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform .2s}.gp.shut .chv{transform:rotate(-45deg);margin-top:0}.gp.shut .ni{display:none}.ng{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:16px 22px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:12px;margin:2px 12px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,.86);background:none;border:0;width:calc(100% - 24px);text-align:left;cursor:pointer;font-weight:600;font-size:14.5px}
.ni:hover{background:rgba(255,255,255,.12)}
.ni.on{background:#fff;color:#1a44cc;box-shadow:0 6px 16px rgba(0,0,40,.25)}
[data-theme=dark] .ni.on{background:#1d2f63;color:#fff}
.sf{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.14)}
.sf .who{font-size:13px;opacity:.85;margin-bottom:10px}
.sf .acts{display:flex;gap:8px}
.sf .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:38px;padding:7px 11px;font-size:13px;flex:1}
.main{flex:1;min-width:0}
.tb{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--bd)}
.tb h2{margin:0;font-size:21px;font-weight:800}.tb .sub{font-size:13px;color:var(--mut)}
.tb .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
.who2{display:flex;align-items:center;gap:10px;padding-left:14px;margin-left:6px;border-left:1px solid var(--bd);min-width:0}.who2 .av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}.who2 .wn{font-weight:700;font-size:13px;line-height:1.2;text-transform:uppercase;max-width:200px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.who2{margin-left:auto;padding-left:0;border:0}.who2 .wn{display:none}}
.hb{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);place-items:center;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:55}
.content{padding:20px 26px 40px;max-width:1500px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 17px;white-space:nowrap;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.kc small{display:block;color:var(--mut);font-size:13px}.kc b{font-size:21px;font-weight:800;display:block}
.kc .dlt{display:inline-block;margin-top:2px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.kc.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border:0;padding:22px}.kc.hero small{color:rgba(255,255,255,.85)}.kc.hero b{font-size:34px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h4{margin:0 0 4px;font-size:16px;font-weight:800}.card p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tool input{flex:1;min-width:200px}.tool select{width:auto;min-width:150px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--pri)}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.ft td{font-weight:800;border-top:2px solid var(--bd);background:var(--soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri)}
.badge.v{background:#fde4e8;color:var(--bad)}.badge.k{background:#fff0d1;color:var(--warn)}.badge.g{background:#dcf5e6;color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px}
.chart .c{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:linear-gradient(180deg,var(--hd2),var(--hd1));border-radius:6px 6px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:10.5px;color:var(--mut)}.axis span{flex:1;min-width:6px;text-align:center;overflow:hidden}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hd1),var(--hd2))}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rk{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.grow{flex:1;min-width:0}.val{text-align:right;font-weight:700}.val small{display:block;color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0 9px 26px;border-bottom:1px solid var(--bd);position:relative}.ins li:last-child{border:0}.ins li:before{content:'💡';position:absolute;left:0}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lgs{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.lgl{position:relative;overflow:hidden}
.lgbrand{position:absolute;top:26px;left:34px;z-index:3;color:#fff}
.lgsl{position:absolute;inset:0}
.lgsl .sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;pointer-events:none}
.lgsl .sl.on{opacity:1;pointer-events:auto}
.lgph{width:min(78%,310px);height:min(50vh,390px);object-fit:cover;object-position:62% 30%;border-radius:26px;box-shadow:0 24px 50px rgba(3,10,50,.45);border:4px solid rgba(255,255,255,.85);margin-top:50px}
.lgph+.lgtx{padding:18px 40px 60px}

 const tot=sum(segs,x=>x.v),R=15.9155;let off=25,arcs='';

const hasExp=()=>!!(D&&(D.products||[]).some(p=>(p.bt||[]).length));
const expTs=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():NaN};
const expDays=s=>{const d=new Date();d.setHours(0,0,0,0);return Math.round((expTs(s)-d.getTime())/864e5)};
const expFmt=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'-'};
function expRows(){
 const out=[];
 (D.products||[]).forEach(p=>{
  if(!(p.bt||[]).length||p.notrack)return;
  const stock=Math.max(0,+p.stock||0),m={};let fzT=0;
  p.bt.forEach(b=>{if(b.fz!==undefined)fzT+=+b.fz||0});
  let left=Math.max(0,stock-fzT);
  p.bt.filter(b=>b.fz===undefined).sort((a,b)=>expTs(b.exp)-expTs(a.exp)).forEach(b=>{const r=Math.min(left,+b.q||0);left=+(left-r).toFixed(3);m[b.id]=r});
  let fl=Math.min(fzT,stock);
  p.bt.filter(b=>b.fz!==undefined).sort((a,b)=>expTs(a.exp)-expTs(b.exp)).forEach(b=>{const r=Math.min(fl,+b.fz||0);fl=+(fl-r).toFixed(3);m[b.id]=r});
  p.bt.forEach(b=>{const rem=m[b.id]||0,d=expDays(b.exp);if(rem>0&&!isNaN(d))out.push({p,b,rem,d,val:rem*(+p.cogs||0)})});
 });
 return out.sort((a,b)=>expTs(a.b.exp)-expTs(b.b.exp));
}

function dtMode(m){DT.mode=m;$('#dtm1').classList.toggle('on',m==='nota');$('#dtm2').classList.toggle('on',m==='item');dtRender()}
function dtFilter(){

 if(DT.mode==='nota')return{nota:base.filter(t=>!q||(head(t)+' '+t.items.map(i=>i.name).join(' ').toLowerCase()).includes(q))};
 return{rows:base.flatMap(t=>t.items.map(i=>({t,i}))).filter(r=>!q||(head(r.t)+' '+r.i.name.toLowerCase()).includes(q))};
}

 const c=$('#dtc'),t=$('#dtt');if(!c||!t)return;

function vProduk(d){

function ppList(){
 const q=PP.q.toLowerCase(),tot=sum(Object.values(CUR.prod),o=>o.rev)||1;
 const l=Object.entries(CUR.prod).map(([n,o])=>({n,...o,m:o.rev?o.profit/o.rev*100:0,share:o.rev/tot*100})).filter(x=>(!PP.cat||x.cat===PP.cat)&&(!q||x.n.toLowerCase().includes(q)));
 l.sort((a,b)=>{const x=a[PP.k],y=b[PP.k];return(typeof x==='string'?x.localeCompare(y):x-y)*PP.d});
 return l;
}
function ppSort(k){if(PP.k===k)PP.d=-PP.d;else{PP.k=k;PP.d=(k==='n'||k==='cat')?1:-1}ppRender()}

}

/* ---------- Telusur semua baris Ringkasan Penjualan ---------- */
const RSD_T={sub:'Penjualan Kotor',svc:'Biaya Pelayanan (service)',tax:'Pajak',rnd:'Pembulatan',pend:'Total Pendapatan',cD:'Harga Pelanggan & Grup',autoD:'Promo Otomatis',vD:'Voucher',pD:'Tukar Poin',manD:'Diskon Manual Kasir',cmp:'Komplimen',promo:'Total Biaya Promosi',gross:'Total Penjualan',ref:'Pengembalian',omzet:'Total Penjualan Bersih',lain:'Pajak, service dan pembulatan',net:'Penjualan setelah diskon',cogs:'HPP',lk:'Laba Kotor per nota',fMdr:'MDR Metode Bayar',fSvc:'Biaya Layanan / Komisi Platform',fAdm:'Biaya Administrasi Platform',fShip:'Ongkir Ditanggung Toko',fees:'Total Biaya Layanan & Platform',gaji:'Gaji Karyawan',komisi:'Komisi Karyawan',opex:'Total Biaya Operasional',cin:'Uang Masuk Lain',nop:'Pengeluaran Non-Operasional'};
function rsData(k){
 const[a,b]=range(),d=agg(a,b),tx=d.tx,rf=d.rf,out=[];
 const T=f=>tx.forEach(t=>{const v=f(t);if(v)out.push({ts:t.ts,id:t.id,ref:t.no||t.id,desc:typeLabel(t.type,t.channel)+' · '+(t.cashier||''),v})});
 const Rf=f=>rf.forEach(r=>{const v=f(r);if(v)out.push({ts:r.ts,ref:'Refund '+(r.txNo||''),desc:'Pengembalian · '+(r.cashier||''),v})});
 const cg=t=>sum(t.items,i=>i.qty*(i.cogs||0)),rcg=r=>sum(r.items,i=>i.qty*(i.cogs||0)),fv=f=>t=>(t.fee&&t.fee[f]||0)*(feeNet(t)/(t.feeTot||1));
 const nett=t=>(t.net||0)*(1-cRatio(t)),gr=t=>t.total-(t.compAmt||0),tx_=t=>t.taxIncl?0:(t.tax||0);
 const pay=(which)=>(D.payroll||[]).filter(p=>p.status==='paid'&&p.paidTs&&+p.paidTs>=a&&+p.paidTs<b).forEach(p=>{const c=+p.comm||0,g=Math.max(0,(+p.total||0)-c),v=which==='gaji'?g:c;if(v)out.push({ts:+p.paidTs,ref:p.empName||'',desc:'Penggajian '+(p.period||''),v})});
 const cashL=(type,cat,incPay)=>d.cs.filter(x=>x.type===type&&(cat==null||(x.cat||'Lainnya')===cat)).forEach(x=>out.push({ts:x.ts,ref:cashAcc(x),desc:(x.cat||'Lainnya')+(x.sub?' › '+x.sub:'')+(x.note?' · '+x.note:''),v:+x.amount||0}));
 switch(k){
  case'sub':T(t=>(t.subtotal||0)+(t.custDisc||0));break;
  case'svc':T(t=>t.service||0);break;
  case'tax':T(tx_);break;
  case'rnd':T(t=>t.rounding||0);break;
  case'pend':T(t=>(t.subtotal||0)+(t.custDisc||0)+(t.service||0)+tx_(t)+(t.rounding||0));break;
  case'cD':T(t=>t.custDisc||0);break;case'autoD':T(t=>t.autoDisc||0);break;case'vD':T(t=>t.voucherDisc||0);break;case'pD':T(t=>t.ptDisc||0);break;case'manD':T(t=>t.manualDisc||0);break;case'cmp':T(t=>t.compAmt||0);break;
  case'promo':T(t=>(t.custDisc||0)+(t.autoDisc||0)+(t.voucherDisc||0)+(t.ptDisc||0)+(t.manualDisc||0)+(t.compAmt||0));break;
  case'gross':T(gr);break;case'ref':Rf(r=>r.amount);break;
  case'omzet':T(gr);Rf(r=>-r.amount);break;
  case'lain':T(t=>gr(t)-nett(t));Rf(r=>-(r.amount-(r.net||0)));break;
  case'net':T(nett);Rf(r=>-(r.net||0));break;
  case'cogs':T(cg);Rf(r=>-rcg(r));break;
  case'lk':T(t=>nett(t)-cg(t));Rf(r=>-((r.net||0)-rcg(r)));break;
  case'fMdr':T(fv('mdr'));break;case'fSvc':T(fv('svc'));break;case'fAdm':T(fv('adm'));break;case'fShip':T(fv('ship'));break;
  case'fees':T(t=>fv('mdr')(t)+fv('svc')(t)+fv('adm')(t)+fv('ship')(t));break;
  case'gaji':pay('gaji');break;case'komisi':pay('komisi');break;
  case'opex':cashL('out',null);pay('gaji');pay('komisi');break;
  case'cin':cashL('in',null);break;
  case'nop':[...(D.cf||[]),...D.cash].filter(x=>x.type==='out'&&x.nonop&&x.ts>=a&&x.ts<b).forEach(x=>out.push({ts:x.ts,ref:x.acc?accName(x.acc):accName(accOf(x.m||(x.src==='luar'?'luar':'tunai'))),desc:(x.cat||'Lainnya')+(x.sub?' › '+x.sub:'')+(x.note?' · '+x.note:''),v:+x.amount||0}));break;
  default:
   if(k.indexOf('cin:')===0)cashL('in',k.slice(4));
   else if(k.indexOf('nop:')===0)[...(D.cf||[]),...D.cash].filter(x=>x.type==='out'&&x.nonop&&x.ts>=a&&x.ts<b&&(x.cat||'Lainnya')===k.slice(4)).forEach(x=>out.push({ts:x.ts,ref:accName(x.acc),desc:(x.cat||'Lainnya')+(x.sub?' › '+x.sub:'')+(x.note?' · '+x.note:''),v:+x.amount||0}));
 }
 return out.sort((x,y)=>x.ts-y.ts);
}
function rsd(enc){

 const title=RSD_T[k]||(k.indexOf('cin:')===0?'Uang masuk · '+k.slice(4):k.indexOf('nop:')===0?'Non-operasional · '+k.slice(4):k);
 let run=0;const sg=v=>(v<0?'−':'')+rp(Math.abs(v));
 dlg(`<h3>${esc(title)}</h3><div class="mut" style="margin-bottom:10px">Riwayat · ${esc(perLabel())} · ${l.length} baris. Angka di baris sama dengan yang dijumlahkan di laporan.</div>
 <div class="tw">${l.length?`<table><tr><th>Waktu</th><th>Nota / rekening</th><th>Keterangan</th><th class="r">Nilai</th><th class="r">Total berjalan</th></tr>${l.map(x=>{run+=x.v;return`<tr ${x.id?`class="cl" onclick="txDetail('${x.id}')"`:''}><td>${fmtT(x.ts)}</td><td>${esc(x.ref||'—')}</td><td>${esc(x.desc||'')}</td><td class="r">${sg(x.v)}</td><td class="r">${sg(run)}</td></tr>`}).join('')}<tr class="ft"><td colspan="3">Total</td><td class="r">${sg(run)}</td><td></td></tr></table>`:'<div class="empty">Tidak ada catatan pada periode ini</div>'}</div>
 <div class="acts2"><button class="btn" onclick="rsdCsv()">${ic('dl',16)} CSV</button><button class="btn" onclick="closeDlg()">Tutup</button></div>`,true);
}
function rsdCsv(){const k=window._rsdk||'';csv('Riwayat-'+(RSD_T[k]||k),[['Waktu','Nota / rekening','Keterangan','Nilai'],...rsData(k).map(x=>[fmtT(x.ts),x.ref||'',x.desc||'',x.v])])}

/* ---------- Laporan Pajak & Service Charge ---------- */
const LPJ={k:'pajak',g:'hari'};
function lpData(id){
 const B=bukuRows(id),g=LPJ.g,key=ts=>{const d=dk(ts);return g==='bulan'?d.slice(0,7):d},M={};
 B.rows.forEach(r=>{const k=key(r.ts),o=M[k]||(M[k]={k,cr:0,dr:0});o.cr+=r.cr;o.dr+=r.dr});
 const rows=Object.values(M).sort((a,b)=>a.k<b.k?-1:1);
 return{B,rows,cr:sum(B.rows,r=>r.cr),dr:sum(B.rows,r=>r.dr)};
}

 const kpi=`<div class="kg"><div class="kc"><small>Saldo awal periode</small><b>${rp(d.B.open)}</b></div><div class="kc"><small>${nm} dipungut</small><b>${rp(d.cr)}</b></div><div class="kc"><small>Disetor / dikurangi (retur)</small><b>${rp(d.dr)}</b></div><div class="kc"><small>Belum disetor (saldo akhir)</small><b style="color:var(--${d.B.close>0?'warn,#b45309':'ok'})">${rp(d.B.close)}</b></div></div>`;
 const tool=`<div class="tool"><select onchange="LPJ.g=this.value;render()"><option value="hari" ${LPJ.g==='hari'?'selected':''}>Per hari</option><option value="bulan" ${LPJ.g==='bulan'?'selected':''}>Per bulan</option></select><span class="mut" style="font-size:12.5px">Penjualan periode ini ${rp(jual)}${jual>0?' · '+nm+' efektif '+pct.toFixed(1)+'%':''}</span><span style="margin-left:auto"><button class="btn" onclick="lpCsv()">${ic('dl',16)} CSV</button></span></div>`;

 const hint=`<div class="hint">${nm} yang dipungut dari pelanggan adalah <b>kewajiban</b>, bukan pendapatan. Saat disetor, catat lewat Pengeluaran (Pembayaran pajak) supaya saldo "belum disetor" turun.${id==='pajak'?' Pajak yang sudah termasuk di harga (inklusif) tidak dipisah di sini.':''}</div>`;

/* ---------- Laporan Persediaan ---------- */
const LS={k:'all',q:'',nol:false};
function lsGroups(){
 const L=(D.products||[]).filter(p=>p.trackStock!==false&&p.active!==false||p.trackStock!==false&&(+p.stock||0)!==0);
 const g=p=>p.bahan?((p.recipe||[]).length?'semi':'mentah'):'jadi';
 const rows=L.map(p=>{const st=+p.stock||0,h=+p.cogs||0;return{id:p.id,n:p.name||'',cat:p.cat||'Umum',u:p.unit||'',st,h,v:Math.round(st*h),g:g(p)}});
 return rows;
}
function lsFiltered(){const q=LS.q.toLowerCase();return lsGroups().filter(r=>(LS.k==='all'||r.g===LS.k)&&(!LS.nol||r.st!==0)&&(!q||(r.n+' '+r.cat).toLowerCase().includes(q)))}
const LSN={jadi:'Barang jadi',mentah:'Bahan baku (mentah)',semi:'Setengah jadi'};
function vLapStok(){
 const all=lsGroups(),tot=k=>sum(all.filter(r=>k==='all'||r.g===k),r=>r.v),cnt=k=>all.filter(r=>k==='all'||r.g===k).length;
 let led=0;try{led=jSaldo(jSums(0,Date.now()+1),'persediaan')}catch(e){}
 const fis=tot('all'),df=fis-led,minus=all.filter(r=>r.st<0).length,notrack=(D.products||[]).filter(p=>p.trackStock===false).length;
 const chips=`<div class="chips" style="margin-bottom:12px">${[['all','Semua'],['jadi','Barang jadi'],['mentah','Bahan baku'],['semi','Setengah jadi']].map(([k,l])=>`<button class="chip ${LS.k===k?'on':''}" onclick="LS.k='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>`;
 const kpi=`<div class="kg"><div class="kc"><small>Total nilai persediaan</small><b>${rp(fis)}</b></div><div class="kc"><small>Barang jadi</small><b>${rp(tot('jadi'))}</b></div><div class="kc"><small>Bahan baku</small><b>${rp(tot('mentah'))}</b></div><div class="kc"><small>Setengah jadi</small><b>${rp(tot('semi'))}</b></div></div>`;
 const rec=`<div class="card" style="margin-bottom:12px"><div class="tw"><table><tr><th>Rekonsiliasi dengan pembukuan</th><th class="r">Nilai</th></tr><tr><td>Nilai stok fisik (stok × HPP)</td><td class="r">${rp(fis)}</td></tr><tr><td>Saldo Persediaan di jurnal (1-3000)</td><td class="r">${rp(led)}</td></tr><tr><td><b>Selisih</b> ${Math.abs(df)>1?'<span class="mut">— dicatat sebagai penyesuaian di Neraca. Isi nilai persediaan awal atau catat pembelian agar selisih mengecil.</span>':'<span class="badge g">Sama</span>'}</td><td class="r"><b style="color:var(--${Math.abs(df)>1?'bad':'ok'})">${rp(df)}</b></td></tr></table></div></div>`;
 const warn=(minus?`<div class="hint">${minus} item punya stok minus. Lakukan koreksi/opname di Produk &amp; Stok.</div>`:'')+(notrack?`<div class="hint">${notrack} produk tidak melacak stok, jadi tidak ikut dihitung.</div>`:'');
 const tool=`<div class="tool"><input placeholder="Cari nama atau kategori…" value="${esc(LS.q)}" oninput="LS.q=this.value;lsRows()">${chk('ls_nol','Sembunyikan stok 0',LS.nol,"LS.nol=this.checked;lsRows()")}<span style="margin-left:auto"><button class="btn" onclick="lsCsv()">${ic('dl',16)} CSV</button></span></div>`;
 return chips+kpi+rec+warn+`<div class="card">${tool}<div class="tw" id="lst">${lsTable()}</div></div>`;
}
function lsTable(){
 const l=lsFiltered().sort((a,b)=>a.g.localeCompare(b.g)||b.v-a.v);
 if(!l.length)return'<div class="empty">Tidak ada data persediaan.</div>';
 let h='<table><tr><th>Nama</th><th>Kelompok</th><th>Kategori</th><th class="r">Stok</th><th class="r">HPP / satuan</th><th class="r">Nilai</th></tr>',cur='';
 const gs={};l.forEach(r=>{gs[r.g]=(gs[r.g]||0)+r.v});
 l.forEach(r=>{if(r.g!==cur){cur=r.g;h+=`<tr style="background:var(--bg2,#f1f5f9)"><td colspan="5"><b>${LSN[r.g]}</b></td><td class="r"><b>${rp(gs[r.g])}</b></td></tr>`}
  h+=`<tr><td>${esc(r.n)}</td><td>${LSN[r.g]}</td><td>${esc(r.cat)}</td><td class="r" style="${r.st<0?'color:var(--bad)':''}">${fq(r.st)} ${esc(r.u)}</td><td class="r">${rp(r.h)}</td><td class="r"><b>${rp(r.v)}</b></td></tr>`});
 return h+`<tr><td colspan="5"><b>Total</b></td><td class="r"><b>${rp(sum(l,r=>r.v))}</b></td></tr></table>`;
}
function lsRows(){const e=document.getElementById('lst');if(e)e.innerHTML=lsTable()}
function lsCsv(){csv('Laporan-Persediaan',[['Nama','Kelompok','Kategori','Satuan','Stok','HPP','Nilai'],...lsFiltered().sort((a,b)=>a.g.localeCompare(b.g)||b.v-a.v).map(r=>[r.n,LSN[r.g],r.cat,r.u,r.st,r.h,r.v])])}

function pkRows(){
 const days=+PM.pk||30,a=Date.now()-days*864e5,u={};
 const add=(id,q,src)=>{if(!id||!(q>0))return;const o=u[id]||(u[id]={sale:0,prod:0});o[src]+=q};
 const rc={};D.products.forEach(p=>{if(!p.bahan&&(p.recipe||[]).length&&p.trackStock===false)rc[p.id]=p.recipe});
 D.tx.forEach(t=>{if(t.inv||!(t.ts>=a))return;(t.items||[]).forEach(i=>{const r=rc[i.pid];if(r)r.forEach(b=>add(b.id,(+i.qty||0)*(+b.q||0),'sale'))})});
 (D.stocklog||[]).forEach(x=>{if(x.ts>=a&&x.type==='out'&&/^\[PRODUKSI\]/.test(x.note||''))add(x.id,Math.abs(+x.delta||+x.qty||0),'prod')});
 return Object.entries(u).map(([id,o])=>{const b=D.products.find(x=>x.id===id)||{},q=o.sale+o.prod;return{name:b.name||'(dihapus)',unit:b.unit||'',sale:o.sale,prod:o.prod,q,val:Math.round(q*(+b.cogs||0))}}).sort((x,y)=>y.val-x.val||y.q-x.q);
}

function ovRead(kind,what){
 const out=[],seen={};
 for(const r of document.querySelectorAll('#ov_'+kind+' .ovrow')){
  const name=r.querySelector('.on').value.trim(),pv=r.querySelector('.op').value.trim(),cv=r.querySelector('.oc').value.trim();
  if(!name&&!pv&&!cv&&!ovRecs(r).length)continue;
  if(!name)return{err:'Nama '+what+' belum diisi'};
  const price=pv===''?0:+pv,cogs=cv===''?0:+cv;
  if(isNaN(price)||isNaN(cogs)||cogs<0)return{err:'Harga/modal '+what+' "'+name+'" tidak valid'};
  if(seen[name.toLowerCase()])return{err:'Nama '+what+' dobel: '+name};
  seen[name.toLowerCase()]=1;
  const o={name:name,price:Math.round(price),cogs:Math.round(cogs)},rc=ovRecs(r);
  if(rc.length)o.recipe=rc;
  if(kind==='v'&&r.querySelector('.om').value==='sendiri'&&rc.length)o.rm='sendiri';
  out.push(o);
 }
 return{list:out};
}
function ovSave(id,btn){

 if($('#ov_v').querySelectorAll('.om').length&&[...$('#ov_v').querySelectorAll('.ovrow')].some(r=>r.querySelector('.om').value==='sendiri'&&!ovRecs(r).length)&&!confirm('Ada varian bermode "resep sendiri" tanpa bahan. Varian itu akan memakai resep produk. Lanjut simpan?'))return;
 safe(()=>pushPost('product',{id:id,name:p.name,variants:vs.list,toppings:ts.list,vabs:sel}),btn);
}

function bkNum(s){s=String(s==null?'':s).replace(/rp/ig,'').replace(/\s/g,'');if(!s)return null;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?NaN:n}
function bkCsv(txt){
 txt=txt.replace(/^\uFEFF/,'').replace(/^sep=.?\r?\n/i,'');
 const first=txt.split(/\r?\n/).find(x=>x.trim())||'';
 const c=[[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===c){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows;
}

function bkRead(f){

 const proc=rows=>{

  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));

  const g=(r,k)=>k>=0?String(r[k]==null?'':r[k]).trim():'';
  BK.rows=rows.slice(1).map(r=>({id:g(r,c.id),sku:g(r,c.sku),name:g(r,c.name),qty:bkNum(g(r,c.qty)),bp:c.bp>=0?bkNum(g(r,c.bp)):null,note:g(r,c.note).slice(0,40)}));
  bkPrev();
 };
 rd.onload=e=>{
  try{
   if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
   else proc(bkCsv(String(e.target.result||'')));

 };

function bkPrev(){

 });

function lpPlatData(d){
 const R={},row=c=>R[c]||(R[c]={c,n:0,gross:0,ref:0,svc:0,adm:0,ship:0,mdr:0});
 lpTx(d).forEach(t=>{
  if(t.type!=='online'||!t.channel)return;
  const o=row(t.channel),k=t.feeTot?feeNet(t)/t.feeTot:0,f=t.fee||{};
  o.n++;o.gross+=(t.total||0)-(t.compAmt||0);o.ref+=t.refunded||0;
  o.svc+=(f.svc||0)*k;o.adm+=(f.adm||0)*k;o.ship+=(f.ship||0)*k;o.mdr+=(f.mdr||0)*k;
 });
 /* metode bayar tambahan berjenis "komisi platform" (mis. Shopee, Grabfood sebagai metode bayar) */
 const svcM={};pmxL().forEach(x=>{if(x&&x.kind==='svc')svcM[x.id]=x.name});
 lpTx(d).forEach(t=>{
  const pm=t.fee&&t.fee.pm;if(!pm)return;const k=t.feeTot?feeNet(t)/t.feeTot:0,seen={};
  (t.payments||[]).forEach(p=>{const nm=svcM[p.m];if(!nm)return;const o=row('pm:'+p.m);o.pmName=nm+' (metode bayar)';o.gross+=p.ap||0;o.ref+=(t.refunded||0)*(p.ap||0)/(t.total||1);if(!seen[p.m]){seen[p.m]=1;o.n++;o.svc+=(pm[p.m]||0)*k}});
 });
 return Object.values(R).map(o=>{const pot=o.svc+o.adm+o.ship+o.mdr;return{...o,name:o.pmName||CH[o.c]||o.c,pot,net:o.gross-o.ref-pot,acc:o.pmName?(CMAP()[String(o.c).slice(3)]&&BANKS().some(x=>x.id===CMAP()[String(o.c).slice(3)])?CMAP()[String(o.c).slice(3)]:''):chAcc({type:'online',channel:o.c})}}).sort((a,b)=>b.gross-a.gross);
}

 <tr class="ft"><td>Total</td><td class="r">${T('n')}</td><td class="r">${rp(T('gross'))}</td><td class="r">${rp(T('ref'))}</td><td class="r">${rp(Math.round(T('svc')))}</td><td class="r">${rp(Math.round(T('adm')))}</td><td class="r">${rp(Math.round(T('ship')))}</td><td class="r">${rp(Math.round(T('mdr')))}</td><td class="r">${rp(Math.round(T('pot')))}</td><td class="r">${rp(Math.round(T('net')))}</td><td></td></tr></table></div></div>`;

/* -- metode pembayaran -- */
function lpMetodeData(d){
 const tx=lpTx(d),rf=lpRf(d),R={},row=m=>R[m]||(R[m]={n:0,inn:0,ref:0,mdr:0});
 tx.forEach(t=>{
  const pays=t.payments||[],kk=t.feeTot?feeNet(t)/t.feeTot:0,mdrT=(t.fee&&t.fee.mdr||0)*(feeNet(t)/(t.feeTot||1)),pmx=t.fee&&t.fee.pm;
  const el=pays.filter(p=>['tunai','kasbon','komplimen'].indexOf(p.m)<0),base=sum(el,p=>p.ap),seen={},pdone={};
  pays.forEach(p=>{const o=row(p.m);o.inn+=p.ap;if(!seen[p.m]){o.n++;seen[p.m]=1}
   if(pmx){if(!pdone[p.m]){pdone[p.m]=1;o.mdr+=(pmx[p.m]||0)*kk}}
   else if(base>0&&el.indexOf(p)>=0)o.mdr+=mdrT*p.ap/base});
 });
 rf.forEach(r=>{row(r.method).ref+=r.amount});
 const l=Object.entries(R).map(([m,o])=>({m,name:METHODS[m]||m,...o,net:o.inn-o.ref,after:o.inn-o.ref-o.mdr}));
 l.sort((a,b)=>b.net-a.net);return l;
}
function lpMetode(d){

 lpTx(d).forEach(t=>t.payments.forEach(p=>{if(p.m==='komplimen')return;const k=dk(t.ts),o=days[k]||(days[k]={});o[p.m]=(o[p.m]||0)+p.ap}));
 lpRf(d).forEach(r=>{const k=dk(r.ts),o=days[k]||(days[k]={});o[r.method]=(o[r.method]||0)-r.amount});
 const dks=Object.keys(days).sort().reverse().slice(0,31);
 return`<div class="kg"><div class="kc hero"><small>Penerimaan bersih · ${esc(perLabel())}</small><b>${rp(tot)}</b><div style="margin-top:6px;opacity:.9">${real.length} metode dipakai</div></div>

 const o={v:null,t:[],old:true},pr=(D.products||[]).find(x=>x.id===i.pid);if(!pr)return o;
 (pr.variants||[]).forEach(v=>{if(!o.v&&i.name===pr.name+' ('+v.name+')')o.v={n:v.name,p:+v.price||0}});

const ymNow=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const ymRange=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return[new Date(a[0],a[1]-1,1).getTime(),new Date(a[0],a[1],1).getTime()]};
const ymLabel=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};

/*ENGINE-START*/
function commCfg(){
 const d={active:false,mode:'tier',tierType:'marginal',basis:'personal',flat:2,tiers:[{from:0,rate:1},{from:10000000,rate:2},{from:25000000,rate:3}],fallback:true},c=D.commission||{};
 return Object.assign(d,c,{tiers:(c.tiers&&c.tiers.length)?c.tiers:d.tiers});
}
function marg(x,tiers){
 const t=[...tiers].sort((a,b)=>a.from-b.from);let s=0;
 t.forEach((r,i)=>{const hi=i+1<t.length?+t[i+1].from:Infinity,part=Math.max(0,Math.min(x,hi)-(+r.from||0));s+=part*(+r.rate||0)/100});
 return s;
}
function commOf(sales,team,cfg){
 if(!cfg.active||!(sales>0))return 0;
 if(cfg.mode==='flat')return sales*(+cfg.flat||0)/100;
 const t=[...cfg.tiers].sort((a,b)=>a.from-b.from),ref=cfg.basis==='team'?team:sales;
 if(cfg.tierType==='cliff'){let r=0;t.forEach(x=>{if(ref>=(+x.from||0))r=+x.rate||0});return sales*r/100}
 const tot=marg(ref,t);
 return cfg.basis==='team'?(ref>0?sales*tot/ref:0):tot;
}
function commAgg(ym){
 const rg=ymRange(ym),a=rg[0],b=rg[1],cfg=commCfg(),E=D.employees||[],byName={};
 E.forEach(e=>byName[nm_(e.name)]=e);
 const rows={};let un=0,tot=0;
 D.tx.filter(t=>t.ts>=a&&t.ts<b).forEach(t=>{
  const eff=(t.net||0)*(1-cRatio(t))*(1-Math.min(1,(t.refunded||0)/(t.total||1)));
  if(!(eff>0))return;tot+=eff;
  let sv=(t.servers||[]).filter(x=>x&&(x.id||x.name));
  if(!sv.length&&cfg.fallback){const e=byName[nm_(t.cashier)];if(e)sv=[{id:e.id,name:e.name}]}
  if(!sv.length){un+=eff;return}
  const sh=eff/sv.length;
  sv.forEach(x=>{
   const e=E.find(z=>z.id===x.id)||byName[nm_(x.name)],key=e?e.id:'n:'+x.name;
   const o=rows[key]||(rows[key]={key,id:e?e.id:'',name:e?e.name:x.name,e,n:0,sales:0,tx:[]});
   o.n++;o.sales+=sh;o.tx.push({t,share:sh,k:sv.length});
  });
 });
 E.filter(e=>e.active!==false).forEach(e=>{if(!rows[e.id])rows[e.id]={key:e.id,id:e.id,name:e.name,e,n:0,sales:0,tx:[]}});
 const L=Object.values(rows);
 L.forEach(o=>o.elig=!!(o.e&&o.e.comm!==false));
 const team=sum(L.filter(o=>o.elig),o=>o.sales);
 L.forEach(o=>{o.c=o.elig?Math.round(commOf(o.sales,team,cfg)):0;o.rate=o.sales>0?o.c/o.sales*100:0});
 return{cfg,rows,team,tot,un};
}
function daysPresent(e,ym){
 const rg=ymRange(ym),n=nm_(e.name),s=new Set();
 D.shifts.forEach(x=>{if(x.openTs>=rg[0]&&x.openTs<rg[1]&&nm_(x.name)===n)s.add(dk(x.openTs))});
 return s.size;
}
function payRec(e,ym){return(D.payroll||[]).find(p=>p.empId===e.id&&p.period===ym)}
function payCalc(e,ym,ca,ov){
 const r=Object.assign({},payRec(e,ym)||{},ov||{});
 if(r.status==='paid'&&!ov)return{days:r.days,base:+r.base||0,allow:+r.allow||0,comm:+r.comm||0,bonus:+r.bonus||0,ded:+r.deduct||0,total:+r.total||0,rec:r,paid:true};
 const harian=e.payType==='harian',days=(r.days!==undefined&&r.days!==''&&r.days!==null)?+r.days:daysPresent(e,ym);
 const base=harian?Math.round((+e.salary||0)*days):(+e.salary||0),allow=+e.allowance||0,row=ca.rows[e.id],comm=row?row.c:0,bonus=+r.bonus||0,ded=+r.deduct||0;
 return{days:harian?days:'',base,allow,comm,bonus,ded,total:base+allow+comm+bonus-ded,rec:r,paid:false};
}

const ruleTxt=c=>!c.active?'Belum diaktifkan':c.mode==='flat'?'Tarif tetap '+fq(c.flat)+'% dari penjualan':'Bertingkat ('+(c.tierType==='cliff'?'naik kelas':'progresif')+', dasar '+(c.basis==='team'?'total tim':'penjualan pribadi')+'): '+[...c.tiers].sort((a,b)=>a.from-b.from).map(t=>'≥ '+rp(t.from)+' → '+fq(t.rate)+'%').join(' · ');
function nextTier(ref,c){

 const t=[...c.tiers].sort((a,b)=>a.from-b.from).find(x=>+x.from>ref);
 return t?'Kurang '+rp(t.from-ref)+' ke tingkat '+fq(t.rate)+'%':'Tingkat tertinggi tercapai';
}

function hutStok(){
 const[a,b]=range(),st=sum((D.stocklog||[]).filter(x=>x.type==='add'&&+x.buyPrice>0&&x.ts>=a&&x.ts<b&&/^\[HUTANG\]/i.test(x.note||'')&&!/^\[FB\]/i.test(x.note||'')),x=>Math.round((+x.delta||+x.qty||0)*(+x.buyPrice))),fb=sum(PUR().filter(f=>f.ts>=a&&f.ts<b),purLeft);
 return st+fb;

const SUP=()=>D.suppliers||[],PUR=()=>D.purchases||[];
const purPaid=f=>sum(f.payments||[],p=>+p.amount||0);
const purRet=f=>sum(f.returns||[],r=>+r.amount||0),purRefund=f=>sum(f.returns||[],r=>+r.refund||0);
const purNet=f=>Math.max(0,(+f.total||0)-purRet(f));
const purRaw=f=>(+f.total||0)-purRet(f)-purPaid(f)+purRefund(f);
const purLeft=f=>Math.max(0,Math.round(purRaw(f)));
const supDp=id=>{const sp=SUP().find(x=>x.id===id);return Math.round(sum((sp&&sp.dps)||[],d=>+d.amount||0)-sum(PUR().filter(f=>f.supplierId===id),f=>sum((f.payments||[]).filter(p=>p.dp),p=>+p.amount||0)))};
const purSt=f=>purLeft(f)<=0?'lunas':purPaid(f)>0?'sebagian':'hutang';
const PST={lunas:['Lunas','g'],sebagian:['Sebagian','k'],hutang:['Belum dibayar','v']};
const dts=s=>s?new Date(s+'T12:00:00').getTime():Date.now();
const FB={st:''};
function purNo(){
 const n=new Date(),pre='FB-'+n.getFullYear()+p2(n.getMonth()+1)+'-';let mx=0;
 PUR().forEach(f=>{if(String(f.no).indexOf(pre)===0)mx=Math.max(mx,parseInt(String(f.no).slice(pre.length),10)||0)});
 return pre+String(mx+1).padStart(3,'0');
}

function itmPool(m){return m==='pur'?D.products.filter(p=>p.trackStock!==false):D.products.filter(p=>p.active!==false)}
function itmJ(p){return p&&p.bahan?'bahan':'produk'}
function itmCatOf(p){return p.cat||p.category||'Umum'}
function itmCatOpts(m,j,sel){const c=[...new Set(itmPool(m).filter(p=>itmJ(p)===j).map(itmCatOf))].sort((a,b)=>String(a).localeCompare(String(b)));return`<option value="">Semua kategori (${c.length})</option>`+c.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
function itmItemOpts(m,j,cat,sel){const l=itmPool(m).filter(p=>itmJ(p)===j&&(!cat||itmCatOf(p)===cat)).sort((a,b)=>String(a.name).localeCompare(String(b.name)));return`<option value="">— pilih ${j==='bahan'?'bahan baku':'produk'} —</option>`+l.map(p=>`<option value="${esc(p.id)}" data-c="${+p.cogs||0}" data-pr="${+p.price||0}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.unit||'')})</option>`).join('')}
function itmPick(it,m){
 const cur=it&&D.products.find(p=>p.id===it.pid),j=cur?itmJ(cur):(window._itmJ||'produk'),cat=cur?itmCatOf(cur):'';
 const pk=m==='pur'?'purPick':'sinPick';
 return`<div class="pf" style="grid-column:1/-1;display:grid;grid-template-columns:132px 1fr;gap:6px"><select class="pj" onchange="itmChg(this,'${m}',1)"><option value="produk" ${j==='produk'?'selected':''}>Produk</option><option value="bahan" ${j==='bahan'?'selected':''}>Bahan Baku</option></select><select class="pc" onchange="itmChg(this,'${m}')">${itmCatOpts(m,j,cat)}</select></div><select class="pp" style="grid-column:1/-1" onchange="${pk}(this)">${itmItemOpts(m,j,cat,it&&it.pid)}</select>`;
}
function itmChg(el,m,jenis){
 const r=el.closest('.prow'),j=r.querySelector('.pj').value;window._itmJ=j;
 const pc=r.querySelector('.pc');if(jenis)pc.innerHTML=itmCatOpts(m,j,'');

 (m==='pur'?purTot:sinTot)();

function purPick(sel){const r=sel.parentNode,pb=r.querySelector('.pb'),c=sel.selectedOptions[0]&&sel.selectedOptions[0].dataset.c;if(pb&&!pb.value&&+c>0)pb.value=c;purTot()}
function purAdd(){const r=$('#p_rows');if(r.children.length>=60){alert('Maksimal 60 barang per faktur');return}r.insertAdjacentHTML('beforeend',purRow());purBx()}
function purBx(){const c=$('#p_bx'),on=!!(c&&c.checked);document.querySelectorAll('#p_rows .pbx').forEach(x=>x.style.display=on?'grid':'none')}
function purItems(){return[...document.querySelectorAll('#p_rows .prow')].map(r=>{const id=r.querySelector('.pp').value,p=D.products.find(x=>x.id===id);return{pid:id,name:p?p.name:'',unit:p?p.unit:'',qty:+r.querySelector('.pq').value||0,price:+r.querySelector('.pb').value||0,...(((!$('#p_bx')||$('#p_bx').checked)&&/^\d{4}-\d{2}-\d{2}$/.test(r.querySelector('.pe').value))?{ex:r.querySelector('.pe').value,bn:r.querySelector('.pn').value.trim().slice(0,30)}:{})}}).filter(x=>x.pid&&x.qty>0)}
function purCalc(items){items=items||purItems();const sub=Math.round(sum(items,x=>x.qty*x.price)),disc=Math.min(sub,Math.max(0,Math.round(+v('p_disc')||0))),ship=Math.max(0,Math.round(+v('p_ship')||0)),pct=Math.max(0,+v('p_tax')||0),tax=Math.round((sub-disc)*pct/100);return{sub,disc,ship,pct,tax,total:sub-disc+ship+tax}}
function purTot(){const c=purCalc(),e=$('#p_tot'),d=$('#p_det');if(e)e.textContent=rp(c.total);if(d)d.textContent=(c.disc||c.ship||c.tax)?'Barang '+rp(c.sub)+(c.disc?' − diskon '+rp(c.disc):'')+(c.ship?' + ongkir '+rp(c.ship):'')+(c.tax?' + PPN '+rp(c.tax):''):'';purPayUi()}
function purTerm(){const t=+v('p_term');if(t>0){const d=new Date(dts(v('p_date')));d.setDate(d.getDate()+t);$('#p_due').value=dk(d.getTime())}else if(t===0)$('#p_due').value=''}
function purPayUi(){const m=v('p_pay'),w=$('#p_amtw'),h=$('#p_payh');if(!w)return;w.style.display=m==='sebagian'?'':'none';const t=purCalc().total;if(h)h.textContent=m==='lunas'?'Dibayar '+rp(t)+' dan tercatat sebagai pengeluaran kas.':m==='dp'?'Memakai saldo uang muka pemasok. Tidak ada uang keluar lagi. Sisanya tetap hutang.':m==='hutang'?'Belum ada uang keluar. Tercatat sebagai hutang ke pemasok.':'Sisa hutang mengikuti jumlah yang belum dibayar.'}

 <div class="acts2"><button class="btn pri" onclick="${ed?`purEditSave('${ed.id}',this)`:'purSave(this)'}">${ed?'Simpan Perubahan':'Simpan Faktur'}</button><button class="btn" onclick="closeDlg()">Batal</button></div>`,true);

async function purSave(btn){
 const sp=SUP().find(x=>x.id===v('p_sup'));if(!sp){alert('Pilih pemasok');return}
 const items=purItems();
 if(!items.length){alert('Isi minimal satu barang (pilih produk dan jumlah)');return}
 if(items.length>60){alert('Maksimal 60 barang per faktur');return}
 const C=purCalc(items),total=C.total,no=v('p_no').trim()||purNo();
 if(PUR().some(f=>f.no===no)){alert('Nomor faktur sudah dipakai');return}
 const mode=v('p_pay');let amt=mode==='lunas'?total:mode==='sebagian'?Math.min(total,Math.max(0,+v('p_amt')||0)):mode==='dp'?Math.min(total,Math.max(0,supDp(sp.id))):0;
 if(mode==='sebagian'&&!(amt>0)){alert('Isi jumlah yang dibayar');return}
 if(mode==='dp'&&!(amt>0)){alert('Pemasok ini tidak punya saldo uang muka');return}
 const rec={id:'fb'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),no,ts:dts(v('p_date')),supplierId:sp.id,supplierName:sp.name,items,sub:C.sub,disc:C.disc,ship:C.ship,taxPct:C.pct,tax:C.tax,total,payments:amt>0?[mode==='dp'?{ts:Date.now(),amount:amt,acc:'',method:'Uang muka',dp:true}:{ts:Date.now(),amount:amt,acc:v('p_acc'),method:v('p_acc')?accName(v('p_acc')):'Tidak dicatat'}]:[],due:v('p_due')?dts(v('p_due')):0,note:v('p_note').trim(),stock:ck('p_stk'),...(v('p_acct')?{acct:v('p_acct')}:{}),by:cfg.nm||''};
 btn.disabled=true;btn.textContent='Menyimpan…';let stokOk=false;
 try{
  if(rec.stock){await pushPost('stock_bulk',{mode:'add',hppMode:'avg',note:'[FB] '+no,items:items.map(x=>({id:x.pid,qty:x.qty,buyPrice:C.sub>0?Math.round(x.price+(C.ship-C.disc)*(x.price/C.sub)):x.price,note:('[FB] '+no+' · '+sp.name).slice(0,100)}))});stokOk=true}
  if(rec.stock){
   const g={};items.forEach(x=>{if(x.ex)(g[x.pid]=g[x.pid]||[]).push({id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),no:x.bn||'',exp:x.ex,q:x.qty,ts:Date.now(),ref:no})});
   for(const pid of Object.keys(g)){const pr=D.products.find(z=>z.id===pid);if(pr)try{await pushPost('product',{id:pid,name:pr.name,bt:(pr.bt||[]).concat(g[pid])})}catch(e){alert('Faktur tersimpan, tetapi batch '+pr.name+' gagal dicatat: '+e.message+'\nCatat manual di Atur Stok.')}}
  }
  await pushPost('purchase',rec);
  if(rec.payments[0]&&rec.payments[0].acc){try{await cfBuy(rec.payments[0].acc,rec.payments[0].amount,'Faktur '+no+' · '+sp.name,'fb:'+rec.id,rec.payments[0].ts);scheduleLoad()}catch(e){alert('Faktur tersimpan, tetapi catatan arus kas gagal: '+e.message+'\nCatat manual di Arus Kas & Rekening.')}}
  closeDlg();render();
 }catch(e){
  btn.disabled=false;btn.textContent='Simpan Faktur';
  alert(stokOk?'Stok sudah bertambah, tetapi faktur belum tersimpan: '+e.message+'\n\nSimpan ulang faktur ini dengan MENGHILANGKAN centang “Tambah stok produk otomatis”, supaya stok tidak bertambah dua kali.':'Gagal menyimpan: '+e.message);

function lrData(d){

  const out=l.filter(r=>r.v||l.some(k=>k.m.parent===r.m.id&&ids.has(k.m.id)));
  out.forEach(r=>{r.kids=out.filter(k=>k.m.parent===r.m.id);r.sub=r.v+sum(r.kids,k=>k.v);r.dp=r.m.parent&&out.some(p=>p.m.id===r.m.parent)?1:0});

const SIN=()=>D.sinvoices||[];
const sinPaid=f=>sum(f.payments||[],p=>+p.amount||0);
const sinRet=f=>sum(f.returns||[],r=>+r.amount||0),sinRefund=f=>sum(f.returns||[],r=>+r.refund||0);
const sinRaw=f=>(+f.total||0)-sinRet(f)-sinPaid(f)+sinRefund(f);
const sinLeft=f=>Math.max(0,Math.round(sinRaw(f)));
const sinSt=f=>sinLeft(f)<=0?'lunas':sinPaid(f)>0?'sebagian':'hutang';
const SPST={lunas:['Lunas','g'],sebagian:['Sebagian','k'],hutang:['Belum dibayar','v']};
const FJ={st:''};
const custKey=t=>t.customerId||(t.customer&&t.customer.id)||('n:'+(t.custName||(t.customer&&t.customer.name)||'Pelanggan umum'));
const custNm=t=>t.custName||(t.customer&&t.customer.name)||'Pelanggan umum';
function sinTx(f){
 const rt={};(f.returns||[]).forEach(r=>(r.items||[]).forEach(i=>rt[i.pid]=(rt[i.pid]||0)+(+i.qty||0)));
 const items=[];(f.items||[]).forEach(i=>{let q=+i.qty||0;const take=Math.min(q,rt[i.pid]||0);if(take){rt[i.pid]-=take;q-=take}if(q>0)items.push({name:i.name,unit:i.unit||'',qty:q,price:+i.price||0,cogs:+i.cogs||0,cat:i.cat||'Umum'})});
 const rv=sinRet(f),rtax=sum(f.returns||[],r=>+r.tax||0),sub=items.length?sum(items,i=>i.qty*i.price):0,tax=Math.max(0,(+f.tax||0)-rtax),tot=Math.max(0,(+f.total||0)-rv);
 return{id:'fj'+f.id,inv:true,no:f.no,ts:f.ts,cashier:'Faktur',type:'faktur',channel:'',customerId:f.customerId,custName:f.customerName,items,subtotal:sub,manualDisc:+f.disc||0,rounding:+f.ship||0,tax,taxIncl:false,service:0,total:tot,net:tot-tax,payments:[{m:'faktur',ap:tot}],status:'paid'};

function kbData(){
 const paid={};CFS().filter(x=>x.type==='in'&&/^kb:/.test(x.ref||'')).forEach(x=>{const k=x.ref.slice(3);paid[k]=(paid[k]||0)+(+x.amount||0)});

 Object.values(by).forEach(o=>{o.tx.sort((x,y)=>x.ts-y.ts);let p=o.paid;o.open=[];o.tx.forEach(x=>{const u=Math.min(p,x.a);p-=u;if(x.a-u>0)o.open.push({ts:x.ts,a:x.a-u})});o.total=sum(o.tx,x=>x.a);o.left=sum(o.open,x=>x.a)});
 return by;
}
function piuData(){

 SIN().filter(f=>sinLeft(f)>0).forEach(f=>{const r=R(f.customerId||('n:'+f.customerName),f.customerName||'-'),l=sinLeft(f);r.a[age(f.due||f.ts)]+=l;r.t+=l;r.fk+=l;r.n++});
 Object.values(kbData()).forEach(o=>{if(!(o.left>0))return;const r=R(o.key,o.name);o.open.forEach(x=>{r.a[age(x.ts)]+=x.a});r.t+=o.left;r.kb+=o.left;r.n++});

}

function purEdit(id){const f=PUR().find(x=>x.id===id);if(!f)return;closeDlg();purForm(f.supplierId,f)}
function sinEdit(id){const f=SIN().find(x=>x.id===id);if(!f)return;closeDlg();sinForm(f.customerId,f)}
const trk=pid=>{const p=D.products.find(x=>x.id===pid);return!!p&&p.trackStock!==false};
function qtyByPid(items){const m={};(items||[]).forEach(i=>{m[i.pid]=(m[i.pid]||0)+(+i.qty||0)});return m}
function retQty(f){const m={};(f.returns||[]).forEach(r=>(r.items||[]).forEach(i=>{m[i.pid]=(m[i.pid]||0)+(+i.qty||0)}));return m}
function stockDelta(oldItems,newItems){const o=qtyByPid(oldItems),n=qtyByPid(newItems),d={};Object.keys(Object.assign({},o,n)).forEach(k=>{const x=Math.round(((n[k]||0)-(o[k]||0))*1000)/1000;if(x&&trk(k))d[k]=x});return d}
function editChecks(f,items,total,partner){
 const rq=retQty(f),nq=qtyByPid(items);
 for(const k of Object.keys(rq)){if((nq[k]||0)<rq[k]-1e-9){const it=(f.items||[]).find(i=>i.pid===k);alert('Barang "'+(it?it.name:k)+'" sudah diretur '+fq(rq[k])+', jadi jumlahnya tidak boleh kurang dari itu.');return false}}
 const paid=sum(f.payments||[],p=>+p.amount||0),rt=sum(f.returns||[],r=>+r.amount||0),rf=sum(f.returns||[],r=>+r.refund||0);
 if(total-rt-(paid-rf)<0){alert('Total baru ('+rp(total)+') lebih kecil dari yang sudah '+partner+' ('+rp(paid-rf)+' + retur '+rp(rt)+'). Koreksi pembayaran/retur dulu, atau naikkan totalnya.');return false}
 return true;
}

let RET=null;
function retCalc(f,lines){
 const sub=f.sub!=null?+f.sub:sum(f.items||[],i=>i.qty*i.price),k=sub>0?1-(+f.disc||0)/sub:1,pct=+f.taxPct||0,g=sum(lines,l=>l.qty*l.price)*k;
 return{amount:Math.round(g*(1+pct/100)),tax:Math.round(g*pct/100)};
}

function prodnForm(pre){

function prodnNeed(){const p=D.products.find(x=>x.id===v('pr_p')),q=+v('pr_q')||0;if(!p)return null;return{p,q,rows:(p.recipe||[]).map(r=>{const b=D.products.find(x=>x.id===r.id);return{b,id:r.id,need:Math.round(r.q*q*1000)/1000}}).filter(x=>x.b)}}
function prodnHint(){const n=prodnNeed(),h=$('#pr_h');if(!n||!h)return;const auto=n.p.trackStock===false&&!n.p.bahan?'<div class="note" style="margin-bottom:6px">Produk ini tidak menghitung stok sendiri: bahannya sudah terpotong otomatis setiap terjual di kasir. Jangan catat produksi untuk produk ini, nanti bahan terpotong dua kali. Pakai Produksi hanya untuk produk yang menghitung stok.</div>':'';h.innerHTML=auto+(n.q>0?n.rows.map(x=>`${esc(x.b.name)}: pakai <b>${fq(x.need)} ${esc(x.b.unit||'')}</b> (stok ${fq(+x.b.stock||0)})`+((+x.b.stock||0)<x.need?' <span class="badge v">kurang</span>':'')).join('<br>'):'Isi jumlah hasil produksi.')}
async function prodnSave(btn){

 if(n.p.trackStock===false&&!n.p.bahan&&!confirm('Produk ini memotong bahan otomatis saat terjual. Mencatat produksi akan memotong bahan sekali lagi. Tetap lanjutkan?'))return;

const BH={rows:[]};
function bhTpl(){
 bkSave('Template-Bahan-Baku',[['Nama','Satuan','Stok Awal','Harga Beli per Satuan (HPP)','Batas Stok Menipis','Kategori'],['Tepung terigu','gram',5000,12,1000,'Bahan'],['Gula pasir','gram',2000,15,500,'Bahan'],['Telur','butir',60,2200,12,'Bahan']]);

function bhOpen(){
 BH.rows=[];
 dlg(`<h3>Impor Bahan Baku</h3>
 <div class="mut" style="font-size:13.5px;line-height:1.5">1. Unduh template. 2. Hapus 3 baris contoh, isi bahan Anda (satu bahan per baris). 3. Simpan (tetap .xlsx atau CSV), lalu unggah di bawah.<br>Semua bahan otomatis ditandai <b>Bahan baku</b> dan tidak tampil di kasir. Nama yang sudah ada dilewati.</div>
 <div class="acts2" style="margin-top:10px"><button class="btn" onclick="bhTpl()">${ic('dl',16)} Unduh template bahan baku</button></div>
 <label>Unggah file Excel / CSV</label><input type="file" id="bh_file" accept=".xlsx,.xls,.csv,.txt" onchange="bhRead(this.files[0])">
 <div id="bh_prev" style="margin-top:12px"></div>
 <div class="acts2"><button class="btn" onclick="closeDlg()">Batal</button><button class="btn pri" id="bh_go" disabled onclick="bhApply(this)">Buat Bahan Baku</button></div>`,true);
}
function bhRead(f){
 if(!f)return;const el=$('#bh_prev'),rd=new FileReader(),isX=/\.xlsx?$/i.test(f.name);
 if(isX&&!window.XLSX){el.innerHTML='<div class="mut" style="color:var(--bad)">Pembaca Excel belum termuat (cek internet). Simpan file sebagai CSV lalu unggah lagi.</div>';return}
 const proc=rows=>{
  BH.rows=[];
  if(rows.length<2){el.innerHTML='<div class="mut">File kosong atau formatnya tidak dikenali.</div>';bhPrev();return}
  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));
  const c={name:ix('nama'),unit:ix('satuan'),stock:ix('stok'),cogs:ix('harga'),min:ix('batas'),cat:ix('kategori')};
  if(c.name<0){el.innerHTML='<div class="mut" style="color:var(--bad)">Kolom Nama tidak ditemukan. Pakai template dari tombol di atas.</div>';bhPrev();return}
  const g=(r,k)=>k>=0?String(r[k]==null?'':r[k]).trim():'';
  BH.rows=rows.slice(1).map(r=>({name:g(r,c.name),unit:g(r,c.unit)||'gram',stock:bkNum(g(r,c.stock)),cogs:bkNum(g(r,c.cogs)),min:bkNum(g(r,c.min)),cat:g(r,c.cat)||'Bahan'})).filter(r=>r.name);
  bhPrev();
 };
 rd.onload=e=>{try{
  if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
  else proc(bkCsv(String(e.target.result||'')));
 }catch(err){el.innerHTML='<div class="mut" style="color:var(--bad)">File tidak bisa dibaca: '+esc(err.message)+'</div>'}};
 isX?rd.readAsArrayBuffer(f):rd.readAsText(f);
}
function bhPrev(){
 const el=$('#bh_prev'),go=$('#bh_go');if(!el)return;
 const have=new Set(D.products.map(p=>String(p.name).trim().toLowerCase())),seen=new Set();BH.ok=[];
 const out=BH.rows.map(r=>{
  const k=r.name.toLowerCase();let st='ok',msg='';
  if(have.has(k)){st='skip';msg='Nama sudah ada'}else if(seen.has(k)){st='skip';msg='Dobel di file'}
  else if((r.stock!=null&&isNaN(r.stock))||(r.cogs!=null&&isNaN(r.cogs))||(r.min!=null&&isNaN(r.min))){st='bad';msg='Ada angka yang tidak valid'}
  else if((r.stock||0)<0||(r.cogs||0)<0){st='bad';msg='Tidak boleh minus'}
  seen.add(k);if(st==='ok')BH.ok.push(r);return{r,st,msg};
 });
 el.innerHTML=BH.rows.length?`<div style="margin-bottom:8px"><span class="badge g">${BH.ok.length} akan dibuat</span> ${out.length-BH.ok.length?`<span class="badge v">${out.length-BH.ok.length} dilewati</span>`:''}</div><div class="tw" style="max-height:34vh;overflow:auto"><table><tr><th>Bahan</th><th>Satuan</th><th class="r">Stok awal</th><th class="r">HPP</th><th>Status</th></tr>${out.slice(0,300).map(o=>`<tr><td>${esc(o.r.name)}</td><td>${esc(o.r.unit)}</td><td class="r">${fq(o.r.stock||0)}</td><td class="r">${rp(o.r.cogs||0)}</td><td>${o.st==='ok'?'<span class="badge g">Baru</span>':'<span class="badge v">'+esc(o.msg)+'</span>'}</td></tr>`).join('')}</table></div>`:'';
 if(go)go.disabled=!BH.ok.length;
}
async function bhApply(btn){
 if(!BH.ok.length)return;btn.disabled=true;let n=0;
 try{
  for(const r of BH.ok){
   btn.textContent='Membuat '+n+'/'+BH.ok.length+'…';
   await pushQuiet('product',{id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:r.name,sku:'',cat:r.cat,unit:r.unit,price:0,cogs:r.cogs||0,stock:r.stock||0,minStock:r.min||0,trackStock:true,active:true,bahan:true,recipe:[],updated:Date.now(),initStock:r.stock||0});
   n++;
  }
  closeDlg();scheduleLoad();render();alert(n+' bahan baku dibuat.');
 }catch(e){btn.disabled=false;btn.textContent='Buat Bahan Baku';alert('Berhenti setelah '+n+' bahan: '+e.message+'\n\nBahan yang sudah terbuat tidak akan dobel kalau Anda unggah ulang (nama yang sama dilewati).');scheduleLoad()}
}

function ipOpts(str,what){
 const out=[],seen={};const parts=String(str||'').split(/[\n;|]+/).map(x=>x.trim()).filter(Boolean);

  out.push({name:name,price:Math.round(pr),cogs:Math.round(cg)})}
 return{list:out}}

 if(go)go.disabled=!IP.ok.length;

 <label style="margin-top:8px">Isi paket</label><div id="f_pk">${(p.paket||[]).map(r=>pkRow(r,id)).join('')}</div><button class="btn sm" onclick="pkAdd('${id}')">${ic('plus',14)} Tambah isi</button><div class="hint" id="f_pkh"></div>
 ${chk('pk_act','Aktif dijual di kasir',p.active!==false)}
 <div class="acts2"><button class="btn pri" onclick="pktSave('${id}',this)">Simpan</button>${id?`<button class="btn del" onclick="delProd('${id}')">Hapus</button>`:''}<button class="btn" onclick="closeDlg()">Batal</button></div>`,true);
 pkCost();
}
function pktSave(id,btn){
 const name=v('pk_name').trim(),price=v('pk_price'),rows=pkRows();
 if(!name){alert('Isi nama paket');return}
 if(price===''||!(+price>=0)){alert('Isi harga jual paket');return}
 if(!rows.length){alert('Tambahkan minimal satu isi paket');return}
 if(D.products.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){alert('Nama sudah dipakai produk lain');return}
 safe(()=>push('product',{id:id||'pk'+Date.now().toString(36),name,sku:'',cat:v('pk_cat').trim()||'Paket',unit:v('pk_unit').trim()||'paket',price:+price,cogs:pkCostVal(rows),stock:0,minStock:0,trackStock:false,active:ck('pk_act'),bahan:false,recipe:[],paket:rows,recAuto:false,updated:Date.now(),initStock:0}),btn);
}

/* ---------- Biaya & Metode Bayar (sinkron dengan kasir) ---------- */
const BXD={mdr:['qris','debit','kredit','transfer','ewallet'],chan:Object.keys(CH)};
function bxFees(){const f=(D.outlet&&D.outlet.fees)||{};return f}
function vMBayar(){
 const F=bxFees(),mg=(k,a)=>((F.mdr||{})[k]||{})[a]||0,cg=(k,a)=>((F.chan||{})[k]||{})[a]||0,l=pmxL();
 return`<div class="note">Atur sekali di sini, kasir ikut setelah sinkron. Potongan dicatat otomatis di tiap nota, mengurangi saldo rekening tujuan, dan tampil di laporan (Laporan Penjualan: Metode Pembayaran dan Platform Online). Rekening tujuan diatur di <b>Arus Kas &amp; Rekening → Atur Penjualan → Rekening</b>.</div>
 <div class="card"><div class="tool"><b>Metode Bayar Tambahan</b><button class="btn pri" style="margin-left:auto" onclick="bxForm()">${ic('plus',16)} Tambah Metode</button></div>
 <div class="tw">${l.length?`<table><tr><th>Nama</th><th class="r">Potongan %</th><th class="r">Tambahan Rp</th><th>Dicatat sebagai</th><th>Status</th><th></th></tr>${l.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="r">${+x.pct||0}%</td><td class="r">${rp(+x.flat||0)}</td><td>${x.kind==='svc'?'Komisi platform':'MDR'}</td><td>${x.active===false?'<span class="badge">Nonaktif</span>':'<span class="badge ok">Aktif</span>'}</td><td class="r"><button class="btn sm" onclick="bxForm('${esc(x.id)}')">Ubah</button></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada metode tambahan. Contoh: ShopeePay, OVO, Voucher.</div>'}</div></div>
 <div class="card"><h4>Potongan Metode Bayar (MDR)</h4><p>Dipotong penyedia pembayaran dari uang yang diterima toko. Tagihan pelanggan tidak berubah.</p>
 <div class="g2">${BXD.mdr.map(k=>fld('bx_m_'+k+'_p',METHODS[k]+' · persen (%)',mg(k,'pct'),'number')+fld('bx_m_'+k+'_f',METHODS[k]+' · tambahan Rp per transaksi',mg(k,'flat'),'number')).join('')}</div></div>
 <div class="card"><h4>Potongan Platform Online</h4><p>Dipotong platform dari tiap pesanan online.</p>
 ${BXD.chan.map(k=>`<div style="margin-bottom:10px"><b>${CH[k]}</b><div class="g2">${fld('bx_c_'+k+'_s','Komisi / biaya layanan (% dari penjualan)',cg(k,'svc'),'number')}${fld('bx_c_'+k+'_a','Biaya administrasi (Rp per pesanan)',cg(k,'adm'),'number')}${fld('bx_c_'+k+'_o','Ongkir ditanggung toko (Rp per pesanan)',cg(k,'ship'),'number')}</div></div>`).join('')}</div>
 <div class="acts2"><button class="btn pri" onclick="bxSave(this)">Simpan Potongan</button></div>`;
}
function bxReadFees(){
 const g=id=>Math.max(0,parseFloat(v(id))||0),f={mdr:{},chan:{}};
 BXD.mdr.forEach(k=>f.mdr[k]={pct:Math.min(100,g('bx_m_'+k+'_p')),flat:g('bx_m_'+k+'_f')});
 BXD.chan.forEach(k=>f.chan[k]={svc:Math.min(100,g('bx_c_'+k+'_s')),adm:g('bx_c_'+k+'_a'),ship:g('bx_c_'+k+'_o')});
 return f;
}
function bxPush(fees,pmx,btn){return safe(()=>push('outlet',{...(D.outlet||{}),fees,pmx,fts:Date.now()}),btn)}
function bxSave(btn){bxPush(bxReadFees(),pmxL(),btn)}
function bxForm(id){
 const x=pmxL().find(y=>y.id===id)||{name:'',pct:0,flat:0,active:true};
 dlg(`<h3>${id?'Ubah':'Tambah'} Metode Bayar</h3><div class="g2">${fld('bx_n','Nama (mis. ShopeePay)',x.name)}${fld('bx_p','Potongan (%) dari nominal',x.pct,'number')}${fld('bx_f','Potongan tambahan Rp per transaksi',x.flat,'number')}<div><label>Dicatat sebagai</label><select id="bx_k"><option value="mdr" ${x.kind!=='svc'?'selected':''}>Biaya metode bayar (MDR)</option><option value="svc" ${x.kind==='svc'?'selected':''}>Komisi / biaya platform</option></select></div><div><label>Status</label><select id="bx_a"><option value="1" ${x.active!==false?'selected':''}>Aktif (tampil di kasir)</option><option value="0" ${x.active===false?'selected':''}>Nonaktif</option></select></div></div>
 <div class="mut" style="margin-top:8px">Metode yang dinonaktifkan hilang dari kasir, tetapi riwayat transaksinya tetap ada.</div>
 <div class="acts2"><button class="btn pri" onclick="bxSaveM('${id||''}',this)">Simpan</button><button class="btn" onclick="closeDlg()">Batal</button></div>`);
}
function bxSaveM(id,btn){
 const name=v('bx_n').trim();if(!name){alert('Isi nama metode');return}
 const lc=name.toLowerCase();
 if(Object.values(METHODS_BASE).some(n=>n.toLowerCase()===lc)||pmxL().some(y=>y.id!==id&&String(y.name).toLowerCase()===lc)){alert('Nama itu sudah dipakai metode lain');return}
 const rec={id:id||'m_'+Math.random().toString(36).slice(2,8),name:name.slice(0,30),pct:Math.min(100,Math.max(0,parseFloat(v('bx_p'))||0)),flat:Math.max(0,parseFloat(v('bx_f'))||0),kind:v('bx_k')==='svc'?'svc':'mdr',active:v('bx_a')!=='0'};
 const l=id?pmxL().map(y=>y.id===id?rec:y):[...pmxL(),rec];
 if(l.length>30){alert('Maksimal 30 metode');return}
 bxPush((D.outlet&&D.outlet.fees)||bxReadFeesSafe(),l,btn);
}
function bxReadFeesSafe(){const f={mdr:{},chan:{}};BXD.mdr.forEach(k=>f.mdr[k]={pct:0,flat:0});BXD.chan.forEach(k=>f.chan[k]={svc:0,adm:0,ship:0});return f}

/* ---------- Akun Kasir (sinkron dengan Staf di POS) ---------- */
const STR={owner:'Owner',supervisor:'Supervisor',kasir:'Kasir',pelayan:'Pelayan'};
const stList=()=>((D.staff&&Array.isArray(D.staff.list))?D.staff.list:[]);
function vStaf(){
 const l=stList();
 return`<div class="note">Akun login di kasir. Perubahan di sini ikut ke semua kasir setelah mereka sinkron, dan perubahan Staf di kasir juga muncul di sini. PIN hanya dilihat saat diubah. Jangan bagikan layar ini.${l.length?'':'<br><b>Belum ada data akun dari kasir.</b> Buka kasir, tambah atau ubah satu staf (atau tunggu sinkron), lalu muat ulang halaman ini. Bila menambah dari sini, pastikan ada satu akun Owner.'}</div>
 <div class="card"><div class="tool"><span class="mut">${l.length} akun</span><button class="btn pri" style="margin-left:auto" onclick="stForm()">${ic('plus',16)} Tambah Akun</button></div>
 <div class="tw">${l.length?`<table><tr><th>Nama</th><th>Peran</th><th>PIN</th><th></th></tr>${l.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(STR[s.role]||s.role)}</td><td>••••••</td><td class="r"><button class="btn sm" onclick="stForm('${esc(s.id)}')">Ubah</button></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada akun</div>'}</div></div>`;
}
function stForm(id){
 const s=stList().find(x=>x.id===id)||{name:'',role:'kasir'};
 dlg(`<h3>${id?'Ubah':'Tambah'} Akun Kasir</h3><div class="g2">${fld('st_name','Nama',s.name)}<div><label>Peran</label><select id="st_role">${Object.entries(STR).map(([k,t])=>`<option value="${k}" ${s.role===k?'selected':''}>${t}</option>`).join('')}</select></div>${fld('st_pin',id?'PIN baru (kosongkan bila tidak diubah)':'PIN (6 digit angka)','','password','','maxlength="6" inputmode="numeric" autocomplete="new-password"')}</div>
 <div class="acts2"><button class="btn pri" onclick="stSave('${id||''}',this)">Simpan</button>${id?`<button class="btn del" onclick="stDel('${esc(id)}',this)">Hapus</button>`:''}<button class="btn" onclick="closeDlg()">Batal</button></div>`);
}
function stPush(l,btn){return safe(async()=>{try{await push('staff',{id:'staff',list:l,sts:Date.now(),upd:Date.now()})}catch(e){if(/tidak dikenal/i.test(String(e&&e.message)))throw new Error('Server toko ini belum mendukung Akun Kasir dari Backoffice. Kelola lewat kasir (Pengaturan, Staf).');throw e}},btn)}
function stSave(id,btn){
 const name=v('st_name').trim(),role=v('st_role'),pin=v('st_pin').trim(),l=stList().map(x=>({...x}));
 if(!name){alert('Isi nama');return}
 if(pin&&!/^\d{6}$/.test(pin)){alert('PIN harus 6 digit angka');return}
 let o=l.find(x=>x.id===id);
 if(!o){if(!/^\d{6}$/.test(pin)){alert('Isi PIN 6 digit angka');return}o={id:'s'+Date.now().toString(36)};l.push(o)}
 o.name=name.slice(0,40);o.role=role;if(pin)o.pin=pin;
 if(!l.some(x=>x.role==='owner')){alert('Harus ada minimal satu akun Owner');return}
 stPush(l,btn);
}
function stDel(id,btn){
 const l=stList().filter(x=>x.id!==id);
 if(!l.some(x=>x.role==='owner')){alert('Owner terakhir tidak bisa dihapus');return}
 if(!confirm('Hapus akun ini? Nota lama tetap menyimpan namanya.'))return;
 stPush(l,btn);
}

/* ---------- Order Jasa (data dari kasir) ---------- */
let JS={q:'',f:''};
const jsLast=j=>Math.max(0,(j.steps||[]).length-1);
const jsDone=j=>(j.steps||[]).length&&(+j.i||0)>=jsLast(j);
function jsStat(j){return(j.steps||[])[+j.i||0]||'-'}
function vJasa(){
 const all=(D.jobs||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)),q=JS.q.toLowerCase();
 const L=all.filter(j=>(!q||((j.no||'')+' '+(j.name||'')+' '+(j.wa||'')+' '+(j.desc||'')).toLowerCase().includes(q))&&(!JS.f||(JS.f==='done'?jsDone(j):!jsDone(j)))).slice(0,300);
 const open=all.filter(j=>!jsDone(j)).length;
 return`<div class="kg"><div class="kc"><small>Total order jasa</small><b>${all.length}</b></div><div class="kc"><small>Sedang dikerjakan</small><b style="color:var(--${open?'warn':'ok'})">${open}</b></div><div class="kc"><small>Selesai</small><b style="color:var(--ok)">${all.length-open}</b></div></div>
 <div class="card"><div class="note">Order jasa dibuat dan diperbarui di kasir. Di sini hanya untuk dilihat. Data baru muncul setelah kasir menyinkronkan.</div>
 <div class="tool"><input placeholder="Cari nomor, pelanggan, layanan…" value="${esc(JS.q)}" oninput="JS.q=this.value;clearTimeout(window._jt);window._jt=setTimeout(render,300)"><select onchange="JS.f=this.value;render()"><option value="">Semua</option><option value="open" ${JS.f==='open'?'selected':''}>Sedang dikerjakan</option><option value="done" ${JS.f==='done'?'selected':''}>Selesai</option></select></div>
 <div class="tw">${L.length?`<table><tr><th>No</th><th>Pelanggan</th><th>Layanan</th><th>Status</th><th>Pembayaran</th><th>Dibuat</th></tr>${L.map(j=>`<tr class="cl" onclick="jsView('${esc(j.id)}')"><td>${esc(j.no||'-')}</td><td>${esc(j.name||'-')}${j.wa?'<div class="mut" style="font-size:12px">'+esc(j.wa)+'</div>':''}</td><td>${esc(j.desc||'-')}</td><td><span class="badge ${jsDone(j)?'ok':'warn'}">${esc(jsStat(j))}</span></td><td>${j.pay&&j.pay.l?esc(j.pay.l):'-'}</td><td>${fmtDT(j.ts||0)}</td></tr>`).join('')}</table>`:'<div class="mut" style="padding:14px">Belum ada order jasa.</div>'}</div></div>`;
}
function jsView(id){
 const j=(D.jobs||[]).find(x=>x.id===id);if(!j)return;
 const st=j.steps||[],cur=+j.i||0,h=(j.hist||[]).slice().sort((a,b)=>a.ts-b.ts);
 dlg(`<h3>Order ${esc(j.no||'')} · ${esc(j.name||'')}</h3><div class="mut" style="margin-bottom:8px">${j.wa?esc(j.wa)+' · ':''}dibuat ${fmtDT(j.ts||0)}${j.by?' oleh '+esc(j.by):''}</div>
 <div style="margin-bottom:10px"><b>Layanan:</b> ${esc(j.desc||'-')}</div>
 <div style="margin-bottom:10px"><b>Pembayaran:</b> ${j.pay&&j.pay.l?esc(j.pay.l):'-'}</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${st.map((s,i)=>`<span class="badge ${i<cur?'ok':i===cur?'warn':''}">${esc(s)}</span>`).join('')}</div>
 ${h.length?`<div class="tw"><table><tr><th>Waktu</th><th>Tahap</th></tr>${h.map(x=>`<tr><td>${fmtDT(x.ts)}</td><td>${esc(st[x.i]||'-')}</td></tr>`).join('')}</table></div>`:''}
 <div class="acts2"><button class="btn" onclick="closeDlg()">Tutup</button></div>`,true);
}

(async function init(){
 if(baseUrl()&&cfg.hp&&cfg.pin&&idleMin()&&Date.now()-idleLast()>idleMin()*60000){cfg.pin='';cfg.nm='';saveCfg();try{clearCache()}catch(e){}}
 if(baseUrl()&&cfg.hp&&cfg.pin){
  $('#app').innerHTML='<div class="lock"><div class="lockbox" style="text-align:center">Memuat data…</div></div>';
  const c=await readCache();
  if(c){
   await loadFitur(baseUrl(),true);D=buildD();start();
   load().then(()=>{if(!$('#dlg').classList.contains('on')&&!MG.includes(tab))render()}).catch(e=>{if(/salah|dikunci|Terlalu|Ditolak/i.test(String(e&&e.message))){cfg.pin='';saveCfg();D=null;render()}});
   return;
  }
  try{await load();start();return}catch(e){}
 }
 render();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!busy&&Date.now()-loadedAt>60000&&!$('#dlg').classList.contains('on')&&!MG.includes(tab))load().then(render).catch(()=>{})});
</script>
