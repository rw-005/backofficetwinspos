<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--hd1:#1a44cc;--hd2:#2f6df5;--sh:0 6px 24px rgba(20,40,100,.08);--side:linear-gradient(180deg,#1a44cc,#0f2a7a)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;min-height:44px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--pri)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 5px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
svg{flex-shrink:0;vertical-align:middle}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.mut{color:var(--mut)}
.logo{font-weight:800;letter-spacing:.2em;font-size:19px}.logo span{font-weight:300;margin-left:.3em}
.shell{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.side .brand{padding:22px 22px 12px}.side .brand small{display:block;opacity:.65;font-size:12px;margin-top:2px;letter-spacing:.04em}
.ng{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}.chv{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform .2s}.gp.shut .chv{transform:rotate(-45deg);margin-top:0}.gp.shut .ni{display:none}.ng{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:16px 22px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:12px;margin:2px 12px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,.86);background:none;border:0;width:calc(100% - 24px);text-align:left;cursor:pointer;font-weight:600;font-size:14.5px}
.ni:hover{background:rgba(255,255,255,.12)}
.ni.on{background:#fff;color:#1a44cc;box-shadow:0 6px 16px rgba(0,0,40,.25)}
[data-theme=dark] .ni.on{background:#1d2f63;color:#fff}
.sf{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.14)}
.sf .who{font-size:13px;opacity:.85;margin-bottom:10px}
.sf .acts{display:flex;gap:8px}
.sf .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:38px;padding:7px 11px;font-size:13px;flex:1}
.main{flex:1;min-width:0}
.tb{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--bd)}
.tb h2{margin:0;font-size:21px;font-weight:800}.tb .sub{font-size:13px;color:var(--mut)}
.tb .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
.hb{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);place-items:center;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:55}
.content{padding:20px 26px 40px;max-width:1500px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 17px;white-space:nowrap;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.kc small{display:block;color:var(--mut);font-size:13px}.kc b{font-size:21px;font-weight:800;display:block}
.kc .dlt{display:inline-block;margin-top:2px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.kc.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border:0;padding:22px}.kc.hero small{color:rgba(255,255,255,.85)}.kc.hero b{font-size:34px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h4{margin:0 0 4px;font-size:16px;font-weight:800}.card p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tool input{flex:1;min-width:200px}.tool select{width:auto;min-width:150px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--pri)}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.ft td{font-weight:800;border-top:2px solid var(--bd);background:var(--soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri)}
.badge.v{background:#fde4e8;color:var(--bad)}.badge.k{background:#fff0d1;color:var(--warn)}.badge.g{background:#dcf5e6;color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px}
.chart .c{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:linear-gradient(180deg,var(--hd2),var(--hd1));border-radius:6px 6px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:10.5px;color:var(--mut)}.axis span{flex:1;min-width:6px;text-align:center;overflow:hidden}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hd1),var(--hd2))}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rk{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.grow{flex:1;min-width:0}.val{text-align:right;font-weight:700}.val small{display:block;color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0 9px 26px;border-bottom:1px solid var(--bd);position:relative}.ins li:last-child{border:0}.ins li:before{content:'💡';position:absolute;left:0}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lockbox{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#dlg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:80}
#dlg.on{display:flex}
#dlgb{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#dlgb.wide{max-width:920px}
#dlgb h3{margin:0 0 8px}
.sumbox div{display:flex;justify-content:space-between;padding:2px 0;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.acts2{display:flex;gap:8px;margin-top:16px}.acts2 .btn{flex:1}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.strk{background:#fff;color:#111;border:1px dashed #bbb;border-radius:8px;padding:14px;font:12px/1.45 'Courier New',monospace;white-space:pre-wrap;margin:12px auto 0;max-width:300px}
.strk.w80{max-width:380px}
.note{background:var(--soft);border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px}
@media(max-width:1000px){
 .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s}
 .side.open{transform:none}.side.open~.scrim{display:block}
 .hb{display:grid}.tb{padding:12px 14px}.content{padding:14px 14px 40px}
 .two{grid-template-columns:1fr}.kc.hero b{font-size:28px}.tb .r{display:none}
}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.rs-s{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.rs-h{padding:13px 14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:14px}
.rs-h.g{background:rgba(18,161,80,.13)}.rs-h.y{background:rgba(217,138,6,.15)}.rs-h.b{background:rgba(36,87,245,.12)}.rs-h.p{background:rgba(124,58,237,.13)}
.rs-r{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--bd);font-size:14px}
.rs-r span:last-child{text-align:right;white-space:nowrap}
.rs-r.tot{font-weight:800}
.rs-k .kc{border-bottom-width:4px}
.kc.k1{border-bottom-color:#00c897}.kc.k2{border-bottom-color:#f5c518}.kc.k3{border-bottom-color:#0b84e5}.kc.k4{border-bottom-color:#6cb8f5}.kc.k5{border-bottom-color:#7c3aed}.kc.k6{border-bottom-color:#12a150}
.rs-h.o{background:rgba(229,56,79,.12)}
</style>
<style id="modern">
:root{--bg:#f4f6fc;--sh:0 1px 2px rgba(16,28,72,.04),0 10px 32px rgba(16,28,72,.07);--side:linear-gradient(185deg,#2457f5 0%,#1637a8 55%,#0d2160 100%)}
[data-theme=dark]{--bg:#060914;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.4);--side:linear-gradient(185deg,#12275e 0%,#0a1535 55%,#050914 100%)}
html,body{background:var(--bg);letter-spacing:-.005em}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.content{animation:fin .35s ease both}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* sidebar */
.side{box-shadow:6px 0 30px rgba(13,33,96,.18)}
.side .brand{padding:26px 24px 14px}.logo{letter-spacing:.34em;font-size:20px;font-weight:800}.logo span{font-weight:300;letter-spacing:.34em}
.side .brand small{opacity:.7;letter-spacing:.02em}
.ng{opacity:.5;letter-spacing:.16em;font-size:10.5px;padding:20px 24px 6px}
.ni{border-radius:14px;padding:11px 14px;transition:background .18s,transform .18s,box-shadow .18s}
.ni:hover{background:rgba(255,255,255,.14);transform:translateX(2px)}
.ni.on{background:#fff;color:#1a44cc;box-shadow:0 8px 20px rgba(5,15,60,.28)}
[data-theme=dark] .ni.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 #5b8cff}
.sf{border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.12)}
/* top bar */
.tb{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.tb h2{font-size:22px;letter-spacing:-.02em}
/* cards */
.card{border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.card h4{font-size:16.5px;letter-spacing:-.01em}
.kc{border-radius:20px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.kc:hover{transform:translateY(-2px)}
.kc b{letter-spacing:-.02em}
.kc.hero{border:0;background:linear-gradient(135deg,#1a44cc 0%,#3b7bff 100%);box-shadow:0 18px 40px rgba(36,87,245,.32)}
.kc.hero:before,.kc.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.kc.hero:before{width:240px;height:240px;right:-60px;top:-110px}.kc.hero:after{width:150px;height:150px;right:120px;bottom:-90px;background:rgba(255,255,255,.07)}
.kc.hero b{font-size:38px;letter-spacing:-.03em}
.rs-s{border-radius:20px;box-shadow:var(--sh);border-color:color-mix(in srgb,var(--bd) 70%,transparent)}
.note{border-radius:14px;border:1px solid color-mix(in srgb,var(--pri) 18%,transparent)}
/* tombol & chip */
.btn{border-radius:13px;transition:transform .12s,box-shadow .18s,background .18s}
.btn:hover{box-shadow:0 4px 14px rgba(20,40,100,.12)}.btn:active{transform:scale(.97)}
.btn.pri,.btn.on{background:linear-gradient(135deg,#2457f5,#3b7bff);border-color:transparent;box-shadow:0 6px 16px rgba(36,87,245,.3)}
.chip{padding:9px 18px;border-color:transparent;background:var(--card);box-shadow:0 1px 3px rgba(16,28,72,.08);transition:all .18s}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,#2457f5,#3b7bff);box-shadow:0 6px 16px rgba(36,87,245,.3)}
input,select{border-radius:13px;border-color:transparent;background:color-mix(in srgb,var(--soft) 70%,var(--card));transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 16%,transparent);background:var(--card)}
/* tabel */
th{font-size:11.5px;letter-spacing:.08em;border-bottom:1px solid var(--bd)}
td{border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}
tr.cl:hover td,tbody tr:hover td{background:color-mix(in srgb,var(--soft) 70%,transparent)}
tr.ft td{background:var(--soft);border-top:0}
.badge{padding:3px 10px}
.bar{height:9px}.bar i{border-radius:99px}
.rk{border-radius:10px}
.row{border-bottom-color:color-mix(in srgb,var(--bd) 60%,transparent)}
/* grafik */
.cv{width:100%;height:auto;display:block;overflow:visible}
.cv .gl{stroke:var(--bd);stroke-dasharray:3 5;stroke-width:1}.cv .gl.z{stroke:var(--mut);stroke-dasharray:none;opacity:.35}
.cv .ax{fill:var(--mut);font-size:11px;font-family:inherit}
.cv .vl{fill:var(--pri);font-size:11.5px;font-weight:800;font-family:inherit}
.cv .ln{fill:none;stroke:var(--pri);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cv .b{opacity:.72;transition:opacity .15s,filter .15s}.cv .b.mx{opacity:1}
.cv .pt:hover .b{opacity:1;filter:brightness(1.12)}
.cv .pt line{stroke:var(--pri);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.cv .pt circle{fill:var(--card);stroke:var(--pri);stroke-width:3;opacity:0;transition:opacity .12s}
.cv .pt:hover line,.cv .pt:hover circle{opacity:1}
#tip{position:fixed;z-index:200;display:none;pointer-events:none;background:#0b1630;color:#fff;border-radius:12px;padding:8px 13px;box-shadow:0 10px 28px rgba(0,0,0,.35);font-size:12.5px}
#tip small{display:block;opacity:.7}#tip b{font-size:15px}
/* login & dialog */
.lock{background:radial-gradient(900px 500px at 15% 10%,#3b7bff 0%,transparent 60%),linear-gradient(160deg,#1a44cc,#0d2160)}
.lockbox{border-radius:28px;padding:32px;box-shadow:0 30px 70px rgba(5,15,60,.45)}
#dlgb{border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#dlg{backdrop-filter:blur(4px)}
@media(max-width:1000px){
 .side{position:fixed;left:0;top:0;height:100vh;height:100dvh;transform:translateX(-102%)}.side.open{transform:none}
 .kc.hero b{font-size:clamp(24px,8.5vw,34px);overflow-wrap:anywhere}.kc.hero{padding:18px}
 .kc b{font-size:19px}.card{padding:16px;border-radius:20px}
 .cv .ax{font-size:19px}.cv .vl{font-size:20px}.cv .ln{stroke-width:4}
 .tb h2{font-size:19px}
}
</style>

const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');

 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',

 for(let k=0;k<=cnt;k++){const v=ymin+k*st,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl${Math.abs(v)<1e-9?' z':''}"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="ax">${cfmt(v)}</text>`}
 labels.forEach((l,i)=>{if(i%step===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${esc(l)}</text>`});
 const mi=vals.indexOf(hi),tip=i=>esc(labels[i])+'||'+rp(vals[i]);
 if(type==='area'&&n>1){
  const P=vals.map((v,i)=>[X(i),Y(v)]);let d=`M${P[0][0]},${P[0][1]}`;

  g+=`<path d="${d} L${P[n-1][0]},${Y(0)} L${P[0][0]},${Y(0)} Z" fill="url(#${id}a)"/><path d="${d}" class="ln"/>`;
  vals.forEach((v,i)=>{g+=`<g class="pt" data-tip="${tip(i)}"><rect x="${X(i)-slot/2}" y="${T}" width="${slot}" height="${ih}" fill="transparent"/><line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ih}"/><circle cx="${X(i)}" cy="${Y(v)}" r="5"/></g>`});
  if(vals[mi]>0)g+=`<text x="${X(mi)}" y="${Y(vals[mi])-10}" text-anchor="middle" class="vl">${cfmt(vals[mi])}</text>`;
 }else{

 }

function bepRowHTML(x){return`<div class="g2 bprow" style="grid-template-columns:1fr 150px 44px;gap:8px;margin-bottom:6px"><input class="bn" maxlength="40" placeholder="Nama biaya (mis. Sewa)" value="${esc(x&&x.n||'')}"><input class="ba" type="number" inputmode="numeric" min="0" placeholder="Rp / bulan" value="${x&&x.a?x.a:''}"><button class="btn sm del" onclick="this.parentNode.remove()">✕</button></div>`}
function bepAdd(){const r=$('#bprows');if(r.children.length>=15){alert('Maksimal 15 baris');return}r.insertAdjacentHTML('beforeend',bepRowHTML());}
function bepForm(){
 const b=(D.outlet&&D.outlet.bep)||{fixed:[],target:0},l=(b.fixed&&b.fixed.length)?b.fixed:[{n:'Sewa',a:''},{n:'Gaji karyawan',a:''},{n:'Listrik, air & internet',a:''}];
 const co=Object.entries(CUR.cbycat).sort((a,c)=>c[1]-a[1]).map(([k,x])=>esc(k)+' '+rp(x)).join(' · ');
 dlg(`<h3>Biaya Tetap &amp; Target Laba</h3>
 <div class="mut" style="font-size:13px;margin-bottom:8px">Isi biaya yang harus dibayar tiap bulan walau penjualan sepi (sewa, gaji, listrik, cicilan). Bahan baku/HPP, komisi platform, dan MDR otomatis dihitung dari data penjualan sebagai biaya variabel.</div>
 ${co?`<div class="note">Pengeluaran kas tercatat pada periode terpilih (sebagai acuan): ${co}</div>`:''}
 <div id="bprows">${l.map(bepRowHTML).join('')}</div>
 <button class="btn sm" onclick="bepAdd()">${ic('plus',14)} Tambah biaya</button> ${hasF('karyawan')?'<button class="btn sm" onclick="bepFromEmp()">Ambil dari data karyawan</button>':''}
 ${fld('b_t','Target laba bersih per bulan (Rp, opsional)',b.target||'','number','mis. 5000000')}
 <div class="acts2"><button class="btn pri" onclick="saveBep(this)">Simpan</button><button class="btn" onclick="closeDlg()">Batal</button></div>`);
}
function saveBep(btn){
 const fixed=[...document.querySelectorAll('#bprows .bprow')].map(r=>({n:r.querySelector('.bn').value.trim(),a:Math.max(0,+r.querySelector('.ba').value||0)})).filter(x=>x.a>0||x.n);
 if(fixed.some(x=>!x.n)){alert('Ada biaya yang belum diberi nama');return}
 safe(()=>push('outlet',Object.assign({},D.outlet||{},{bep:{fixed,target:Math.max(0,+v('b_t')||0)}})),btn);
}
function bepCard(d){
 if(!hasF('bep'))return`<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="width:44px;height:44px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center">${ic('lock',22)}</div><div style="flex:1;min-width:200px"><h4 style="margin:0">Titik Impas (BEP) & Target Penjualan</h4><p class="mut" style="margin:2px 0 0">Fitur ini belum aktif di akun kamu.</p></div><button class="btn pri" onclick="upsell('bep')">Upgrade</button></div>`;
 const b=(D.outlet&&D.outlet.bep)||{fixed:[],target:0},F=sum(b.fixed||[],x=>+x.a||0),T=+b.target||0;
 const act=`<button class="btn sm" onclick="bepForm()">${ic('plus',14)} Atur biaya tetap &amp; target</button>`;
 const hd=`<div class="ch"><div><h4>Titik Impas (BEP) &amp; Target Penjualan</h4><p>Berapa penjualan yang harus dicapai tiap bulan supaya tidak rugi dan mencapai target laba</p></div>${act}</div>`;
 if(!(F>0))return`<div class="card">${hd}<div class="empty">Biaya tetap bulanan belum diisi. Tekan “Atur biaya tetap &amp; target” untuk mulai menghitung BEP.</div></div>`;
 const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),dn=n.getDate(),ms=new Date(n.getFullYear(),n.getMonth(),1).getTime();
 const mo=agg(ms,new Date(n.getFullYear(),n.getMonth()+1,1).getTime());
 let base=d,lbl=perLabel();if(!(base.net>0)){base=mo;lbl='bulan ini'}if(!(base.net>0)){base=agg(0,Infinity);lbl='semua data'}
 if(!(base.net>0))return`<div class="card">${hd}<div class="empty">Belum ada data penjualan untuk menghitung margin. BEP muncul setelah ada transaksi.</div></div>`;
 const vr=base.cogs+base.fees,cm=(base.net-vr)/base.net;
 if(!(cm>0))return`<div class="card">${hd}<div class="note" style="color:var(--bad)">Margin kontribusi ${pct(cm*100)} (HPP + biaya platform ≥ penjualan). BEP tidak bisa dihitung — cek HPP produk dan harga jual.</div></div>`;
 const bep=F/cm,tg=(F+T)/cm,act2=mo.net,proj=act2/dn*dim,left=Math.max(0,dim-dn+1);
 const avg=base.tx.length?base.net/base.tx.length:0,bpd=bep/dim,tpd=tg/dim;
 const needBep=Math.max(0,bep-act2)/left,needTg=Math.max(0,tg-act2)/left;
 const mx=Math.max(tg,bep,act2,proj)*1.08||1,w=x=>Math.min(100,Math.max(0,x/mx*100));
 const mos=proj>0?(proj-bep)/proj*100:0;
 const st=act2>=tg&&T>0?['Target tercapai','g']:act2>=bep?['Sudah lewat BEP','g']:proj>=bep?['Diproyeksi lewat BEP','k']:['Di bawah BEP','v'];
 const K=(l,x,s)=>`<div class="kc"><small>${l}</small><b>${x}</b>${s?`<small>${s}</small>`:''}</div>`;
 return`<div class="card">${hd}
 <div class="kg">${K('BEP per bulan',rp(bep),'penjualan minimum agar impas')}${T>0?K('Target penjualan / bulan',rp(tg),'untuk laba bersih '+rp(T)):''}${K('Margin kontribusi',pct(cm*100),'dari '+lbl)}${K('Biaya tetap / bulan',rp(F),(b.fixed||[]).length+' pos biaya')}</div>
 <div style="margin:4px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Realisasi bulan ini: ${rp(act2)}</b><span class="badge ${st[1]}">${st[0]}</span></div>
 <div style="position:relative;height:16px;background:var(--soft);border-radius:99px;margin:22px 0 30px">
  <div style="position:absolute;left:0;top:0;height:100%;width:${w(act2)}%;background:linear-gradient(90deg,var(--hd1),var(--hd2));border-radius:99px"></div>
  <div style="position:absolute;left:${w(bep)}%;top:-6px;height:28px;border-left:2px dashed var(--warn)"></div><div style="position:absolute;left:${w(bep)}%;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap">BEP</div>
  ${T>0?`<div style="position:absolute;left:${w(tg)}%;top:-6px;height:28px;border-left:2px dashed var(--ok)"></div><div style="position:absolute;left:${w(tg)}%;top:22px;transform:translateX(-50%);font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap">Target</div>`:''}
 </div>
 <div class="tw"><table><tr><th></th><th class="r">BEP (impas)</th>${T>0?'<th class="r">Target laba</th>':''}</tr>
 <tr><td>Penjualan per bulan</td><td class="r"><b>${rp(bep)}</b></td>${T>0?`<td class="r"><b>${rp(tg)}</b></td>`:''}</tr>
 <tr><td>Rata-rata per hari (${dim} hari)</td><td class="r">${rp(bpd)}</td>${T>0?`<td class="r">${rp(tpd)}</td>`:''}</tr>
 <tr><td>Nota per hari${avg?' (rata-rata '+rp(avg)+'/nota)':''}</td><td class="r">${avg?Math.ceil(bpd/avg):'-'}</td>${T>0?`<td class="r">${avg?Math.ceil(tpd/avg):'-'}</td>`:''}</tr>
 <tr><td>Kekurangan bulan ini</td><td class="r" style="color:var(--${act2>=bep?'ok':'bad'})">${act2>=bep?'Terlampaui '+rp(act2-bep):rp(bep-act2)}</td>${T>0?`<td class="r" style="color:var(--${act2>=tg?'ok':'bad'})">${act2>=tg?'Terlampaui '+rp(act2-tg):rp(tg-act2)}</td>`:''}</tr>
 <tr><td>Perlu per hari sisa ${left} hari</td><td class="r">${rp(needBep)}</td>${T>0?`<td class="r">${rp(needTg)}</td>`:''}</tr></table></div>
 <ul class="ins" style="margin-top:10px"><li>Proyeksi akhir bulan dengan laju sekarang: <b>${rp(proj)}</b>${proj>=bep?', di atas BEP':', masih di bawah BEP'}${proj>0?' · margin of safety <b>'+pct(mos)+'</b>':''}.</li>${T>0?`<li>Laba bersih yang diproyeksikan: <b>${rp(proj*cm-F)}</b> (target ${rp(T)}).</li>`:''}<li>Setiap Rp1.000 penjualan menyumbang sekitar <b>${rp(cm*1000)}</b> untuk menutup biaya tetap dan laba.</li></ul>
 <div class="hint">Perhitungan memakai penjualan setelah diskon (di luar pajak &amp; service). Margin diambil dari ${esc(lbl)}; realisasi dari bulan berjalan. BEP = biaya tetap ÷ margin kontribusi.</div></div>`;
}

function vAnalisa(d){
 const pv=prevAgg();
 const dl=(c,p,inv)=>{if(p==null)return'';if(p===0)return c>0?'<small class="dlt up">baru</small>':'';const v=(c-p)/Math.abs(p)*100,up=v>=0;return`<small class="dlt ${up!==!!inv?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</small>`};
 const aov=a=>a.tx.length?a.gross/a.tx.length:0,mg=a=>a.net?a.profit/a.net*100:0;
 const K=(l,v,c,p,inv)=>`<div class="kc"><small>${l}</small><b>${v}</b>${pv?dl(c,p,inv):''}</div>`;
 const keys=Object.keys(d.day).sort(),dv=keys.map(k=>d.day[k]);
 let h0=6,h1=23;const hs=Object.keys(d.hour).map(Number).filter(h=>d.hour[h]>0);if(hs.length){h0=Math.min(...hs);h1=Math.max(...hs)}
 const hv=[],hl=[];for(let h=h0;h<=h1;h++){hv.push(d.hour[h]);hl.push(p2(h))}
 const wv=[1,2,3,4,5,6,0].map(w=>d.wd[w]),wl=[1,2,3,4,5,6,0].map(w=>DAYN[w].slice(0,3));
 const prods=Object.entries(d.prod),totRev=sum(prods,x=>x[1].rev)||1;
 const topP=[...prods].sort((a,b)=>b[1].profit-a[1].profit).slice(0,5),maxP=topP.length&&topP[0][1].profit>0?topP[0][1].profit:1;
 const lowM=prods.filter(x=>x[1].rev>0).sort((a,b)=>a[1].profit/a[1].rev-b[1].profit/b[1].rev).slice(0,5);
 const cats=Object.entries(d.cat).sort((a,b)=>b[1].rev-a[1].rev);
 const ins=[];
 if(d.tx.length){
  const bh=Object.keys(d.hour).reduce((a,b)=>d.hour[b]>d.hour[a]?b:a,0),bw=Object.keys(d.wd).reduce((a,b)=>d.wd[b]>d.wd[a]?b:a,0);
  if(d.hour[bh]>0)ins.push('Jam paling ramai: <b>'+p2(bh)+':00–'+p2((+bh+1)%24)+':00</b> dengan penjualan '+rp(d.hour[bh])+'.');
  if(d.wd[bw]>0)ins.push('Hari paling ramai: <b>'+DAYN[bw]+'</b> ('+rp(d.wd[bw])+').');
  const bq=[...prods].sort((a,b)=>b[1].q-a[1].q)[0];if(bq)ins.push('Produk terlaris: <b>'+esc(bq[0])+'</b> ('+fq(bq[1].q)+' '+esc(bq[1].unit)+').');
  if(topP[0])ins.push('Penyumbang laba terbesar: <b>'+esc(topP[0][0])+'</b> ('+rp(topP[0][1].profit)+').');
  if(cats[0])ins.push('Kategori terbesar: <b>'+esc(cats[0][0])+'</b>, '+pct(cats[0][1].rev/totRev*100)+' dari penjualan item.');
  const kk=Object.entries(d.kas).filter(x=>x[1].total>0).sort((a,b)=>b[1].total-a[1].total)[0];if(kk)ins.push('Kasir dengan penjualan tertinggi: <b>'+esc(kk[0])+'</b> ('+rp(kk[1].total)+').');
  if(d.refAmt>0)ins.push('Refund mencapai '+pct(d.gross?d.refAmt/d.gross*100:0)+' dari total tagihan.');
  if(lowM[0]&&lowM[0][1].profit/lowM[0][1].rev<0.1)ins.push('Perhatikan margin tipis: <b>'+esc(lowM[0][0])+'</b> hanya '+pct(lowM[0][1].profit/lowM[0][1].rev*100)+'.');
 }
 const share=(o,tot)=>tot?pct(o/tot*100):'0.0%';
 const totCh=sum(Object.values(d.chan),o=>o.total),pm=Object.keys(METHODS).filter(m=>d.by[m]),totPm=sum(pm,m=>d.by[m]);
 return`${pv?'<div class="mut" style="margin:-4px 0 12px;font-size:13px">Perubahan dibandingkan periode sebelumnya dengan panjang yang sama.</div>':''}
 <div class="kg">${K('Omzet (setelah refund)',rp(d.omzet),d.omzet,pv&&pv.omzet)}${K('Jumlah nota',d.tx.length,d.tx.length,pv&&pv.tx.length)}${K('Rata-rata per nota',rp(aov(d)),aov(d),pv&&aov(pv))}${K('Item per nota',d.tx.length?fq(d.items/d.tx.length):'0',d.tx.length?d.items/d.tx.length:0,pv&&(pv.tx.length?pv.items/pv.tx.length:0))}${K('Laba kotor',rp(d.profit),d.profit,pv&&pv.profit)}${K('Margin kotor',pct(mg(d)),mg(d),pv&&mg(pv))}${K('Pengeluaran operasional',rp(d.opex),d.opex,pv&&pv.opex,1)}${K('Laba bersih',rp(d.netProfit),d.netProfit,pv&&pv.netProfit)}</div>
 <div class="kg"><div class="kc"><small>Total diskon</small><b>${rp(d.disc)}</b><small>${pct(d.gross+d.disc?d.disc/(d.gross+d.disc)*100:0)} dari penjualan kotor</small></div><div class="kc"><small>Tingkat refund</small><b>${pct(d.gross?d.refAmt/d.gross*100:0)}</b><small>${rp(d.refAmt)}</small></div><div class="kc"><small>Pengeluaran / omzet</small><b>${pct(d.omzet?d.opex/d.omzet*100:0)}</b></div></div>
 ${bepCard(d)}
 <div class="card"><h4>Sorotan</h4><p>Ringkasan otomatis dari data periode ini</p>${ins.length?`<ul class="ins">${ins.map(x=>'<li>'+x+'</li>').join('')}</ul>`:noData}</div>
 <div class="card"><h4>Tren Penjualan Harian</h4><p>Setelah dikurangi refund</p>${dv.length?bars(dv,keys.map(k=>k.slice(8)+'/'+k.slice(5,7)),'area'):noData}</div>
 <div class="two"><div class="card"><h4>Jam Ramai</h4><p>Total penjualan per jam</p>${d.tx.length?bars(hv,hl):noData}</div><div class="card"><h4>Hari Tersibuk</h4><p>Total penjualan per hari dalam seminggu</p>${d.tx.length?bars(wv,wl):noData}</div></div>
 <div class="two"><div class="card"><h4>Kontribusi Kategori</h4><p>Penjualan item per kategori</p><div class="tw">${cats.length?`<table><tr><th>Kategori</th><th class="r">Penjualan</th><th class="r">Laba</th><th class="r">Margin</th><th class="r">Porsi</th></tr>${cats.map(([n,o])=>`<tr><td><b>${esc(n)}</b></td><td class="r">${rp(o.rev)}</td><td class="r">${rp(o.profit)}</td><td class="r">${pct(o.rev?o.profit/o.rev*100:0)}</td><td class="r">${pct(o.rev/totRev*100)}</td></tr>`).join('')}</table>`:noData}</div></div>
 <div class="card"><h4>5 Produk Laba Terbesar</h4><p>Laba kotor setelah refund</p>${topP.length?topP.map((x,i)=>`<div class="row"><div class="rk">${i+1}</div><div class="grow"><b>${esc(x[0])}</b><div class="bar"><i style="width:${Math.max(4,Math.round(Math.max(0,x[1].profit)/maxP*100))}%"></i></div></div><div class="val">${rp(x[1].profit)}<small>margin ${pct(x[1].rev?x[1].profit/x[1].rev*100:0)}</small></div></div>`).join(''):noData}</div></div>
 <div class="two"><div class="card"><h4>5 Produk Margin Terendah</h4><p>Pertimbangkan menaikkan harga atau menekan modal</p>${lowM.length?`<div class="tw"><table><tr><th>Produk</th><th class="r">Terjual</th><th class="r">Margin</th></tr>${lowM.map(([n,o])=>`<tr><td><b>${esc(n)}</b></td><td class="r">${fq(o.q)} ${esc(o.unit)}</td><td class="r" style="color:var(--${o.profit<=0?'bad':'warn'})">${pct(o.profit/o.rev*100)}</td></tr>`).join('')}</table></div>`:noData}</div>
 <div class="card"><h4>Komposisi Channel &amp; Pembayaran</h4><p>Porsi terhadap total</p><div class="tw"><table><tr><th>Channel</th><th class="r">Nota</th><th class="r">Total</th><th class="r">Porsi</th></tr>${Object.entries(d.chan).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="r">${o.n}</td><td class="r">${rp(o.total)}</td><td class="r">${share(o.total,totCh)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Belum ada data</td></tr>'}</table></div><div class="tw" style="margin-top:10px"><table><tr><th>Metode</th><th class="r">Masuk</th><th class="r">Porsi</th></tr>${pm.map(m=>`<tr><td>${METHODS[m]}</td><td class="r">${rp(d.by[m])}</td><td class="r">${share(d.by[m],totPm)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Belum ada data</td></tr>'}</table></div></div></div>`;
}

function vDetail(d){
 const ks=[...new Set(D.tx.map(t=>t.cashier))].sort();
 return`<div class="card"><div class="tool"><input placeholder="Cari nota, kasir, pelanggan, meja, produk…" value="${esc(DT.q)}" oninput="DT.q=this.value;dtRender()">
 <select onchange="DT.kasir=this.value;dtRender()"><option value="">Semua kasir</option>${ks.map(k=>`<option value="${esc(k)}" ${DT.kasir===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
 <select onchange="DT.status=this.value;dtRender()"><option value="">Semua status</option><option value="ok" ${DT.status==='ok'?'selected':''}>Selesai</option><option value="refund" ${DT.status==='refund'?'selected':''}>Ada refund</option></select>
 <button class="btn ${DT.mode==='nota'?'on':''}" id="dtm1" onclick="dtMode('nota')">Per Nota</button><button class="btn ${DT.mode==='item'?'on':''}" id="dtm2" onclick="dtMode('item')">Per Item</button>
 <button class="btn" onclick="exportDetail()">${ic('dl',16)} CSV</button></div><div class="mut" id="dtc" style="margin-bottom:8px"></div><div class="tw" id="dtt"></div></div>`;

function dtMode(m){DT.mode=m;$('#dtm1').classList.toggle('on',m==='nota');$('#dtm2').classList.toggle('on',m==='item');dtRender()}
function dtFilter(){
 const q=DT.q.toLowerCase();
 const base=CUR.tx.filter(t=>(!DT.kasir||t.cashier===DT.kasir)&&(!DT.status||(DT.status==='ok'?t.status==='ok':t.status!=='ok')));
 const head=t=>[t.no,t.cashier,t.custName,t.table,typeLabel(t.type,t.channel),(t.servers||[]).map(x=>x.name).join(' ')].join(' ').toLowerCase();
 if(DT.mode==='nota')return{nota:base.filter(t=>!q||(head(t)+' '+t.items.map(i=>i.name).join(' ').toLowerCase()).includes(q))};
 return{rows:base.flatMap(t=>t.items.map(i=>({t,i}))).filter(r=>!q||(head(r.t)+' '+r.i.name.toLowerCase()).includes(q))};
}
function dtRender(){
 const c=$('#dtc'),t=$('#dtt');if(!c||!t)return;
 const f=dtFilter();
 if(f.nota){
  const l=f.nota;
  c.textContent=l.length+' nota · total '+rp(sum(l,x=>x.total))+(l.length>300?' · menampilkan 300 terbaru':'');
  t.innerHTML=l.length?`<table><tr><th>Nota</th><th>Waktu</th><th>Kasir</th><th>Tipe</th><th class="r">Item</th><th class="r">Subtotal</th><th class="r">Diskon</th><th class="r">Service+Pajak</th><th class="r">Total</th><th>Pembayaran</th><th>Status</th></tr>${l.slice(0,300).map(x=>`<tr class="cl" onclick="txDetail('${x.id}')"><td><b>${esc(x.no)}</b></td><td>${fmtT(x.ts)}</td><td>${esc(x.cashier)}</td><td>${esc(typeLabel(x.type,x.channel))}${x.table?' · '+esc(x.table):''}</td><td class="r">${fq(sum(x.items,i=>i.qty))}</td><td class="r">${rp((x.subtotal||0)+(x.custDisc||0))}</td><td class="r">${rp((x.custDisc||0)+(x.autoDisc||0)+(x.voucherDisc||0)+(x.ptDisc||0)+(x.manualDisc||0))}</td><td class="r">${rp((x.service||0)+(x.tax||0))}</td><td class="r"><b>${rp(x.total)}</b></td><td>${x.payments.map(p=>METHODS[p.m]||p.m).join(' + ')}</td><td>${stBadge(x)}</td></tr>`).join('')}<tr class="ft"><td colspan="4">Total</td><td class="r">${fq(sum(l,x=>sum(x.items,i=>i.qty)))}</td><td class="r">${rp(sum(l,x=>(x.subtotal||0)+(x.custDisc||0)))}</td><td class="r">${rp(sum(l,x=>(x.custDisc||0)+(x.autoDisc||0)+(x.voucherDisc||0)+(x.ptDisc||0)+(x.manualDisc||0)))}</td><td class="r">${rp(sum(l,x=>(x.service||0)+(x.tax||0)))}</td><td class="r">${rp(sum(l,x=>x.total))}</td><td colspan="2"></td></tr></table>`:'<div class="empty">Tidak ada transaksi</div>';
 }else{

function cfFlows(){

  o.n++;o.v+=p.ap||0;
 }));
 Object.values(sg).forEach(o=>add(o.ts,o.a,'sale','Penjualan '+(METHODS[o.m]||o.m)+' ('+o.n+' nota)',o.v,0,'Otomatis',undefined,{m:o.m}));

 });

 D.cash.forEach(x=>add(x.ts,accOf(x.src==='luar'?'luar':'tunai'),'pos',(x.cat||'')+(x.note?' · '+x.note:''),x.type==='in'?x.amount:0,x.type==='out'?x.amount:0,'Kasir',undefined,{cat:x.cat||'Lainnya'}));

function cfCalc(){

 cfFlows().sort((x,y)=>x.ts-y.ts).forEach(f=>{
  const s=S[f.acc];if(!s||f.ts<s.ots||f.ts>=b)return;
  s.bal+=f.inn-f.out;
  if(f.ts<a)s.start+=f.inn-f.out;else{s.inn+=f.inn;s.out+=f.out;s.rows.push({...f,saldo:s.bal})}

function saldoChart(pts){

 const W=640,H=190,p=44,mn=Math.min(...pts.map(x=>x.v)),mx=Math.max(...pts.map(x=>x.v)),r=(mx-mn)||1,n=pts.length-1;

 <path d="${d}" fill="none" stroke="var(--pri,#6366f1)" stroke-width="2.5" stroke-linejoin="round"/>${n<=31?pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="var(--pri,#6366f1)"/>`).join(''):''}

function bkNum(s){s=String(s==null?'':s).replace(/rp/ig,'').replace(/\s/g,'');if(!s)return null;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?NaN:n}
function bkCsv(txt){
 txt=txt.replace(/^\uFEFF/,'').replace(/^sep=.?\r?\n/i,'');
 const first=txt.split(/\r?\n/).find(x=>x.trim())||'';
 const c=[[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===c){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows;
}

function bkRead(f){
 if(!f)return;
 const el=$('#bk_prev'),rd=new FileReader(),isX=/\.xlsx?$/i.test(f.name);
 if(isX&&!window.XLSX){el.innerHTML='<div class="mut" style="color:var(--bad)">Pembaca Excel belum termuat (cek internet). Simpan file sebagai CSV lalu unggah lagi.</div>';return}
 const proc=rows=>{
  BK.rows=[];
  if(rows.length<2){el.innerHTML='<div class="mut">File kosong atau formatnya tidak dikenali.</div>';bkPrev();return}
  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));

  const g=(r,k)=>k>=0?String(r[k]==null?'':r[k]).trim():'';

  bkPrev();
 };

   if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
   else proc(bkCsv(String(e.target.result||'')));
  }catch(err){el.innerHTML='<div class="mut" style="color:var(--bad)">File tidak bisa dibaca: '+esc(err.message)+'</div>'}
 };
 isX?rd.readAsArrayBuffer(f):rd.readAsText(f);
}
function bkPrev(){

 D.products.forEach(p=>{byId[String(p.id)]=p;if(p.sku)bySku[String(p.sku).toLowerCase()]=p;byName[String(p.name).trim().toLowerCase()]=p});
 const out=[];BK.ok=[];let blank=0,bad=0,same=0;
 BK.rows.forEach(r=>{

  const p=byId[r.id]||(r.sku&&bySku[r.sku.toLowerCase()])||(r.name&&byName[r.name.toLowerCase()])||null,s=p?(+p.stock||0):0;
  let st='ok',msg='';
  if(!p){st='bad';msg='Produk tidak ditemukan'}
  else if(p.trackStock===false){st='bad';msg='Produk tanpa hitung stok'}
  else if(seen[p.id]){st='bad';msg='Produk dobel di file'}

  if(p)seen[p.id]=1;

  else BK.ok.push({p,qty:r.qty,bp:r.bp>0?r.bp:0,note:r.note});
  out.push({r,p,s,st,msg});
 });
 el.innerHTML=`<div style="margin-bottom:8px"><span class="badge g">${BK.ok.length} akan diperbarui</span> ${bad?`<span class="badge v">${bad} bermasalah (dilewati)</span> `:''}${same?`<span class="badge">${same} tidak berubah</span> `:''}${blank?`<span class="badge">${blank} baris kosong</span>`:''}</div>
 ${out.length?`<div class="tw" style="max-height:34vh;overflow:auto"><table><tr><th>Produk</th><th class="r">Sekarang</th><th class="r">${set?'Stok sebenarnya':'Tambah'}</th><th class="r">Sesudah</th><th>Status</th></tr>${out.slice(0,300).map(o=>{const nm=o.p?o.p.name:(o.r.name||o.r.sku||o.r.id||'?'),aft=o.st==='ok'?(set?o.r.qty:Math.round((o.s+o.r.qty)*1000)/1000):null;return`<tr><td><b>${esc(nm)}</b></td><td class="r">${o.p?fq(o.s):'—'}</td><td class="r">${isNaN(o.r.qty)?'?':fq(o.r.qty)}</td><td class="r">${aft==null?'—':'<b>'+fq(aft)+'</b>'}</td><td>${o.st==='ok'?'<span class="badge g">OK</span>':o.st==='same'?'<span class="badge">Tidak berubah</span>':'<span class="badge v">'+esc(o.msg)+'</span>'}</td></tr>`}).join('')}</table></div>${out.length>300?'<div class="mut" style="font-size:12.5px;margin-top:6px">Menampilkan 300 baris pertama; semua baris valid tetap diproses.</div>':''}`:''}`;
 if(go)go.disabled=!BK.ok.length;
}

 const pay=BK.mode==='add'?v('bk_pay'):'',hut=pay==='hutang',buyTot=Math.round(sum(BK.ok.filter(r=>r.bp>0),r=>r.qty*r.bp)),buyN=BK.ok.filter(r=>r.bp>0).length;
 const items=BK.ok.map(r=>{const o={id:r.p.id,qty:r.qty};if(r.bp>0)o.buyPrice=r.bp;if(hut&&r.bp>0)o.note='[HUTANG] '+(r.note||'Stok masuk (massal)');else if(r.note)o.note=r.note;return o});
 const chunks=[];let cur=[],len=0;
 items.forEach(it=>{const l=encodeURIComponent(JSON.stringify(it)).length+3;if(cur.length&&(len+l>1400||cur.length>=40)){chunks.push(cur);cur=[];len=0}cur.push(it);len+=l});
 if(cur.length)chunks.push(cur);
 btn.disabled=true;let done=0;
 try{
  for(const c of chunks){
   btn.textContent='Menyimpan '+done+'/'+items.length+'…';
   await pushQuiet('stock_bulk',{mode:BK.mode,hppMode:v('bk_hpp')||'avg',items:c});
   done+=c.length;
  }
  let cfMsg='';
  if(pay.indexOf('acc:')===0&&buyTot>0){try{await cfBuy(pay.slice(4),buyTot,'Isi stok massal ('+buyN+' produk)','')}catch(e){cfMsg='\n\nCatatan arus kas gagal: '+e.message+'. Catat manual di Arus Kas & Rekening.'}}
  busy=false;await load();closeDlg();render();
  alert(done+' produk berhasil diperbarui.'+cfMsg);
 }catch(e){
  alert('Gagal setelah '+done+' dari '+items.length+' produk: '+e.message+'\n\nProduk yang sudah tersimpan tidak akan dobel bila Anda mengunggah ulang file dengan mode Opname. Untuk Stok masuk, unduh template baru dulu agar tidak terhitung dua kali.');
  btn.disabled=false;btn.textContent='Terapkan';
  try{busy=false;await load();render()}catch(_){}
 }
}

const ymNow=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const ymRange=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return[new Date(a[0],a[1]-1,1).getTime(),new Date(a[0],a[1],1).getTime()]};
const ymLabel=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const CM={m:ymNow()},GJ={m:ymNow()};
const EMP=()=>D.employees||[];
const monthlyOf=e=>(e.payType==='harian'?(+e.salary||0)*26:(+e.salary||0))+(+e.allowance||0);
const nm_=s=>String(s==null?'':s).trim().toLowerCase();
/*ENGINE-START*/
function commCfg(){
 const d={active:false,mode:'tier',tierType:'marginal',basis:'personal',flat:2,tiers:[{from:0,rate:1},{from:10000000,rate:2},{from:25000000,rate:3}],fallback:true},c=D.commission||{};
 return Object.assign(d,c,{tiers:(c.tiers&&c.tiers.length)?c.tiers:d.tiers});
}
function marg(x,tiers){
 const t=[...tiers].sort((a,b)=>a.from-b.from);let s=0;
 t.forEach((r,i)=>{const hi=i+1<t.length?+t[i+1].from:Infinity,part=Math.max(0,Math.min(x,hi)-(+r.from||0));s+=part*(+r.rate||0)/100});
 return s;
}
function commOf(sales,team,cfg){
 if(!cfg.active||!(sales>0))return 0;
 if(cfg.mode==='flat')return sales*(+cfg.flat||0)/100;
 const t=[...cfg.tiers].sort((a,b)=>a.from-b.from),ref=cfg.basis==='team'?team:sales;
 if(cfg.tierType==='cliff'){let r=0;t.forEach(x=>{if(ref>=(+x.from||0))r=+x.rate||0});return sales*r/100}
 const tot=marg(ref,t);
 return cfg.basis==='team'?(ref>0?sales*tot/ref:0):tot;
}
function commAgg(ym){
 const rg=ymRange(ym),a=rg[0],b=rg[1],cfg=commCfg(),E=D.employees||[],byName={};
 E.forEach(e=>byName[nm_(e.name)]=e);
 const rows={};let un=0,tot=0;
 D.tx.filter(t=>t.ts>=a&&t.ts<b).forEach(t=>{
  const eff=(t.net||0)*(1-cRatio(t))*(1-Math.min(1,(t.refunded||0)/(t.total||1)));
  if(!(eff>0))return;tot+=eff;
  let sv=(t.servers||[]).filter(x=>x&&(x.id||x.name));
  if(!sv.length&&cfg.fallback){const e=byName[nm_(t.cashier)];if(e)sv=[{id:e.id,name:e.name}]}
  if(!sv.length){un+=eff;return}
  const sh=eff/sv.length;
  sv.forEach(x=>{
   const e=E.find(z=>z.id===x.id)||byName[nm_(x.name)],key=e?e.id:'n:'+x.name;
   const o=rows[key]||(rows[key]={key,id:e?e.id:'',name:e?e.name:x.name,e,n:0,sales:0,tx:[]});
   o.n++;o.sales+=sh;o.tx.push({t,share:sh,k:sv.length});
  });
 });
 E.filter(e=>e.active!==false).forEach(e=>{if(!rows[e.id])rows[e.id]={key:e.id,id:e.id,name:e.name,e,n:0,sales:0,tx:[]}});
 const L=Object.values(rows);
 L.forEach(o=>o.elig=!!(o.e&&o.e.comm!==false));
 const team=sum(L.filter(o=>o.elig),o=>o.sales);
 L.forEach(o=>{o.c=o.elig?Math.round(commOf(o.sales,team,cfg)):0;o.rate=o.sales>0?o.c/o.sales*100:0});
 return{cfg,rows,team,tot,un};
}
function daysPresent(e,ym){
 const rg=ymRange(ym),n=nm_(e.name),s=new Set();
 D.shifts.forEach(x=>{if(x.openTs>=rg[0]&&x.openTs<rg[1]&&nm_(x.name)===n)s.add(dk(x.openTs))});
 return s.size;
}
function payRec(e,ym){return(D.payroll||[]).find(p=>p.empId===e.id&&p.period===ym)}
function payCalc(e,ym,ca,ov){
 const r=Object.assign({},payRec(e,ym)||{},ov||{});
 if(r.status==='paid'&&!ov)return{days:r.days,base:+r.base||0,allow:+r.allow||0,comm:+r.comm||0,bonus:+r.bonus||0,ded:+r.deduct||0,total:+r.total||0,rec:r,paid:true};
 const harian=e.payType==='harian',days=(r.days!==undefined&&r.days!==''&&r.days!==null)?+r.days:daysPresent(e,ym);
 const base=harian?Math.round((+e.salary||0)*days):(+e.salary||0),allow=+e.allowance||0,row=ca.rows[e.id],comm=row?row.c:0,bonus=+r.bonus||0,ded=+r.deduct||0;
 return{days:harian?days:'',base,allow,comm,bonus,ded,total:base+allow+comm+bonus-ded,rec:r,paid:false};
}
/*ENGINE-END*/
const ruleTxt=c=>!c.active?'Belum diaktifkan':c.mode==='flat'?'Tarif tetap '+fq(c.flat)+'% dari penjualan':'Bertingkat ('+(c.tierType==='cliff'?'naik kelas':'progresif')+', dasar '+(c.basis==='team'?'total tim':'penjualan pribadi')+'): '+[...c.tiers].sort((a,b)=>a.from-b.from).map(t=>'≥ '+rp(t.from)+' → '+fq(t.rate)+'%').join(' · ');
function nextTier(ref,c){
 if(!c.active||c.mode!=='tier')return'';
 const t=[...c.tiers].sort((a,b)=>a.from-b.from).find(x=>+x.from>ref);
 return t?'Kurang '+rp(t.from-ref)+' ke tingkat '+fq(t.rate)+'%':'Tingkat tertinggi tercapai';
}

 });

function jEntries(){const[a,b]=range();return jBuild().ents.filter(e=>e.ts>=a&&e.ts<b&&(!JL.src||e.src===JL.src))}
function vJurnal(){
 const J=jBuild(),l=jEntries(),srcs=[...new Set(J.ents.map(e=>e.src))],td=sum(l,e=>sum(e.lines,x=>x[1])),tc=sum(l,e=>sum(e.lines,x=>x[2])),show=l.slice(-300).reverse(),bad=jCheck();
 return`${akNote()}<div class="kg"><div class="kc"><small>Jumlah jurnal · ${esc(perLabel())}</small><b>${l.length}</b></div><div class="kc"><small>Total debit</small><b>${rp(td)}</b></div><div class="kc"><small>Total kredit</small><b style="color:var(--${td===tc?'ok':'bad'})">${rp(tc)}</b><small>${td===tc&&!bad?'Seimbang':'Tidak seimbang'}</small></div></div>
 <div class="card"><div class="tool"><select onchange="JL.src=this.value;render()"><option value="">Semua sumber</option>${srcs.map(s=>`<option ${JL.src===s?'selected':''}>${esc(s)}</option>`).join('')}</select><span style="margin-left:auto"><button class="btn" onclick="jurnalCsv()">${ic('dl',16)} CSV</button></span></div>
 <div class="tw">${show.length?`<table><tr><th>Tanggal</th><th>No. jurnal</th><th>Akun</th><th>Keterangan</th><th class="r">Debit</th><th class="r">Kredit</th></tr>${show.map(e=>e.lines.map((x,i)=>`<tr${i?'':' style="border-top:2px solid var(--line,#e5e7eb)"'}><td>${i?'':dk(e.ts)}</td><td>${i?'':'<b>'+e.no+'</b>'}</td><td style="${x[2]?'padding-left:26px':''}">${esc(J.meta[x[0]]?J.meta[x[0]].code+' '+J.meta[x[0]].name:x[0])}</td><td>${i?'':esc(e.desc)}</td><td class="r">${x[1]?rp(x[1]):''}</td><td class="r">${x[2]?rp(x[2]):''}</td></tr>`).join('')).join('')}</table>`:'<div class="empty">Belum ada jurnal pada periode ini.</div>'}</div>
 ${l.length>300?`<div class="hint">Menampilkan 300 jurnal terbaru dari ${l.length}. CSV berisi semuanya.</div>`:''}</div>`;

function jurnalCsv(){const J=jBuild(),rows=[['No','Tanggal','Sumber','Keterangan','Kode Akun','Nama Akun','Debit','Kredit']];jEntries().forEach(e=>e.lines.forEach(x=>rows.push([e.no,dk(e.ts),e.src,e.desc,J.meta[x[0]]?J.meta[x[0]].code:x[0],J.meta[x[0]]?J.meta[x[0]].name:'',x[1],x[2]])));csv('Jurnal-Umum',rows)}

function bukuRows(id){
 const[a,b]=range(),m=jBuild().meta[id];if(!m)return{rows:[],open:0,close:0};
 const nrm=aNorm(m.type);let bal=0;const rows=[];let open=0;
 jBuild().ents.forEach(e=>{e.lines.forEach(x=>{if(x[0]!==id)return;const d=(x[1]-x[2])*nrm;if(e.ts<a){bal+=d;open=bal}else if(e.ts<b){bal+=d;rows.push({ts:e.ts,no:e.no,desc:e.desc,dr:x[1],cr:x[2],bal})}})});
 return{rows,open,close:bal,m};
}
function vBuku(){
 const l=aSorted();if(!JL.acc||!jBuild().meta[JL.acc])JL.acc=(l.find(m=>m.type==='A')||l[0]).id;
 const B=bukuRows(JL.acc);
 return`${akNote()}<div class="card"><div class="tool"><select onchange="JL.acc=this.value;render()">${l.map(m=>`<option value="${esc(m.id)}" ${m.id===JL.acc?'selected':''}>${esc(m.code)} · ${esc(m.name)}</option>`).join('')}</select><span style="margin-left:auto"><button class="btn" onclick="bukuCsv()">${ic('dl',16)} CSV</button></span></div>
 <div class="kg"><div class="kc"><small>Saldo awal periode</small><b>${rp(B.open)}</b></div><div class="kc"><small>Mutasi debit / kredit</small><b>${rp(sum(B.rows,r=>r.dr))} / ${rp(sum(B.rows,r=>r.cr))}</b></div><div class="kc"><small>Saldo akhir</small><b>${rp(B.close)}</b></div></div>
 <div class="tw">${B.rows.length?`<table><tr><th>Tanggal</th><th>No. jurnal</th><th>Keterangan</th><th class="r">Debit</th><th class="r">Kredit</th><th class="r">Saldo</th></tr>${B.rows.map(r=>`<tr><td>${dk(r.ts)}</td><td>${r.no}</td><td>${esc(r.desc)}</td><td class="r">${r.dr?rp(r.dr):''}</td><td class="r">${r.cr?rp(r.cr):''}</td><td class="r"><b>${rp(r.bal)}</b></td></tr>`).join('')}</table>`:'<div class="empty">Tidak ada mutasi pada periode ini.</div>'}</div></div>`;
}
function bukuCsv(){const B=bukuRows(JL.acc);csv('Buku-Besar-'+(B.m?B.m.code:''),[['Tanggal','No','Keterangan','Debit','Kredit','Saldo'],['','','Saldo awal','','',B.open],...B.rows.map(r=>[dk(r.ts),r.no,r.desc,r.dr,r.cr,r.bal])])}

function lapData(){
 const[a,b]=range(),end=asOf(),sP=jSums(a,b),sA=jSums(0,end),l=aSorted();
 return{a,b,end,sP,sA,l,live:!isFinite(b)||b>Date.now()};
}
function vLapKeu(){
 const T=[['ns','Neraca Saldo'],['lr','Laba Rugi'],['nr','Neraca']],d=lapData();
 return`${akNote()}<div class="card"><div class="tool">${T.map(t=>`<button class="btn ${JL.t===t[0]?'pri':''}" onclick="JL.t='${t[0]}';render()">${t[1]}</button>`).join('')}<span style="margin-left:auto"><button class="btn" onclick="lapCsv()">${ic('dl',16)} CSV</button></span></div>${JL.t==='lr'?lapLR(d):JL.t==='nr'?lapNR(d):lapNS(d)}</div>`;
}
function lapNS(d){
 const rows=d.l.map(m=>{const o=d.sA[m.id]||{dr:0,cr:0},n=o.dr-o.cr;return{m,dr:n>0?n:0,cr:n<0?-n:0}}).filter(r=>r.dr||r.cr),td=sum(rows,r=>r.dr),tc=sum(rows,r=>r.cr);
 return`<p class="mut">Neraca saldo per ${esc(asLbl(d.end))}</p><div class="tw"><table><tr><th>Kode</th><th>Akun</th><th class="r">Debit</th><th class="r">Kredit</th></tr>${rows.map(r=>`<tr><td>${esc(r.m.code)}</td><td>${esc(r.m.name)}</td><td class="r">${r.dr?rp(r.dr):''}</td><td class="r">${r.cr?rp(r.cr):''}</td></tr>`).join('')}<tr class="ft"><td colspan="2">Total</td><td class="r">${rp(td)}</td><td class="r">${rp(tc)}</td></tr></table></div><div class="hint">${td===tc?'Seimbang: debit sama dengan kredit.':'Tidak seimbang. Selisih '+rp(td-tc)+'.'}</div>`;
}
function lrData(d){
 const get=t=>d.l.filter(m=>m.type===t).map(m=>({m,v:jSaldo(d.sP,m.id)})).filter(r=>r.v);
 const R=get('R'),X=get('X'),jual=jSaldo(d.sP,'jual'),ret=jSaldo(d.sP,'retur'),hpp=jSaldo(d.sP,'hpp'),lain=jSaldo(d.sP,'lain');
 const beban=X.filter(r=>r.m.id!=='hpp'),tb=sum(beban,r=>r.v),gp=jual+ret-hpp;
 return{jual,ret,hpp,lain,beban,tb,gp,net:gp+lain-tb,rev:R,X};
}
function lapLR(d){
 const L=lrData(d),ag=agg(d.a,d.b),df=Math.round(L.gp-ag.profit),row=(n,v,b)=>`<tr${b?' class="ft"':''}><td>${n}</td><td class="r">${rp(v)}</td></tr>`;
 return`<p class="mut">Laba rugi · ${esc(perLabel())}</p><div class="tw"><table>${row('Penjualan',L.jual)}${row('Retur penjualan',L.ret)}${row('Harga pokok penjualan',-L.hpp)}${row('Laba kotor',L.gp,1)}${row('Pendapatan lain',L.lain)}${L.beban.map(r=>row(esc(r.m.name),-r.v)).join('')}${row('Total beban',-L.tb)}${row('Laba bersih',L.net,1)}</table></div>
 ${Math.abs(df)>1?`<div class="hint">Laba kotor menurut jurnal berbeda ${rp(df)} dari Ringkasan. Biasanya karena pajak/service yang dihitung terpisah atau pembulatan transaksi.</div>`:'<div class="hint">Laba kotor sama dengan angka di Ringkasan.</div>'}`;
}
function nrData(d){
 const A=[],Lb=[],Eq=[];
 d.l.forEach(m=>{const v=jSaldo(d.sA,m.id);if(!v&&m.type!=='A')return;if(m.type==='A'&&v)A.push({n:m.name,v});else if(m.type==='L'&&v)Lb.push({n:m.name,v});else if(m.type==='E'&&v)Eq.push({n:m.name,v})});
 const laba=sum(d.l.filter(m=>m.type==='R'),m=>jSaldo(d.sA,m.id))-sum(d.l.filter(m=>m.type==='X'),m=>jSaldo(d.sA,m.id));
 Eq.push({n:'Laba berjalan (sejak pembukuan)',v:laba});
 let adj=0;if(d.live){const fis=Math.round(sum((D.products||[]).filter(p=>p.trackStock!==false),p=>(+p.stock||0)*(+p.cogs||0))),led=jSaldo(d.sA,'persediaan');adj=fis-led;if(adj){A.push({n:'Penyesuaian persediaan ke stok fisik',v:adj});Eq.push({n:'Selisih persediaan (penyesuaian)',v:adj})}}
 return{A,Lb,Eq,ta:sum(A,x=>x.v),tl:sum(Lb,x=>x.v),te:sum(Eq,x=>x.v),adj};
}
function lapNR(d){
 const N=nrData(d),sec=(t,l,tot)=>`<tr class="ft"><td colspan="2">${t}</td></tr>${l.map(x=>`<tr><td style="padding-left:20px">${esc(x.n)}</td><td class="r">${rp(x.v)}</td></tr>`).join('')}<tr class="ft"><td>Total ${t.toLowerCase()}</td><td class="r">${rp(tot)}</td></tr>`;
 return`<p class="mut">Neraca per ${esc(asLbl(d.end))}</p><div class="tw"><table>${sec('Aset',N.A,N.ta)}${sec('Kewajiban',N.Lb,N.tl)}${sec('Ekuitas',N.Eq,N.te)}<tr class="ft"><td>Kewajiban + Ekuitas</td><td class="r">${rp(N.tl+N.te)}</td></tr></table></div>
 <div class="hint">${Math.abs(N.ta-N.tl-N.te)<=1?'Seimbang: aset sama dengan kewajiban ditambah ekuitas.':'Tidak seimbang. Selisih '+rp(N.ta-N.tl-N.te)+'.'}${N.adj?` Persediaan dicocokkan ke nilai stok fisik (stok × harga modal) hari ini; selisihnya ${rp(N.adj)} dicatat sebagai penyesuaian di ekuitas.`:''}</div>`;
}
function lapCsv(){
 const d=lapData();
 if(JL.t==='lr'){const L=lrData(d);csv('Laba-Rugi',[['Pos','Nilai'],['Penjualan',L.jual],['Retur penjualan',L.ret],['HPP',-L.hpp],['Laba kotor',L.gp],['Pendapatan lain',L.lain],...L.beban.map(r=>[r.m.name,-r.v]),['Total beban',-L.tb],['Laba bersih',L.net]])}
 else if(JL.t==='nr'){const N=nrData(d);csv('Neraca',[['Pos','Nilai'],...N.A.map(x=>[x.n,x.v]),['Total aset',N.ta],...N.Lb.map(x=>[x.n,x.v]),['Total kewajiban',N.tl],...N.Eq.map(x=>[x.n,x.v]),['Total ekuitas',N.te]])}
 else csv('Neraca-Saldo',[['Kode','Akun','Debit','Kredit'],...d.l.map(m=>{const o=d.sA[m.id]||{dr:0,cr:0},n=o.dr-o.cr;return[m.code,m.name,n>0?n:0,n<0?-n:0]}).filter(r=>r[2]||r[3])]);
}

/* ---------- Faktur Penjualan, piutang, dan penjualan per pelanggan ---------- */
const SIN=()=>D.sinvoices||[];
const sinPaid=f=>sum(f.payments||[],p=>+p.amount||0);
const sinLeft=f=>Math.max(0,Math.round((+f.total||0)-sinPaid(f)));
const sinSt=f=>sinLeft(f)<=0?'lunas':sinPaid(f)>0?'sebagian':'hutang';
const SPST={lunas:['Lunas','g'],sebagian:['Sebagian','k'],hutang:['Belum dibayar','v']};
const FJ={st:''};
const custKey=t=>t.customerId||(t.customer&&t.customer.id)||('n:'+(t.custName||(t.customer&&t.customer.name)||'Pelanggan umum'));
const custNm=t=>t.custName||(t.customer&&t.customer.name)||'Pelanggan umum';
function sinTx(f){
 const items=(f.items||[]).map(i=>({name:i.name,unit:i.unit||'',qty:+i.qty||0,price:+i.price||0,cogs:+i.cogs||0,cat:i.cat||'Umum'})),sub=f.sub!=null?f.sub:sum(items,i=>i.qty*i.price),tax=+f.tax||0,tot=+f.total||0;
 return{id:'fj'+f.id,inv:true,no:f.no,ts:f.ts,cashier:'Faktur',type:'faktur',channel:'',customerId:f.customerId,custName:f.customerName,items,subtotal:sub,manualDisc:+f.disc||0,rounding:+f.ship||0,tax,taxIncl:false,service:0,total:tot,net:tot-tax,payments:[{m:'faktur',ap:tot}],status:'paid'};
}
function sinNo(){
 const n=new Date(),pre='FJ-'+n.getFullYear()+p2(n.getMonth()+1)+'-';let mx=0;
 SIN().forEach(f=>{if(String(f.no).indexOf(pre)===0)mx=Math.max(mx,parseInt(String(f.no).slice(pre.length),10)||0)});
 return pre+String(mx+1).padStart(3,'0');
}
async function cfIn(acc,amount,note,ref,ts){
 if(!acc||!(amount>0))return;
 await pushQuiet('cf',{id:'cf'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:ts||Date.now(),type:'in',acc,to:'',cat:'Pelunasan piutang',amount:Math.round(amount),note,nonop:true,by:cfg.nm||'',ref:ref||''});
}
function sinList(){const[a,b]=range();return SIN().filter(f=>f.ts>=a&&f.ts<b&&(!FJ.st||(FJ.st==='open'?sinLeft(f)>0:sinSt(f)===FJ.st))).sort((x,y)=>y.ts-x.ts)}
function vFakturJual(){
 const[a,b]=range(),all=SIN().filter(f=>f.ts>=a&&f.ts<b),l=sinList();
 return`<div class="kg"><div class="kc"><small>Jumlah faktur · ${esc(perLabel())}</small><b>${all.length}</b></div><div class="kc"><small>Total penjualan faktur</small><b>${rp(sum(all,f=>+f.total||0))}</b></div><div class="kc"><small>Sudah diterima</small><b style="color:var(--ok)">${rp(sum(all,sinPaid))}</b></div><div class="kc"><small>Belum dibayar pelanggan</small><b style="color:var(--${sum(all,sinLeft)>0?'bad':'ok'})">${rp(sum(all,sinLeft))}</b></div></div>
 <div class="card"><div class="tool"><select onchange="FJ.st=this.value;render()"><option value="">Semua status</option><option value="open" ${FJ.st==='open'?'selected':''}>Masih ada piutang</option><option value="lunas" ${FJ.st==='lunas'?'selected':''}>Lunas</option></select><span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="sinExport()">${ic('dl',16)} CSV</button><button class="btn pri" onclick="sinForm()">${ic('plus',16)} Faktur Baru</button></span></div>
 <div class="tw">${l.length?`<table><tr><th>No. faktur</th><th>Tanggal</th><th>Pelanggan</th><th class="r">Total</th><th class="r">Diterima</th><th class="r">Sisa</th><th>Jatuh tempo</th><th>Status</th></tr>${l.map(f=>`<tr class="cl" onclick="sinView('${f.id}')"><td><b>${esc(f.no)}</b></td><td>${dk(f.ts)}</td><td>${esc(f.customerName||'-')}</td><td class="r">${rp(f.total)}</td><td class="r">${rp(sinPaid(f))}</td><td class="r"><b>${rp(sinLeft(f))}</b></td><td>${f.due?dk(f.due):'-'}${f.due&&sinLeft(f)>0&&f.due<Date.now()?' <span class="badge v">lewat</span>':''}</td><td><span class="badge ${SPST[sinSt(f)][1]}">${SPST[sinSt(f)][0]}</span></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada faktur penjualan pada periode ini.</div>'}</div></div>`;
}
function sinExport(){csv('Faktur-Penjualan',[['No Faktur','Tanggal','Pelanggan','Diskon','Ongkir','PPN','Total','Diterima','Sisa','Jatuh Tempo','Status'],...sinList().map(f=>[f.no,dk(f.ts),f.customerName||'',f.disc||0,f.ship||0,f.tax||0,f.total,sinPaid(f),sinLeft(f),f.due?dk(f.due):'',SPST[sinSt(f)][0]])])}
function sinRow(it){
 const ps=D.products.filter(p=>p.active!==false).sort((x,y)=>String(x.name).localeCompare(String(y.name)));
 return`<div class="prow" style="display:grid;grid-template-columns:1fr 84px 112px 34px;gap:6px;margin-bottom:6px;align-items:center"><select class="pp" onchange="sinPick(this)"><option value="">— pilih produk —</option>${ps.map(p=>`<option value="${esc(p.id)}" data-pr="${+p.price||0}" ${it&&it.pid===p.id?'selected':''}>${esc(p.name)} (${esc(p.unit||'')})</option>`).join('')}</select><input class="pq" type="number" inputmode="decimal" step="any" min="0" placeholder="Jumlah" oninput="sinTot()"><input class="pb" type="number" inputmode="numeric" min="0" placeholder="Harga jual" oninput="sinTot()"><button class="btn sm del" onclick="this.parentNode.remove();sinTot()">✕</button></div>`;
}
function sinPick(sel){const r=sel.parentNode,pb=r.querySelector('.pb'),c=sel.selectedOptions[0]&&sel.selectedOptions[0].dataset.pr;if(pb&&!pb.value&&+c>0)pb.value=c;sinTot()}
function sinAdd(){const r=$('#j_rows');if(r.children.length>=60){alert('Maksimal 60 barang per faktur');return}r.insertAdjacentHTML('beforeend',sinRow())}
function sinItems(){return[...document.querySelectorAll('#j_rows .prow')].map(r=>{const id=r.querySelector('.pp').value,p=D.products.find(x=>x.id===id);return{pid:id,name:p?p.name:'',unit:p?p.unit:'',cat:p?p.cat||p.category||'Umum':'Umum',cogs:p?+p.cogs||0:0,trackStock:p?p.trackStock!==false:false,qty:+r.querySelector('.pq').value||0,price:+r.querySelector('.pb').value||0}}).filter(x=>x.pid&&x.qty>0)}
function sinCalc(items){items=items||sinItems();const sub=Math.round(sum(items,x=>x.qty*x.price)),disc=Math.min(sub,Math.max(0,Math.round(+v('j_disc')||0))),ship=Math.max(0,Math.round(+v('j_ship')||0)),pct=Math.max(0,+v('j_tax')||0),tax=Math.round((sub-disc)*pct/100);return{sub,disc,ship,pct,tax,total:sub-disc+ship+tax}}
function sinTot(){const c=sinCalc(),e=$('#j_tot'),d=$('#j_det');if(e)e.textContent=rp(c.total);if(d)d.textContent=(c.disc||c.ship||c.tax)?'Barang '+rp(c.sub)+(c.disc?' − diskon '+rp(c.disc):'')+(c.ship?' + ongkir '+rp(c.ship):'')+(c.tax?' + PPN '+rp(c.tax):''):'';sinPayUi()}
function sinTerm(){const t=+v('j_term');if(t>0){const d=new Date(dts(v('j_date')));d.setDate(d.getDate()+t);$('#j_due').value=dk(d.getTime())}else if(t===0)$('#j_due').value=''}
function sinPayUi(){const m=v('j_pay'),w=$('#j_amtw'),h=$('#j_payh');if(!w)return;w.style.display=m==='sebagian'?'':'none';if(h)h.textContent=m==='lunas'?'Diterima '+rp(sinCalc().total)+' dan masuk ke rekening yang dipilih.':m==='hutang'?'Belum ada uang masuk. Tercatat sebagai piutang pelanggan.':'Sisanya tercatat sebagai piutang.'}
function sinForm(custId){
 const cs=(D.customers||[]).filter(c=>c.active!==false);
 if(!cs.length){alert('Tambahkan pelanggan dulu di menu Pelanggan.');return}
 if(!activeBanks().length){alert('Buat rekening dulu di Arus Kas & Rekening, supaya pembayaran faktur bisa dicatat.');return}
 dlg(`<h3>Faktur Penjualan Baru</h3>

function kbData(){
 const paid={};CFS().filter(x=>x.type==='in'&&/^kb:/.test(x.ref||'')).forEach(x=>{const k=x.ref.slice(3);paid[k]=(paid[k]||0)+(+x.amount||0)});
 const by={};D.tx.forEach(t=>{if(t.inv||t.status==='void')return;const a=sum((t.payments||[]).filter(p=>p.m==='kasbon'),p=>+p.ap||0);if(!(a>0))return;const k=custKey(t);(by[k]||(by[k]={key:k,name:custNm(t),tx:[],paid:paid[k]||0})).tx.push({ts:t.ts,no:t.no,a})});
 Object.values(by).forEach(o=>{o.tx.sort((x,y)=>x.ts-y.ts);let p=o.paid;o.open=[];o.tx.forEach(x=>{const u=Math.min(p,x.a);p-=u;if(x.a-u>0)o.open.push({ts:x.ts,a:x.a-u})});o.total=sum(o.tx,x=>x.a);o.left=sum(o.open,x=>x.a)});
 return by;
}
function piuData(){
 const rows={},R=(k,n)=>rows[k]||(rows[k]={key:k,name:n,a:[0,0,0,0,0],t:0,n:0,fk:0,kb:0}),age=base=>{const d=Math.floor((Date.now()-base)/864e5);return d<=0?0:d<=30?1:d<=60?2:d<=90?3:4};
 SIN().filter(f=>sinLeft(f)>0).forEach(f=>{const r=R(f.customerId||('n:'+f.customerName),f.customerName||'-'),l=sinLeft(f);r.a[age(f.due||f.ts)]+=l;r.t+=l;r.fk+=l;r.n++});
 Object.values(kbData()).forEach(o=>{if(!(o.left>0))return;const r=R(o.key,o.name);o.open.forEach(x=>{r.a[age(x.ts)]+=x.a});r.t+=o.left;r.kb+=o.left;r.n++});
 return Object.values(rows).sort((x,y)=>y.t-x.t);
}

 window._piu=rows;

 CFS().filter(x=>x.type==='in'&&/^kb:/.test(x.ref||'')&&x.ts>=a&&x.ts<b).forEach(x=>rc.push({ts:x.ts,no:'Kasbon POS',c:String(x.note||'').replace(/^Pelunasan kasbon · /,''),acc:accName(x.acc),amt:+x.amount||0}));rc.sort((x,y)=>y.ts-x.ts);
 return`<div class="kg"><div class="kc hero"><small>Total piutang pelanggan</small><b>${rp(tot)}</b><div style="margin-top:6px;opacity:.9">${rows.length} pelanggan · faktur ${rp(sum(rows,r=>r.fk))} · kasbon kasir ${rp(sum(rows,r=>r.kb))}</div></div>

 const r=window._piu[i],kb=kbData()[r.key];if(!kb)return;const a=Math.round(+v('k_amt')||0),acc=v('k_acc');
 if(!(a>0)){alert('Isi jumlah');return}if(!acc){alert('Pilih rekening');return}
 if(a>kb.left){alert('Jumlah melebihi sisa kasbon ('+rp(kb.left)+')');return}
 safe(()=>cfIn(acc,a,'Pelunasan kasbon · '+r.name,'kb:'+r.key,dts(v('k_date'))).then(()=>{busy=false;return load()}),btn);
}

/* penjualan per pelanggan (tidak dikunci) */
const PLG={q:''};
function plgData(){
 const[a,b]=range(),tx=agg(a,b).tx,by={};
 tx.forEach(t=>{const k=custKey(t),o=by[k]||(by[k]={key:k,name:custNm(t),n:0,total:0,profit:0,tx:[]}),tt=t.total-(t.compAmt||0);o.n++;o.total+=tt;o.profit+=(t.net||0)*(1-cRatio(t))-sum(t.items,i=>i.qty*(i.cogs||0));o.tx.push(t)});
 return Object.values(by).sort((x,y)=>y.total-x.total);
}
function vPlgLap(){
 const rows=plgData(),tot=sum(rows,r=>r.total),q=PLG.q.toLowerCase(),l=rows.filter(r=>!q||r.name.toLowerCase().includes(q));
 window._plg=l;
 return`<div class="kg"><div class="kc"><small>Pelanggan bertransaksi · ${esc(perLabel())}</small><b>${rows.filter(r=>r.key.indexOf('n:')!==0).length}</b></div><div class="kc"><small>Total penjualan</small><b>${rp(tot)}</b></div><div class="kc"><small>Laba kotor</small><b>${rp(sum(rows,r=>r.profit))}</b></div></div>
 <div class="card"><div class="tool"><input placeholder="Cari pelanggan…" value="${esc(PLG.q)}" oninput="PLG.q=this.value;render()"><span style="margin-left:auto"><button class="btn" onclick="plgCsv()">${ic('dl',16)} CSV</button></span></div>
 <div class="tw">${l.length?`<table><tr><th>Pelanggan</th><th class="r">Transaksi</th><th class="r">Total</th><th class="r">Rata-rata</th><th class="r">Laba kotor</th><th class="r">Porsi</th></tr>${l.map((r,i)=>`<tr class="cl" onclick="plgDetail(${i})"><td><b>${esc(r.name)}</b></td><td class="r">${r.n}</td><td class="r">${rp(r.total)}</td><td class="r">${rp(r.n?r.total/r.n:0)}</td><td class="r">${rp(r.profit)}</td><td class="r">${tot?Math.round(r.total/tot*100):0}%</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada penjualan pada periode ini.</div>'}</div></div>`;
}
function plgCsv(){csv('Penjualan-per-Pelanggan',[['Pelanggan','Transaksi','Total','Laba Kotor'],...(window._plg||[]).map(r=>[r.name,r.n,r.total,r.profit])])}
function plgDetail(i){
 const r=(window._plg||[])[i];if(!r)return;const pr={};
 r.tx.forEach(t=>t.items.forEach(x=>{const q=+(x.qty-(x.refQty||0)).toFixed(3);if(q<=0)return;const o=pr[x.name]||(pr[x.name]={q:0,rev:0,u:x.unit});o.q+=q;o.rev+=q*x.price}));
 const tp=Object.entries(pr).sort((x,y)=>y[1].rev-x[1].rev).slice(0,10);
 dlg(`<h3>${esc(r.name)}</h3><div class="mut" style="margin-bottom:8px">${esc(perLabel())} · ${r.n} transaksi · total <b>${rp(r.total)}</b></div>
 <b>Produk yang dibeli</b><div class="tw"><table><tr><th>Produk</th><th class="r">Jumlah</th><th class="r">Nilai</th></tr>${tp.map(([n,o])=>`<tr><td>${esc(n)}</td><td class="r">${fq(o.q)} ${esc(o.u||'')}</td><td class="r">${rp(o.rev)}</td></tr>`).join('')}</table></div>
 <b style="display:block;margin-top:12px">Transaksi</b><div class="tw"><table><tr><th>No.</th><th>Tanggal</th><th>Sumber</th><th class="r">Total</th></tr>${r.tx.slice(0,100).map(t=>`<tr><td>${esc(t.no)}</td><td>${dk(t.ts)}</td><td>${t.inv?'Faktur':'Kasir'}</td><td class="r">${rp(t.total)}</td></tr>`).join('')}</table></div>${r.tx.length>100?'<div class="hint">Menampilkan 100 transaksi terbaru.</div>':''}
 <div class="acts2"><button class="btn" onclick="closeDlg()">Tutup</button></div>`,true);
}

const HST={};
function hutOpen(){return PUR().filter(f=>purLeft(f)>0)}
function hutAge(f){const base=f.due||f.ts,d=Math.floor((Date.now()-base)/864e5);return d<=0?0:d<=30?1:d<=60?2:d<=90?3:4}
function hutRing(){if(!hasF('pembelian'))return'';const o=hutOpen();if(!o.length)return'';const late=o.filter(f=>f.due&&f.due<Date.now());return`<div class="kc" style="cursor:pointer" onclick="go('hutang')"><small>Hutang ke pemasok</small><b style="color:var(--bad)">${rp(sum(o,purLeft))}</b><small>${o.length} faktur${late.length?' · '+late.length+' lewat jatuh tempo':''}</small></div>`}
const AGE=['Belum jatuh tempo','1–30 hari','31–60 hari','61–90 hari','> 90 hari'];
function vHutang(){
 const o=hutOpen(),tot=sum(o,purLeft),late=o.filter(f=>f.due&&f.due<Date.now()),by={};
 o.forEach(f=>{const k=f.supplierId||f.supplierName||'-',r=by[k]||(by[k]={id:f.supplierId,name:f.supplierName||'-',a:[0,0,0,0,0],n:0,t:0});r.a[hutAge(f)]+=purLeft(f);r.t+=purLeft(f);r.n++});
 const rows=Object.values(by).sort((x,y)=>y.t-x.t),col=AGE.map((_,i)=>sum(rows,r=>r.a[i]));
 const[a,b]=range(),pays=[];PUR().forEach(f=>(f.payments||[]).forEach(p=>{if(p.ts>=a&&p.ts<b)pays.push({ts:p.ts,no:f.no,sup:f.supplierName||'-',acc:p.acc?accName(p.acc):(p.method||'-'),amt:+p.amount||0})}));pays.sort((x,y)=>y.ts-x.ts);
 const st=sum((D.stocklog||[]).filter(x=>x.type==='add'&&+x.buyPrice>0&&/^\[HUTANG\]/i.test(x.note||'')&&!/^\[FB\]/i.test(x.note||'')),x=>Math.round((+x.delta||+x.qty||0)*(+x.buyPrice)));
 return`<div class="kg"><div class="kc hero"><small>Total hutang usaha</small><b>${rp(tot)}</b><div style="margin-top:6px;opacity:.9">${o.length} faktur belum lunas · ${rows.length} pemasok</div></div>
 <div class="kc"><small>Sudah lewat jatuh tempo</small><b style="color:var(--${late.length?'bad':'ok'})">${rp(sum(late,purLeft))}</b><small>${late.length} faktur</small></div>
 <div class="kc"><small>Jatuh tempo 7 hari ke depan</small><b>${rp(sum(o.filter(f=>f.due&&f.due>=Date.now()&&f.due<Date.now()+7*864e5),purLeft))}</b></div></div>
 <div class="card"><h4>Umur Hutang per Pemasok</h4><p>Sisa hutang dikelompokkan dari tanggal jatuh tempo (kalau kosong, dari tanggal faktur). Ketuk pemasok untuk kartu hutangnya.</p>
 <div class="tool"><span style="margin-left:auto"><button class="btn" onclick="hutExport()">${ic('dl',16)} CSV umur hutang</button></span></div>
 <div class="tw">${rows.length?`<table><tr><th>Pemasok</th><th class="r">Faktur</th>${AGE.map(x=>`<th class="r">${x}</th>`).join('')}<th class="r">Total</th></tr>${rows.map(r=>`<tr class="cl" onclick="hutCard('${esc(r.id||'')}','${esc(r.name).replace(/'/g,'')}')"><td><b>${esc(r.name)}</b></td><td class="r">${r.n}</td>${r.a.map((x,i)=>`<td class="r"${i>=3&&x?' style="color:var(--bad)"':''}>${x?rp(x):'-'}</td>`).join('')}<td class="r"><b>${rp(r.t)}</b></td></tr>`).join('')}<tr class="ft"><td>Total</td><td class="r">${o.length}</td>${col.map(x=>`<td class="r">${rp(x)}</td>`).join('')}<td class="r">${rp(tot)}</td></tr></table>`:'<div class="empty">Tidak ada hutang. Semua faktur sudah lunas.</div>'}</div>
 ${st>0?`<div class="hint" style="margin-top:8px">Catatan: ada ${rp(st)} pembelian “belum dibayar” dari Isi Stok cepat yang belum berupa faktur, jadi belum masuk laporan ini. Catat lewat Faktur Pembelian supaya bisa dilunasi.</div>`:''}</div>
 <div class="card"><h4>Riwayat Pembayaran Hutang</h4><p>Pembayaran ke pemasok · ${esc(perLabel())}</p>
 <div class="tool"><b>${rp(sum(pays,x=>x.amt))}</b><span class="mut">&nbsp;${pays.length} pembayaran</span><span style="margin-left:auto"><button class="btn" onclick="hutPayExport()">${ic('dl',16)} CSV</button></span></div>
 <div class="tw">${pays.length?`<table><tr><th>Tanggal</th><th>Faktur</th><th>Pemasok</th><th>Rekening</th><th class="r">Jumlah</th></tr>${pays.map(p=>`<tr><td>${fmtT(p.ts)}</td><td>${esc(p.no)}</td><td>${esc(p.sup)}</td><td>${esc(p.acc)}</td><td class="r">${rp(p.amt)}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada pembayaran pada periode ini.</div>'}</div></div>`;
}
function hutExport(){
 const by={};hutOpen().forEach(f=>{const k=f.supplierId||f.supplierName,r=by[k]||(by[k]={name:f.supplierName||'-',a:[0,0,0,0,0],t:0});r.a[hutAge(f)]+=purLeft(f);r.t+=purLeft(f)});
 csv('Umur-Hutang',[['Pemasok',...AGE,'Total'],...Object.values(by).map(r=>[r.name,...r.a,r.t])]);
}
function hutPayExport(){
 const[a,b]=range(),l=[];PUR().forEach(f=>(f.payments||[]).forEach(p=>{if(p.ts>=a&&p.ts<b)l.push([fmtT(p.ts),f.no,f.supplierName||'',p.acc?accName(p.acc):(p.method||''),p.amount])}));
 csv('Pembayaran-Hutang',[['Tanggal','Faktur','Pemasok','Rekening','Jumlah'],...l]);
}
function hutLedger(id,name){
 const l=[];PUR().filter(f=>id?f.supplierId===id:(f.supplierName||'-')===name).forEach(f=>{l.push({ts:f.ts,d:'Faktur '+f.no,plus:+f.total||0,minus:0});(f.payments||[]).forEach(p=>l.push({ts:p.ts,d:'Bayar '+f.no+' · '+(p.acc?accName(p.acc):(p.method||'-')),plus:0,minus:+p.amount||0}))});
 l.sort((x,y)=>x.ts-y.ts||y.plus-x.plus);let s=0;l.forEach(x=>{s+=x.plus-x.minus;x.bal=s});return l;
}
function hutCard(id,name){
 const l=hutLedger(id,name);
 dlg(`<h3>Kartu Hutang · ${esc(name)}</h3><div class="mut" style="margin-bottom:8px">Saldo akhir <b>${rp(l.length?l[l.length-1].bal:0)}</b></div>
 <div class="tw"><table><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Hutang +</th><th class="r">Bayar −</th><th class="r">Saldo</th></tr>${l.map(x=>`<tr><td>${dk(x.ts)}</td><td>${esc(x.d)}</td><td class="r">${x.plus?rp(x.plus):''}</td><td class="r">${x.minus?rp(x.minus):''}</td><td class="r"><b>${rp(x.bal)}</b></td></tr>`).join('')}</table></div>
 <div class="acts2"><button class="btn" onclick="hutCardCsv('${esc(id||'')}','${esc(name).replace(/'/g,'')}')">${ic('dl',16)} CSV</button><button class="btn" onclick="closeDlg()">Tutup</button></div>`,true);
}
function hutCardCsv(id,name){csv('Kartu-Hutang-'+name,[['Tanggal','Keterangan','Hutang +','Bayar −','Saldo'],...hutLedger(id,name).map(x=>[dk(x.ts),x.d,x.plus,x.minus,x.bal])])}
function purView(id){
 const f=PUR().find(x=>x.id===id);if(!f)return;const st=purSt(f),left=purLeft(f);
 dlg(`<h3>Faktur ${esc(f.no)}</h3><div class="mut" style="margin-bottom:8px">${esc(f.supplierName||'-')} · ${dk(f.ts)}${f.due?' · jatuh tempo '+dk(f.due):''} <span class="badge ${PST[st][1]}">${PST[st][0]}</span></div>
 <div class="tw"><table><tr><th>Barang</th><th class="r">Jumlah</th><th class="r">Harga beli</th><th class="r">Subtotal</th></tr>${(f.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${fq(i.qty)} ${esc(i.unit||'')}</td><td class="r">${rp(i.price)}</td><td class="r">${rp(i.qty*i.price)}</td></tr>`).join('')}${purSum(f)}</table></div>
 <b style="display:block;margin-top:12px">Pembayaran</b><div class="tw">${(f.payments||[]).length?`<table><tr><th>Tanggal</th><th>Rekening</th><th class="r">Jumlah</th></tr>${f.payments.map(p=>`<tr><td>${fmtT(p.ts)}</td><td>${esc(p.acc?accName(p.acc):(p.method||'-'))}</td><td class="r">${rp(p.amount)}</td></tr>`).join('')}<tr class="ft"><td colspan="2">Sisa hutang</td><td class="r">${rp(left)}</td></tr></table>`:'<div class="mut" style="padding:8px">Belum ada pembayaran.</div>'}</div>
 ${f.note?`<div class="mut" style="margin-top:8px">Catatan: ${esc(f.note)}</div>`:''}
 <div class="acts2">${left>0?`<button class="btn pri" onclick="purPayForm('${f.id}')">Bayar / Lunasi</button>`:''}<button class="btn" onclick="purPrint('${f.id}')">Cetak / PDF</button><button class="btn del" onclick="purDel('${f.id}')">Hapus</button><button class="btn" onclick="closeDlg()">Tutup</button></div>`,true);
}
function purPayForm(id){
 const f=PUR().find(x=>x.id===id);if(!f)return;
 dlg(`<h3>Bayar Faktur ${esc(f.no)}</h3><div class="mut" style="margin-bottom:8px">${esc(f.supplierName||'')} · sisa hutang <b>${rp(purLeft(f))}</b></div>
 ${fld('y_amt','Jumlah dibayar (Rp)',purLeft(f),'number')}<div class="g2"><div><label>Dibayar dari rekening</label>${accSel('y_acc')}</div>${fld('y_date','Tanggal bayar',dk(Date.now()),'date')}</div>
 <div class="acts2"><button class="btn pri" onclick="purPay('${id}',this)">Simpan Pembayaran</button><button class="btn" onclick="purView('${id}')">Batal</button></div>`);
}
function purPay(id,btn){
 const f=PUR().find(x=>x.id===id);if(!f)return;const a=Math.round(+v('y_amt')||0),acc=v('y_acc');
 if(!(a>0)){alert('Isi jumlah pembayaran');return}
 if(a>purLeft(f)){alert('Jumlah melebihi sisa hutang ('+rp(purLeft(f))+')');return}
 const pm={ts:dts(v('y_date')),amount:a,acc,method:acc?accName(acc):'Tidak dicatat'};
 safe(async()=>{
  await pushPost('purchase',Object.assign({},f,{payments:[...(f.payments||[]),pm]}));
  if(acc){try{await cfBuy(acc,a,'Faktur '+f.no+' · '+(f.supplierName||''),'fb:'+f.id,pm.ts);busy=false;await load()}catch(e){alert('Pembayaran tersimpan, tetapi catatan arus kas gagal: '+e.message+'\nCatat manual di Arus Kas & Rekening.')}}
 },btn);
}
function purDel(id){
 const f=PUR().find(x=>x.id===id);if(!f)return;
 const cfs=CFS().filter(x=>x.ref==='fb:'+id||(x.cat==='Pembelian stok'&&String(x.note||'').indexOf('Faktur '+f.no+' · ')===0));
 if(!confirm('Hapus faktur '+f.no+'?'+(cfs.length?' '+cfs.length+' catatan pembayarannya di Arus Kas ikut dihapus.':'')+' Stok yang sudah bertambah dari faktur ini TIDAK ikut dikurangi (koreksi lewat Produk & Stok bila perlu).'))return;
 safe(async()=>{for(const c of cfs)await pushQuiet('cf_del',{id:c.id});await push('purchase_del',{id})});
}

(async function init(){
 if(baseUrl()&&cfg.hp&&cfg.pin){
  $('#app').innerHTML='<div class="lock"><div class="lockbox" style="text-align:center">Memuat data…</div></div>';
  const c=await readCache();
  if(c){
   await loadFitur(baseUrl(),true);D=buildD();start();
   load().then(()=>{if(!$('#dlg').classList.contains('on')&&!MG.includes(tab))render()}).catch(e=>{if(/salah|dikunci|Terlalu|Ditolak/i.test(String(e&&e.message))){cfg.pin='';saveCfg();D=null;render()}});
   return;
  }
  try{await load();start();return}catch(e){}
 }
 render();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!busy&&Date.now()-loadedAt>60000&&!$('#dlg').classList.contains('on')&&!MG.includes(tab))load().then(render).catch(()=>{})});
</script>
