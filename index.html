<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--hd1:#1a44cc;--hd2:#2f6df5;--sh:0 6px 24px rgba(20,40,100,.08);--side:linear-gradient(180deg,#1a44cc,#0f2a7a)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;min-height:44px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--pri)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 5px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
svg{flex-shrink:0;vertical-align:middle}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}

.mut{color:var(--mut)}
.logo{font-weight:800;letter-spacing:.2em;font-size:19px}.logo span{font-weight:300;margin-left:.3em}
.shell{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.side .brand{padding:22px 22px 12px}.side .brand small{display:block;opacity:.65;font-size:12px;margin-top:2px;letter-spacing:.04em}
.ng{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}.chv{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform .2s}.gp.shut .chv{transform:rotate(-45deg);margin-top:0}.gp.shut .ni{display:none}.ng{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:16px 22px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:12px;margin:2px 12px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,.86);background:none;border:0;width:calc(100% - 24px);text-align:left;cursor:pointer;font-weight:600;font-size:14.5px}
.ni:hover{background:rgba(255,255,255,.12)}
.ni.on{background:#fff;color:#1a44cc;box-shadow:0 6px 16px rgba(0,0,40,.25)}
[data-theme=dark] .ni.on{background:#1d2f63;color:#fff}
.sf{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.14)}
.sf .who{font-size:13px;opacity:.85;margin-bottom:10px}
.sf .acts{display:flex;gap:8px}
.sf .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:38px;padding:7px 11px;font-size:13px;flex:1}
.main{flex:1;min-width:0}
.tb{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--bd)}
.tb h2{margin:0;font-size:21px;font-weight:800}.tb .sub{font-size:13px;color:var(--mut)}
.tb .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
.who2{display:flex;align-items:center;gap:10px;padding-left:14px;margin-left:6px;border-left:1px solid var(--bd);min-width:0}.who2 .av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}.who2 .wn{font-weight:700;font-size:13px;line-height:1.2;text-transform:uppercase;max-width:200px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.who2{margin-left:auto;padding-left:0;border:0}.who2 .wn{display:none}}
.hb{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);place-items:center;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:55}
.content{padding:20px 26px 40px;max-width:1500px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 17px;white-space:nowrap;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.kc small{display:block;color:var(--mut);font-size:13px}.kc b{font-size:21px;font-weight:800;display:block}
.kc .dlt{display:inline-block;margin-top:2px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.kc.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border:0;padding:22px}.kc.hero small{color:rgba(255,255,255,.85)}.kc.hero b{font-size:34px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h4{margin:0 0 4px;font-size:16px;font-weight:800}.card p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tool input{flex:1;min-width:200px}.tool select{width:auto;min-width:150px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--pri)}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.ft td{font-weight:800;border-top:2px solid var(--bd);background:var(--soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri)}
.badge.v{background:#fde4e8;color:var(--bad)}.badge.k{background:#fff0d1;color:var(--warn)}.badge.g{background:#dcf5e6;color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px}
.chart .c{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:linear-gradient(180deg,var(--hd2),var(--hd1));border-radius:6px 6px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:10.5px;color:var(--mut)}.axis span{flex:1;min-width:6px;text-align:center;overflow:hidden}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hd1),var(--hd2))}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rk{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.grow{flex:1;min-width:0}.val{text-align:right;font-weight:700}.val small{display:block;color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0 9px 26px;border-bottom:1px solid var(--bd);position:relative}.ins li:last-child{border:0}.ins li:before{content:'💡';position:absolute;left:0}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lgs{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.lgl{position:relative;overflow:hidden}
.lgbrand{position:absolute;top:26px;left:34px;z-index:3;color:#fff}
.lgsl{position:absolute;inset:0}
.lgsl .sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;pointer-events:none}
.lgsl .sl.on{opacity:1;pointer-events:auto}
.lgph{width:min(78%,310px);height:min(50vh,390px);object-fit:cover;object-position:62% 30%;border-radius:26px;box-shadow:0 24px 50px rgba(3,10,50,.45);border:4px solid rgba(255,255,255,.85);margin-top:50px}
.lgph+.lgtx{padding:18px 40px 60px}
.lgph+.lgtx .lgart{display:none}
.lgtx{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 40px 80px}
.lgdots{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.lgdots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}.lgdots i.on{width:26px;background:#fff}
@media(max-width:860px){.lgl{min-height:330px}.lgbrand{top:14px;left:18px}.lgtx{padding:46px 18px 40px}.lgdots{bottom:12px}.lgph{height:170px;width:min(62%,210px);margin-top:46px}.lgph+.lgtx{padding:10px 18px 34px}}
.lgl{background:radial-gradient(900px 500px at 15% 10%,#3b7bff 0%,transparent 60%),linear-gradient(160deg,#1a44cc,#0d2160);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center}
.lgl h2{margin:14px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em;max-width:460px}.lgl p{margin:0;opacity:.85;max-width:420px;font-size:15px}
.lgart{width:100%;max-width:470px;height:auto;margin-top:18px;filter:drop-shadow(0 18px 30px rgba(3,10,50,.35))}
.lgr{display:grid;place-items:center;padding:24px}
.lgr .lockbox .logo{display:none}
@media(max-width:860px){.lgs{grid-template-columns:1fr}.lgl{padding:22px 18px 10px}.lgl h2{font-size:21px;margin-top:6px}.lgl p{display:none}.lgart{max-width:250px;margin-top:8px}}
.lockbox{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#dlg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:80}
#dlg.on{display:flex}
#dlgb{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#dlgb.wide{max-width:920px}
#dlgb h3{margin:0 0 8px}
.sumbox div{display:flex;justify-content:space-between;padding:2px 0;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.acts2{display:flex;gap:8px;margin-top:16px}.acts2 .btn{flex:1}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.strk{background:#fff;color:#111;border:1px dashed #bbb;border-radius:8px;padding:14px;font:12px/1.45 'Courier New',monospace;white-space:pre-wrap;margin:12px auto 0;max-width:300px}
.strk.w80{max-width:380px}
.note{background:var(--soft);border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px}
@media(max-width:1000px){
 .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s}
 .side.open{transform:none}.side.open~.scrim{display:block}
 .hb{display:grid}.tb{padding:12px 14px}.content{padding:14px 14px 40px}
 .two{grid-template-columns:1fr}.kc.hero b{font-size:28px}.tb .r{display:none}
}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.rs-s{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.rs-h{padding:13px 14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:14px}
.rs-h.g{background:rgba(18,161,80,.13)}.rs-h.y{background:rgba(217,138,6,.15)}.rs-h.b{background:rgba(36,87,245,.12)}.rs-h.p{background:rgba(124,58,237,.13)}
.rs-r{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--bd);font-size:14px}
.rs-r span:last-child{text-align:right;white-space:nowrap}
.rs-r.tot{font-weight:800}
.rs-k .kc{border-bottom-width:4px}
.kc.k1{border-bottom-color:#00c897}.kc.k2{border-bottom-color:#f5c518}.kc.k3{border-bottom-color:#0b84e5}.kc.k4{border-bottom-color:#6cb8f5}.kc.k5{border-bottom-color:#7c3aed}.kc.k6{border-bottom-color:#12a150}
.rs-h.o{background:rgba(229,56,79,.12)}
</style>
<style id="modern">
:root{--bg:#f4f6fc;--sh:0 1px 2px rgba(16,28,72,.04),0 10px 32px rgba(16,28,72,.07);--side:linear-gradient(185deg,#2457f5 0%,#1637a8 55%,#0d2160 100%)}
[data-theme=dark]{--bg:#060914;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.4);--side:linear-gradient(185deg,#12275e 0%,#0a1535 55%,#050914 100%)}
html,body{background:var(--bg);letter-spacing:-.005em}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.content{animation:fin .35s ease both}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* sidebar */
.side{box-shadow:6px 0 30px rgba(13,33,96,.18)}
.side .brand{padding:26px 24px 14px}.logo{letter-spacing:.34em;font-size:20px;font-weight:800}.logo span{font-weight:300;letter-spacing:.34em}

.ng{opacity:.5;letter-spacing:.16em;font-size:10.5px;padding:20px 24px 6px}

.ni.on{background:#fff;color:#1a44cc;box-shadow:0 8px 20px rgba(5,15,60,.28)}

.sf{border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.12)}
/* top bar */

.kc{border-radius:20px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.kc:hover{transform:translateY(-2px)}
.kc b{letter-spacing:-.02em}
.kc.hero{border:0;background:linear-gradient(135deg,#1a44cc 0%,#3b7bff 100%);box-shadow:0 18px 40px rgba(36,87,245,.32)}
.kc.hero:before,.kc.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.kc.hero:before{width:240px;height:240px;right:-60px;top:-110px}.kc.hero:after{width:150px;height:150px;right:120px;bottom:-90px;background:rgba(255,255,255,.07)}

.chip:hover{transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,#2457f5,#3b7bff);box-shadow:0 6px 16px rgba(36,87,245,.3)}
input,select{border-radius:13px;border-color:transparent;background:color-mix(in srgb,var(--soft) 70%,var(--card));transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 16%,transparent);background:var(--card)}

th{font-size:11.5px;letter-spacing:.08em;border-bottom:1px solid var(--bd)}
td{border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}
tr.cl:hover td,tbody tr:hover td{background:color-mix(in srgb,var(--soft) 70%,transparent)}
tr.ft td{background:var(--soft);border-top:0}
.badge{padding:3px 10px}
.bar{height:9px}.bar i{border-radius:99px}
.rk{border-radius:10px}
.row{border-bottom-color:color-mix(in srgb,var(--bd) 60%,transparent)}

.cv{width:100%;height:auto;display:block;overflow:visible}

 .side{position:fixed;left:0;top:0;height:100vh;height:100dvh;transform:translateX(-102%)}.side.open{transform:none}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const fq=q=>String(parseFloat((+q).toFixed(3)));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const p2=n=>String(n).padStart(2,'0');

/* ---------- Cache lokal (IndexedDB) + penarikan data bertahap: Backoffice tampil instan, lalu hanya mengambil yang berubah ---------- */
const IDB={_d:null,
 _o(){return this._d||(this._d=new Promise((res,rej)=>{try{const q=indexedDB.open('twinsbo',1);q.onupgradeneeded=()=>q.result.createObjectStore('c');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}))},
 async get(k){try{const d=await this._o();return await new Promise((res,rej)=>{const r=d.transaction('c').objectStore('c').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}},
 async set(k,v){try{const d=await this._o();await new Promise((res,rej)=>{const t=d.transaction('c','readwrite');t.objectStore('c').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
};
const KEYS=['tx','refunds','shifts','cash','products','promos','customers','cgroups','employees','payroll','stocklog','banks','cf','settings','suppliers','purchases','sinvoices'];
const idOf=(k,o)=>k==='stocklog'?(o.ts+'|'+o.name+'|'+o.type+'|'+o.delta+'|'+o.after):o.id;
let RAW=null,SINCE=0,FULLTS=0,SAVET=0;
const ckey=()=>baseUrl()+'|'+(cfg.hp||'');
async function readCache(){
 const c=await IDB.get(ckey());
 if(!c||c.v!==1||!c.raw)return null;
 RAW={};KEYS.forEach(k=>{RAW[k]=new Map((c.raw[k]||[]).map(o=>[idOf(k,o),o]))});
 SINCE=c.since||0;FULLTS=c.full||0;loadedAt=c.loadedAt||0;return c;
}
function saveCache(){
 clearTimeout(SAVET);
 SAVET=setTimeout(()=>{if(!RAW)return;const raw={};KEYS.forEach(k=>raw[k]=RAW[k]?[...RAW[k].values()]:[]);IDB.set(ckey(),{v:1,raw,since:SINCE,full:FULLTS,loadedAt})},800);
}
function clearCache(){clearTimeout(SAVET);const k=ckey();RAW=null;SINCE=0;FULLTS=0;IDB.set(k,null)}
function mergeIn(dat,gone){
 KEYS.forEach(k=>{const m=RAW[k]||(RAW[k]=new Map());(dat[k]||[]).forEach(o=>{if(o)m.set(idOf(k,o),o)});(gone[k]||[]).forEach(id=>m.delete(id))});
}
const AC=new Map();
function buildD(){
 const o={},L=k=>RAW[k]?[...RAW[k].values()]:[],emp=hasF('karyawan')||hasF('komisi')||hasF('gaji')||hasF('bep');
 ['tx','refunds','shifts','cash','products','promos','customers','cgroups','stocklog','banks','cf'].forEach(k=>o[k]=L(k));
 o.employees=emp?L('employees'):[];o.payroll=emp?L('payroll'):[];const pm=hasF('pembelian');o.suppliers=pm?L('suppliers'):[];o.purchases=pm?L('purchases'):[];o.sinvoices=hasF('fakturjual')?L('sinvoices'):[];if(o.sinvoices.length)o.tx=o.tx.concat(o.sinvoices.map(sinTx));
 const st=L('settings');o.outlet=st.find(x=>x.id==='outlet')||{};o.receipt=st.find(x=>x.id==='receipt')||{};o.commission=st.find(x=>x.id==='commission')||null;o.cfmap=st.find(x=>x.id==='cfmap')||{};o.akun=st.find(x=>x.id==='akun')||{};
 AC.clear();return o;
}
async function load(){
 if(busy)return;busy=true;
 try{
  const u=baseUrl();
  if(!RAW)await readCache();
  const full=!RAW||!SINCE||(Date.now()-FULLTS>43200000);   // sinkron penuh tiap 12 jam, selain itu hanya yang berubah
  const url=u+(u.includes('?')?'&':'?')+'action=bopull&hp='+encodeURIComponent(cfg.hp||'')+'&pin='+encodeURIComponent(cfg.pin||'')+(full?'':'&since='+Math.max(0,SINCE-30000));
  const [,r]=await Promise.all([loadFitur(u),fetch(url,{redirect:'follow'})]);
  const j=await r.json();if(!j.ok)throw new Error(j.err||'Ditolak server');
  const dat=j.data||{},gone=j.dels||{};
  if(full){RAW={};FULLTS=Date.now()}
  let changed=full;KEYS.forEach(k=>{if((dat[k]||[]).length||(gone[k]||[]).length)changed=true});
  mergeIn(dat,gone);
  SINCE=j.now||Date.now();
  D=buildD();cfg.nm=j.name||'';loadedAt=Date.now();busy=false;
  if(changed)saveCache();
  return true;
 }catch(e){busy=false;throw e}
}

function range(){
 const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(P.k==='today')return[d0,d0+864e5];
 if(P.k==='yest')return[d0-864e5,d0];
 if(P.k==='lmonth')return[new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),new Date(n.getFullYear(),n.getMonth(),1).getTime()];
 if(P.k==='7d')return[d0-6*864e5,d0+864e5];
 if(P.k==='month')return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),d0+864e5];
 if(P.k==='all')return[0,Infinity];
 return[P.from?new Date(P.from+'T00:00').getTime():0,P.to?new Date(P.to+'T00:00').getTime()+864e5:Infinity];
}

const dk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};

function bepCard(d){

 <div style="margin:4px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Realisasi bulan ini: ${rp(act2)}</b><span class="badge ${st[1]}">${st[0]}</span></div>

  <div style="position:absolute;left:0;top:0;height:100%;width:${w(act2)}%;background:linear-gradient(90deg,var(--hd1),var(--hd2));border-radius:99px"></div>
  <div style="position:absolute;left:${w(bep)}%;top:-6px;height:28px;border-left:2px dashed var(--warn)"></div><div style="position:absolute;left:${w(bep)}%;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap">BEP</div>
  ${T>0?`<div style="position:absolute;left:${w(tg)}%;top:-6px;height:28px;border-left:2px dashed var(--ok)"></div><div style="position:absolute;left:${w(tg)}%;top:22px;transform:translateX(-50%);font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap">Target</div>`:''}
 </div>
 <div class="tw"><table><tr><th></th><th class="r">BEP (impas)</th>${T>0?'<th class="r">Target laba</th>':''}</tr>

 <tr><td>Rata-rata per hari (${dim} hari)</td><td class="r">${rp(bpd)}</td>${T>0?`<td class="r">${rp(tpd)}</td>`:''}</tr>
 <tr><td>Nota per hari${avg?' (rata-rata '+rp(avg)+'/nota)':''}</td><td class="r">${avg?Math.ceil(bpd/avg):'-'}</td>${T>0?`<td class="r">${avg?Math.ceil(tpd/avg):'-'}</td>`:''}</tr>
 <tr><td>Kekurangan bulan ini</td><td class="r" style="color:var(--${act2>=bep?'ok':'bad'})">${act2>=bep?'Terlampaui '+rp(act2-bep):rp(bep-act2)}</td>${T>0?`<td class="r" style="color:var(--${act2>=tg?'ok':'bad'})">${act2>=tg?'Terlampaui '+rp(act2-tg):rp(tg-act2)}</td>`:''}</tr>
 <tr><td>Perlu per hari sisa ${left} hari</td><td class="r">${rp(needBep)}</td>${T>0?`<td class="r">${rp(needTg)}</td>`:''}</tr></table></div>

function vAnalisa(d){
 const pv=prevAgg();
 const dl=(c,p,inv)=>{if(p==null)return'';if(p===0)return c>0?'<small class="dlt up">baru</small>':'';const v=(c-p)/Math.abs(p)*100,up=v>=0;return`<small class="dlt ${up!==!!inv?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</small>`};
 const aov=a=>a.tx.length?a.gross/a.tx.length:0,mg=a=>a.net?a.profit/a.net*100:0;
 const K=(l,v,c,p,inv)=>`<div class="kc"><small>${l}</small><b>${v}</b>${pv?dl(c,p,inv):''}</div>`;
 const keys=Object.keys(d.day).sort(),dv=keys.map(k=>d.day[k]);
 let h0=6,h1=23;const hs=Object.keys(d.hour).map(Number).filter(h=>d.hour[h]>0);if(hs.length){h0=Math.min(...hs);h1=Math.max(...hs)}
 const hv=[],hl=[];for(let h=h0;h<=h1;h++){hv.push(d.hour[h]);hl.push(p2(h))}
 const wv=[1,2,3,4,5,6,0].map(w=>d.wd[w]),wl=[1,2,3,4,5,6,0].map(w=>DAYN[w].slice(0,3));
 const prods=Object.entries(d.prod),totRev=sum(prods,x=>x[1].rev)||1;
 const topP=[...prods].sort((a,b)=>b[1].profit-a[1].profit).slice(0,5),maxP=topP.length&&topP[0][1].profit>0?topP[0][1].profit:1;
 const lowM=prods.filter(x=>x[1].rev>0).sort((a,b)=>a[1].profit/a[1].rev-b[1].profit/b[1].rev).slice(0,5);
 const cats=Object.entries(d.cat).sort((a,b)=>b[1].rev-a[1].rev);
 const ins=[];
 if(d.tx.length){
  const bh=Object.keys(d.hour).reduce((a,b)=>d.hour[b]>d.hour[a]?b:a,0),bw=Object.keys(d.wd).reduce((a,b)=>d.wd[b]>d.wd[a]?b:a,0);
  if(d.hour[bh]>0)ins.push('Jam paling ramai: <b>'+p2(bh)+':00–'+p2((+bh+1)%24)+':00</b> dengan penjualan '+rp(d.hour[bh])+'.');
  if(d.wd[bw]>0)ins.push('Hari paling ramai: <b>'+DAYN[bw]+'</b> ('+rp(d.wd[bw])+').');

function cfFlows(){

 Object.values(fg).forEach(o=>add(o.ts,o.a,'fee','Biaya MDR/platform',0,o.v,'Otomatis'));

  const a=accOf('gaji'),c=+p.comm||0,g=(+p.total||0)-c,nm=(p.empName||'')+' '+(p.period||'');
  if(g>0)add(+p.paidTs,a,'pay','Gaji '+nm,0,g,'Otomatis',undefined,{cat:'Gaji'});

 });

 D.cash.forEach(x=>add(x.ts,accOf(x.src==='luar'?'luar':'tunai'),'pos',(x.cat||'')+(x.note?' · '+x.note:''),x.type==='in'?x.amount:0,x.type==='out'?x.amount:0,'Kasir',undefined,{cat:x.cat||'Lainnya'}));

 });

function cfCalc(){

 cfFlows().sort((x,y)=>x.ts-y.ts).forEach(f=>{
  const s=S[f.acc];if(!s||f.ts<s.ots||f.ts>=b)return;
  s.bal+=f.inn-f.out;

 });

 <path d="${d}" fill="none" stroke="var(--pri,#6366f1)" stroke-width="2.5" stroke-linejoin="round"/>${n<=31?pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="var(--pri,#6366f1)"/>`).join(''):''}
 ${t(4,Y(mx)+4,cfmt(mx))}${t(4,Y(mn)+4,cfmt(mn))}${t(p,H-6,esc(pts[1].d))}${t(W-10,H-6,esc(pts[n].d),'end')}</svg><div class="mut" style="font-size:12px">Saldo akhir tiap hari yang ada mutasi, untuk rekening yang dipilih.</div>`;
}
function cfStmt(rows,start){
 const g=(f,k,s)=>{const o={};rows.filter(f).forEach(r=>{const n=k(r);o[n]=(o[n]||0)+s(r)});return Object.entries(o).filter(x=>x[1]).sort((a,b)=>b[1]-a[1])};
 const sales=g(r=>r.kind==='sale',r=>METHODS[r.m]||r.m,r=>r.inn),exp=g(r=>(r.kind==='pos'||r.kind==='out'||r.kind==='pay')&&r.out>0,r=>r.cat||'Lainnya',r=>r.out),oth=g(r=>(r.kind==='pos'||r.kind==='in')&&r.inn>0,r=>r.cat||'Lainnya',r=>r.inn);
 const ref=sum(rows.filter(r=>r.kind==='ref'),r=>r.out),fee=sum(rows.filter(r=>r.kind==='fee'),r=>r.out),tf=sum(rows.filter(r=>r.kind==='tf'),r=>r.inn-r.out);
 const ts=sum(sales,x=>x[1]),te=sum(exp,x=>x[1]),to=sum(oth,x=>x[1]),op=ts-ref-fee-te,neg=x=>'('+rp(x)+')';
 const R=(l,x,b,i)=>`<tr><td style="padding-left:${i?24:8}px">${b?'<b>'+l+'</b>':l}</td><td class="r">${b?'<b>'+x+'</b>':x}</td></tr>`;
 return`<div class="card"><h4>Laporan Arus Kas</h4><p>Dari penerimaan penjualan sampai saldo akhir, sesuai filter di atas</p><div class="tw"><table>
 ${R('Saldo awal periode',rp(start),1)}${R('Penerimaan penjualan',rp(ts),1)}${sales.map(x=>R(esc(x[0]),rp(x[1]),0,1)).join('')}
 ${R('Dikurangi',' ',1)}${R('Refund',neg(ref),0,1)}${R('Biaya MDR / platform',neg(fee),0,1)}${exp.map(x=>R('Pengeluaran: '+esc(x[0]),neg(x[1]),0,1)).join('')}
 ${R('Arus kas operasional bersih',rp(op),1)}${R('Uang masuk lain',rp(to),1)}${oth.map(x=>R(esc(x[0]),rp(x[1]),0,1)).join('')}${tf?R('Transfer antar rekening (neto)',tf<0?neg(-tf):rp(tf),0,1):''}
 ${R('Saldo akhir',rp(start+op+to+tf),1)}</table></div></div>`;
}

function bkNum(s){s=String(s==null?'':s).replace(/rp/ig,'').replace(/\s/g,'');if(!s)return null;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?NaN:n}
function bkCsv(txt){
 txt=txt.replace(/^\uFEFF/,'').replace(/^sep=.?\r?\n/i,'');
 const first=txt.split(/\r?\n/).find(x=>x.trim())||'';
 const c=[[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===c){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows;
}

function bkRead(f){
 if(!f)return;
 const el=$('#bk_prev'),rd=new FileReader(),isX=/\.xlsx?$/i.test(f.name);
 if(isX&&!window.XLSX){el.innerHTML='<div class="mut" style="color:var(--bad)">Pembaca Excel belum termuat (cek internet). Simpan file sebagai CSV lalu unggah lagi.</div>';return}
 const proc=rows=>{
  BK.rows=[];
  if(rows.length<2){el.innerHTML='<div class="mut">File kosong atau formatnya tidak dikenali.</div>';bkPrev();return}
  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));
  const c={id:h.indexOf('id'),sku:ix('kode'),name:ix('nama'),qty:ix('jumlah'),bp:ix('hargabeli'),note:ix('catatan')};
  if(c.qty<0||(c.id<0&&c.sku<0&&c.name<0)){el.innerHTML='<div class="mut" style="color:var(--bad)">Kolom tidak dikenali. Pakai template dari tombol di atas (kolom ID/Kode/Nama dan Jumlah wajib ada).</div>';bkPrev();return}
  const g=(r,k)=>k>=0?String(r[k]==null?'':r[k]).trim():'';
  BK.rows=rows.slice(1).map(r=>({id:g(r,c.id),sku:g(r,c.sku),name:g(r,c.name),qty:bkNum(g(r,c.qty)),bp:c.bp>=0?bkNum(g(r,c.bp)):null,note:g(r,c.note).slice(0,40)}));
  bkPrev();
 };
 rd.onload=e=>{
  try{
   if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
   else proc(bkCsv(String(e.target.result||'')));
  }catch(err){el.innerHTML='<div class="mut" style="color:var(--bad)">File tidak bisa dibaca: '+esc(err.message)+'</div>'}
 };
 isX?rd.readAsArrayBuffer(f):rd.readAsText(f);
}
function bkPrev(){
 const el=$('#bk_prev'),go=$('#bk_go');if(!el)return;
 if(!BK.rows.length){BK.ok=[];if(go)go.disabled=true;return}
 const set=BK.mode==='set',byId={},bySku={},byName={},seen={};
 D.products.forEach(p=>{byId[String(p.id)]=p;if(p.sku)bySku[String(p.sku).toLowerCase()]=p;byName[String(p.name).trim().toLowerCase()]=p});
 const out=[];BK.ok=[];let blank=0,bad=0,same=0;
 BK.rows.forEach(r=>{
  if(r.qty===null){blank++;return}
  const p=byId[r.id]||(r.sku&&bySku[r.sku.toLowerCase()])||(r.name&&byName[r.name.toLowerCase()])||null,s=p?(+p.stock||0):0;
  let st='ok',msg='';
  if(!p){st='bad';msg='Produk tidak ditemukan'}
  else if(p.trackStock===false){st='bad';msg='Produk tanpa hitung stok'}
  else if(seen[p.id]){st='bad';msg='Produk dobel di file'}
  else if(isNaN(r.qty)){st='bad';msg='Jumlah bukan angka'}
  else if(!set&&!(r.qty>0)){st='bad';msg='Jumlah harus lebih dari 0'}
  else if(set&&r.qty<0){st='bad';msg='Stok tidak boleh minus'}
  else if(r.bp!=null&&isNaN(r.bp)){st='bad';msg='Harga beli bukan angka'}
  else if(set&&Math.abs(r.qty-s)<0.0004)st='same';
  if(p)seen[p.id]=1;
  if(st==='bad')bad++;else if(st==='same')same++;
  else BK.ok.push({p,qty:r.qty,bp:r.bp>0?r.bp:0,note:r.note});
  out.push({r,p,s,st,msg});
 });
 el.innerHTML=`<div style="margin-bottom:8px"><span class="badge g">${BK.ok.length} akan diperbarui</span> ${bad?`<span class="badge v">${bad} bermasalah (dilewati)</span> `:''}${same?`<span class="badge">${same} tidak berubah</span> `:''}${blank?`<span class="badge">${blank} baris kosong</span>`:''}</div>
 ${out.length?`<div class="tw" style="max-height:34vh;overflow:auto"><table><tr><th>Produk</th><th class="r">Sekarang</th><th class="r">${set?'Stok sebenarnya':'Tambah'}</th><th class="r">Sesudah</th><th>Status</th></tr>${out.slice(0,300).map(o=>{const nm=o.p?o.p.name:(o.r.name||o.r.sku||o.r.id||'?'),aft=o.st==='ok'?(set?o.r.qty:Math.round((o.s+o.r.qty)*1000)/1000):null;return`<tr><td><b>${esc(nm)}</b></td><td class="r">${o.p?fq(o.s):'—'}</td><td class="r">${isNaN(o.r.qty)?'?':fq(o.r.qty)}</td><td class="r">${aft==null?'—':'<b>'+fq(aft)+'</b>'}</td><td>${o.st==='ok'?'<span class="badge g">OK</span>':o.st==='same'?'<span class="badge">Tidak berubah</span>':'<span class="badge v">'+esc(o.msg)+'</span>'}</td></tr>`}).join('')}</table></div>${out.length>300?'<div class="mut" style="font-size:12.5px;margin-top:6px">Menampilkan 300 baris pertama; semua baris valid tetap diproses.</div>':''}`:''}`;
 if(go)go.disabled=!BK.ok.length;
}

function lpMetodeData(d){
 const tx=lpTx(d),rf=lpRf(d),R={},row=m=>R[m]||(R[m]={n:0,inn:0,ref:0,mdr:0});
 tx.forEach(t=>{
  const pays=t.payments||[],mdrT=(t.fee&&t.fee.mdr||0)*(feeNet(t)/(t.feeTot||1));
  const el=pays.filter(p=>['tunai','kasbon','komplimen'].indexOf(p.m)<0),base=sum(el,p=>p.ap),seen={};
  pays.forEach(p=>{const o=row(p.m);o.inn+=p.ap;if(!seen[p.m]){o.n++;seen[p.m]=1}if(base>0&&el.indexOf(p)>=0)o.mdr+=mdrT*p.ap/base});
 });
 rf.forEach(r=>{row(r.method).ref+=r.amount});
 const l=Object.entries(R).map(([m,o])=>({m,name:METHODS[m]||m,...o,net:o.inn-o.ref,after:o.inn-o.ref-o.mdr}));
 l.sort((a,b)=>b.net-a.net);return l;
}
function lpMetode(d){

 if(!l.length)return`<div class="card">${noData}</div>`;
 const days={},ms=real.map(x=>x.m);
 lpTx(d).forEach(t=>t.payments.forEach(p=>{if(p.m==='komplimen')return;const k=dk(t.ts),o=days[k]||(days[k]={});o[p.m]=(o[p.m]||0)+p.ap}));
 lpRf(d).forEach(r=>{const k=dk(r.ts),o=days[k]||(days[k]={});o[r.method]=(o[r.method]||0)-r.amount});
 const dks=Object.keys(days).sort().reverse().slice(0,31);
 return`<div class="kg"><div class="kc hero"><small>Penerimaan bersih · ${esc(perLabel())}</small><b>${rp(tot)}</b><div style="margin-top:6px;opacity:.9">${real.length} metode dipakai</div></div>
 <div class="kc"><small>Metode terbesar</small><b>${top?esc(top.name):'-'}</b><div class="mut" style="margin-top:4px">${top?lpPct(top.net,tot)+' dari penerimaan':''}</div></div>
 <div class="kc"><small>Biaya MDR (estimasi)</small><b>${rp(mdr)}</b></div></div>
 <div class="card"><h4>Penerimaan per Metode</h4><p>Klik baris untuk melihat daftar nota. MDR dibagi ke metode non-tunai sesuai nilai pembayarannya (estimasi).</p><div class="tw"><table><tr><th>Metode</th><th class="r">Nota</th><th class="r">Masuk</th><th class="r">Refund</th><th class="r">Bersih</th><th>Porsi</th><th class="r">MDR</th><th class="r">Setelah MDR</th></tr>
 ${l.map(x=>`<tr class="cl" data-m="${esc(x.m)}" onclick="lpMetodeDetail(this.dataset.m)"><td><b>${esc(x.name)}</b>${x.m==='komplimen'?'<br><small class="mut">bukan uang masuk</small>':''}</td><td class="r">${x.n}</td><td class="r">${rp(x.inn)}</td><td class="r">${rp(x.ref)}</td><td class="r"><b>${rp(x.net)}</b></td><td>${x.m==='komplimen'?'-':lpBar(tot?x.net/tot*100:0)+'<small class="mut">'+lpPct(x.net,tot)+'</small>'}</td><td class="r">${rp(x.mdr)}</td><td class="r">${rp(x.after)}</td></tr>`).join('')}
 <tr class="ft"><td>Total</td><td class="r">${lpTx(d).length}</td><td class="r">${rp(sum(real,x=>x.inn))}</td><td class="r">${rp(sum(real,x=>x.ref))}</td><td class="r">${rp(tot)}</td><td></td><td class="r">${rp(mdr)}</td><td class="r">${rp(sum(real,x=>x.after))}</td></tr></table></div></div>
 <div class="card"><h4>Penerimaan per Hari</h4><p>Setelah refund, 31 hari terakhir pada periode ini</p><div class="tw"><table><tr><th>Tanggal</th>${ms.map(m=>`<th class="r">${esc(METHODS[m]||m)}</th>`).join('')}<th class="r">Total</th></tr>
 ${dks.map(k=>`<tr><td>${esc(k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4))}</td>${ms.map(m=>`<td class="r">${days[k][m]?rp(days[k][m]):'-'}</td>`).join('')}<td class="r"><b>${rp(sum(ms,m=>days[k][m]||0))}</b></td></tr>`).join('')}</table></div></div>`;

const ymNow=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const ymRange=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return[new Date(a[0],a[1]-1,1).getTime(),new Date(a[0],a[1],1).getTime()]};
const ymLabel=ym=>{const a=String(ym||ymNow()).split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const CM={m:ymNow()},GJ={m:ymNow()};
const EMP=()=>D.employees||[];
const monthlyOf=e=>(e.payType==='harian'?(+e.salary||0)*26:(+e.salary||0))+(+e.allowance||0);
const nm_=s=>String(s==null?'':s).trim().toLowerCase();
/*ENGINE-START*/
function commCfg(){
 const d={active:false,mode:'tier',tierType:'marginal',basis:'personal',flat:2,tiers:[{from:0,rate:1},{from:10000000,rate:2},{from:25000000,rate:3}],fallback:true},c=D.commission||{};
 return Object.assign(d,c,{tiers:(c.tiers&&c.tiers.length)?c.tiers:d.tiers});
}
function marg(x,tiers){
 const t=[...tiers].sort((a,b)=>a.from-b.from);let s=0;
 t.forEach((r,i)=>{const hi=i+1<t.length?+t[i+1].from:Infinity,part=Math.max(0,Math.min(x,hi)-(+r.from||0));s+=part*(+r.rate||0)/100});
 return s;
}
function commOf(sales,team,cfg){
 if(!cfg.active||!(sales>0))return 0;
 if(cfg.mode==='flat')return sales*(+cfg.flat||0)/100;
 const t=[...cfg.tiers].sort((a,b)=>a.from-b.from),ref=cfg.basis==='team'?team:sales;
 if(cfg.tierType==='cliff'){let r=0;t.forEach(x=>{if(ref>=(+x.from||0))r=+x.rate||0});return sales*r/100}
 const tot=marg(ref,t);
 return cfg.basis==='team'?(ref>0?sales*tot/ref:0):tot;
}
function commAgg(ym){
 const rg=ymRange(ym),a=rg[0],b=rg[1],cfg=commCfg(),E=D.employees||[],byName={};
 E.forEach(e=>byName[nm_(e.name)]=e);
 const rows={};let un=0,tot=0;
 D.tx.filter(t=>t.ts>=a&&t.ts<b).forEach(t=>{
  const eff=(t.net||0)*(1-cRatio(t))*(1-Math.min(1,(t.refunded||0)/(t.total||1)));
  if(!(eff>0))return;tot+=eff;
  let sv=(t.servers||[]).filter(x=>x&&(x.id||x.name));
  if(!sv.length&&cfg.fallback){const e=byName[nm_(t.cashier)];if(e)sv=[{id:e.id,name:e.name}]}
  if(!sv.length){un+=eff;return}
  const sh=eff/sv.length;
  sv.forEach(x=>{
   const e=E.find(z=>z.id===x.id)||byName[nm_(x.name)],key=e?e.id:'n:'+x.name;
   const o=rows[key]||(rows[key]={key,id:e?e.id:'',name:e?e.name:x.name,e,n:0,sales:0,tx:[]});
   o.n++;o.sales+=sh;o.tx.push({t,share:sh,k:sv.length});
  });
 });
 E.filter(e=>e.active!==false).forEach(e=>{if(!rows[e.id])rows[e.id]={key:e.id,id:e.id,name:e.name,e,n:0,sales:0,tx:[]}});
 const L=Object.values(rows);
 L.forEach(o=>o.elig=!!(o.e&&o.e.comm!==false));
 const team=sum(L.filter(o=>o.elig),o=>o.sales);
 L.forEach(o=>{o.c=o.elig?Math.round(commOf(o.sales,team,cfg)):0;o.rate=o.sales>0?o.c/o.sales*100:0});
 return{cfg,rows,team,tot,un};
}
function daysPresent(e,ym){
 const rg=ymRange(ym),n=nm_(e.name),s=new Set();
 D.shifts.forEach(x=>{if(x.openTs>=rg[0]&&x.openTs<rg[1]&&nm_(x.name)===n)s.add(dk(x.openTs))});
 return s.size;
}
function payRec(e,ym){return(D.payroll||[]).find(p=>p.empId===e.id&&p.period===ym)}
function payCalc(e,ym,ca,ov){
 const r=Object.assign({},payRec(e,ym)||{},ov||{});
 if(r.status==='paid'&&!ov)return{days:r.days,base:+r.base||0,allow:+r.allow||0,comm:+r.comm||0,bonus:+r.bonus||0,ded:+r.deduct||0,total:+r.total||0,rec:r,paid:true};
 const harian=e.payType==='harian',days=(r.days!==undefined&&r.days!==''&&r.days!==null)?+r.days:daysPresent(e,ym);
 const base=harian?Math.round((+e.salary||0)*days):(+e.salary||0),allow=+e.allowance||0,row=ca.rows[e.id],comm=row?row.c:0,bonus=+r.bonus||0,ded=+r.deduct||0;
 return{days:harian?days:'',base,allow,comm,bonus,ded,total:base+allow+comm+bonus-ded,rec:r,paid:false};
}

function nextTier(ref,c){
 if(!c.active||c.mode!=='tier')return'';
 const t=[...c.tiers].sort((a,b)=>a.from-b.from).find(x=>+x.from>ref);
 return t?'Kurang '+rp(t.from-ref)+' ke tingkat '+fq(t.rate)+'%':'Tingkat tertinggi tercapai';
}

 const L=[ctr('SLIP GAJI'),ctr((D.outlet&&D.outlet.name)||'TWINS POS'),ln,two('Periode',ymLabel(ym)),two('Nama',e.name)];

 L.push(ln,two(e.payType==='harian'?'Gaji ('+c.days+' hr x '+Math.round(e.salary||0).toLocaleString('id-ID')+')':'Gaji pokok',rp(c.base)),two('Tunjangan',rp(c.allow)),two('Komisi',rp(c.comm)));

const SUP=()=>D.suppliers||[],PUR=()=>D.purchases||[];
const purPaid=f=>sum(f.payments||[],p=>+p.amount||0);
const purRet=f=>sum(f.returns||[],r=>+r.amount||0),purRefund=f=>sum(f.returns||[],r=>+r.refund||0);
const purNet=f=>Math.max(0,(+f.total||0)-purRet(f));
const purRaw=f=>(+f.total||0)-purRet(f)-purPaid(f)+purRefund(f);

 if(mode==='sebagian'&&!(amt>0)){alert('Isi jumlah yang dibayar');return}

 const rec={id:'fb'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),no,ts:dts(v('p_date')),supplierId:sp.id,supplierName:sp.name,items,sub:C.sub,disc:C.disc,ship:C.ship,taxPct:C.pct,tax:C.tax,total,payments:amt>0?[mode==='dp'?{ts:Date.now(),amount:amt,acc:'',method:'Uang muka',dp:true}:{ts:Date.now(),amount:amt,acc:v('p_acc'),method:v('p_acc')?accName(v('p_acc')):'Tidak dicatat'}]:[],due:v('p_due')?dts(v('p_due')):0,note:v('p_note').trim(),stock:ck('p_stk'),by:cfg.nm||''};
 btn.disabled=true;btn.textContent='Menyimpan…';let stokOk=false;
 try{
  if(rec.stock){await pushPost('stock_bulk',{mode:'add',hppMode:'avg',note:'[FB] '+no,items:items.map(x=>({id:x.pid,qty:x.qty,buyPrice:C.sub>0?Math.round(x.price+(C.ship-C.disc)*(x.price/C.sub)):x.price,note:('[FB] '+no+' · '+sp.name).slice(0,100)}))});stokOk=true}

function lrData(d){
 const get=t=>d.l.filter(m=>m.type===t).map(m=>({m,v:jSaldo(d.sP,m.id)})).filter(r=>r.v);
 const R=get('R'),X=get('X'),jual=jSaldo(d.sP,'jual'),ret=jSaldo(d.sP,'retur'),hpp=jSaldo(d.sP,'hpp'),lain=jSaldo(d.sP,'lain');
 const beban=X.filter(r=>r.m.id!=='hpp'),tb=sum(beban,r=>r.v),gp=jual+ret-hpp;
 return{jual,ret,hpp,lain,beban,tb,gp,net:gp+lain-tb,rev:R,X};
}
function lapLR(d){
 const L=lrData(d),ag=agg(d.a,d.b),df=Math.round(L.gp-ag.profit),row=(n,v,b)=>`<tr${b?' class="ft"':''}><td>${n}</td><td class="r">${rp(v)}</td></tr>`;
 return`<p class="mut">Laba rugi · ${esc(perLabel())}</p><div class="tw"><table>${row('Penjualan',L.jual)}${row('Retur penjualan',L.ret)}${row('Harga pokok penjualan',-L.hpp)}${row('Laba kotor',L.gp,1)}${row('Pendapatan lain',L.lain)}${L.beban.map(r=>row(esc(r.m.name),-r.v)).join('')}${row('Total beban',-L.tb)}${row('Laba bersih',L.net,1)}</table></div>
 ${Math.abs(df)>1?`<div class="hint">Laba kotor menurut jurnal berbeda ${rp(df)} dari Ringkasan. Biasanya karena pajak/service yang dihitung terpisah atau pembulatan transaksi.</div>`:'<div class="hint">Laba kotor sama dengan angka di Ringkasan.</div>'}`;
}
function nrData(d){
 const A=[],Lb=[],Eq=[];
 d.l.forEach(m=>{const v=jSaldo(d.sA,m.id);if(!v&&m.type!=='A')return;if(m.type==='A'&&v)A.push({n:m.name,v});else if(m.type==='L'&&v)Lb.push({n:m.name,v});else if(m.type==='E'&&v)Eq.push({n:m.name,v})});
 const laba=sum(d.l.filter(m=>m.type==='R'),m=>jSaldo(d.sA,m.id))-sum(d.l.filter(m=>m.type==='X'),m=>jSaldo(d.sA,m.id));
 Eq.push({n:'Laba berjalan (sejak pembukuan)',v:laba});
 let adj=0;if(d.live){const fis=Math.round(sum((D.products||[]).filter(p=>p.trackStock!==false),p=>(+p.stock||0)*(+p.cogs||0))),led=jSaldo(d.sA,'persediaan');adj=fis-led;if(adj){A.push({n:'Penyesuaian persediaan ke stok fisik',v:adj});Eq.push({n:'Selisih persediaan (penyesuaian)',v:adj})}}
 return{A,Lb,Eq,ta:sum(A,x=>x.v),tl:sum(Lb,x=>x.v),te:sum(Eq,x=>x.v),adj};
}
function lapNR(d){

 <div class="hint">${Math.abs(N.ta-N.tl-N.te)<=1?'Seimbang: aset sama dengan kewajiban ditambah ekuitas.':'Tidak seimbang. Selisih '+rp(N.ta-N.tl-N.te)+'.'}${N.adj?` Persediaan dicocokkan ke nilai stok fisik (stok × harga modal) hari ini; selisihnya ${rp(N.adj)} dicatat sebagai penyesuaian di ekuitas.`:''}</div>`;
}

const SIN=()=>D.sinvoices||[];
const sinPaid=f=>sum(f.payments||[],p=>+p.amount||0);
const sinRet=f=>sum(f.returns||[],r=>+r.amount||0),sinRefund=f=>sum(f.returns||[],r=>+r.refund||0);
const sinRaw=f=>(+f.total||0)-sinRet(f)-sinPaid(f)+sinRefund(f);
const sinLeft=f=>Math.max(0,Math.round(sinRaw(f)));
const sinSt=f=>sinLeft(f)<=0?'lunas':sinPaid(f)>0?'sebagian':'hutang';
const SPST={lunas:['Lunas','g'],sebagian:['Sebagian','k'],hutang:['Belum dibayar','v']};
const FJ={st:''};
const custKey=t=>t.customerId||(t.customer&&t.customer.id)||('n:'+(t.custName||(t.customer&&t.customer.name)||'Pelanggan umum'));
const custNm=t=>t.custName||(t.customer&&t.customer.name)||'Pelanggan umum';
function sinTx(f){
 const rt={};(f.returns||[]).forEach(r=>(r.items||[]).forEach(i=>rt[i.pid]=(rt[i.pid]||0)+(+i.qty||0)));
 const items=[];(f.items||[]).forEach(i=>{let q=+i.qty||0;const take=Math.min(q,rt[i.pid]||0);if(take){rt[i.pid]-=take;q-=take}if(q>0)items.push({name:i.name,unit:i.unit||'',qty:q,price:+i.price||0,cogs:+i.cogs||0,cat:i.cat||'Umum'})});
 const rv=sinRet(f),rtax=sum(f.returns||[],r=>+r.tax||0),sub=items.length?sum(items,i=>i.qty*i.price):0,tax=Math.max(0,(+f.tax||0)-rtax),tot=Math.max(0,(+f.total||0)-rv);
 return{id:'fj'+f.id,inv:true,no:f.no,ts:f.ts,cashier:'Faktur',type:'faktur',channel:'',customerId:f.customerId,custName:f.customerName,items,subtotal:sub,manualDisc:+f.disc||0,rounding:+f.ship||0,tax,taxIncl:false,service:0,total:tot,net:tot-tax,payments:[{m:'faktur',ap:tot}],status:'paid'};
}
function sinNo(){
 const n=new Date(),pre='FJ-'+n.getFullYear()+p2(n.getMonth()+1)+'-';let mx=0;
 SIN().forEach(f=>{if(String(f.no).indexOf(pre)===0)mx=Math.max(mx,parseInt(String(f.no).slice(pre.length),10)||0)});
 return pre+String(mx+1).padStart(3,'0');
}

 const items=sinItems();if(!items.length){alert('Isi minimal satu barang (pilih produk dan jumlah)');return}

 if(SIN().some(f=>f.no===no)){alert('Nomor faktur sudah dipakai');return}
 const mode=v('j_pay'),acc=v('j_acc');let amt=mode==='lunas'?total:mode==='sebagian'?Math.min(total,Math.max(0,+v('j_amt')||0)):0;
 if(mode==='sebagian'&&!(amt>0)){alert('Isi jumlah yang diterima');return}

 const kurang=ck('j_stk')?items.filter(x=>x.trackStock&&(+(D.products.find(p=>p.id===x.pid)||{}).stock||0)<x.qty):[];
 if(kurang.length&&!confirm('Stok tidak cukup untuk: '+kurang.map(x=>x.name).join(', ')+'. Lanjutkan? Stok akan menjadi minus.'))return;
 const rec={id:'fj'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),no,ts:dts(v('j_date')),customerId:cu.id,customerName:cu.name,items:items.map(x=>({pid:x.pid,name:x.name,unit:x.unit,cat:x.cat,cogs:x.cogs,qty:x.qty,price:x.price})),sub:C.sub,disc:C.disc,ship:C.ship,taxPct:C.pct,tax:C.tax,total,payments:amt>0?[{ts:Date.now(),amount:amt,acc,method:accName(acc)}]:[],due:v('j_due')?dts(v('j_due')):0,note:v('j_note').trim(),stock:ck('j_stk'),by:cfg.nm||''};
 btn.disabled=true;btn.textContent='Menyimpan…';let stokOk=false;
 try{

  await pushPost('sinvoice',rec);

 Object.values(by).forEach(o=>{o.tx.sort((x,y)=>x.ts-y.ts);let p=o.paid;o.open=[];o.tx.forEach(x=>{const u=Math.min(p,x.a);p-=u;if(x.a-u>0)o.open.push({ts:x.ts,a:x.a-u})});o.total=sum(o.tx,x=>x.a);o.left=sum(o.open,x=>x.a)});

function purEdit(id){const f=PUR().find(x=>x.id===id);if(!f)return;closeDlg();purForm(f.supplierId,f)}
function sinEdit(id){const f=SIN().find(x=>x.id===id);if(!f)return;closeDlg();sinForm(f.customerId,f)}
const trk=pid=>{const p=D.products.find(x=>x.id===pid);return!!p&&p.trackStock!==false};
function qtyByPid(items){const m={};(items||[]).forEach(i=>{m[i.pid]=(m[i.pid]||0)+(+i.qty||0)});return m}
function retQty(f){const m={};(f.returns||[]).forEach(r=>(r.items||[]).forEach(i=>{m[i.pid]=(m[i.pid]||0)+(+i.qty||0)}));return m}
function stockDelta(oldItems,newItems){const o=qtyByPid(oldItems),n=qtyByPid(newItems),d={};Object.keys(Object.assign({},o,n)).forEach(k=>{const x=Math.round(((n[k]||0)-(o[k]||0))*1000)/1000;if(x&&trk(k))d[k]=x});return d}
function editChecks(f,items,total,partner){
 const rq=retQty(f),nq=qtyByPid(items);
 for(const k of Object.keys(rq)){if((nq[k]||0)<rq[k]-1e-9){const it=(f.items||[]).find(i=>i.pid===k);alert('Barang "'+(it?it.name:k)+'" sudah diretur '+fq(rq[k])+', jadi jumlahnya tidak boleh kurang dari itu.');return false}}
 const paid=sum(f.payments||[],p=>+p.amount||0),rt=sum(f.returns||[],r=>+r.amount||0),rf=sum(f.returns||[],r=>+r.refund||0);
 if(total-rt-(paid-rf)<0){alert('Total baru ('+rp(total)+') lebih kecil dari yang sudah '+partner+' ('+rp(paid-rf)+' + retur '+rp(rt)+'). Koreksi pembayaran/retur dulu, atau naikkan totalnya.');return false}
 return true;
}

/* ---------- Retur ---------- */
let RET=null;
function retCalc(f,lines){
 const sub=f.sub!=null?+f.sub:sum(f.items||[],i=>i.qty*i.price),k=sub>0?1-(+f.disc||0)/sub:1,pct=+f.taxPct||0,g=sum(lines,l=>l.qty*l.price)*k;
 return{amount:Math.round(g*(1+pct/100)),tax:Math.round(g*pct/100)};
}
function retRemain(f,pid){const done=retQty(f)[pid]||0,tot=qtyByPid(f.items)[pid]||0;return Math.round((tot-done)*1000)/1000}
function retBlock(kind,f){
 const r=f.returns||[],raw=kind==='b'?purRaw(f):sinRaw(f);
 if(!r.length)return'';
 return`<b style="display:block;margin-top:12px">Retur</b><div class="tw"><table><tr><th>Tanggal</th><th>Barang</th><th class="r">Nilai</th><th class="r">Uang kembali</th><th></th></tr>${r.map(x=>`<tr><td>${dk(x.ts)}</td><td>${(x.items||[]).map(i=>esc(i.name)+' ×'+fq(i.qty)).join(', ')}${x.note?'<br><small class="mut">'+esc(x.note)+'</small>':''}</td><td class="r">${rp(x.amount)}</td><td class="r">${x.refund?rp(x.refund):'-'}</td><td><button class="btn sm del" onclick="retUndo('${kind}','${f.id}','${x.id}')">Batalkan</button></td></tr>`).join('')}</table></div>${raw<0?`<div class="hint" style="margin-top:6px">Kelebihan bayar ${rp(-raw)} belum dikembalikan (${kind==='b'?'kredit di pemasok':'kredit pelanggan'}).</div>`:''}`;
}
function retForm(kind,id){
 const B=kind==='b',f=(B?PUR():SIN()).find(x=>x.id===id);if(!f)return;
 const rows=(f.items||[]).map((i,k)=>({i,k,max:retRemain(f,i.pid)})).filter(r=>r.max>0);
 if(!rows.length){alert('Semua barang di faktur ini sudah diretur.');return}
 if(B?!activeBanks().length:!activeBanks().length){/* boleh tanpa rekening, uang kembali nanti tidak dicatat */}
 RET={kind,id,touched:false};
 dlg(`<h3>Retur ${B?'Pembelian':'Penjualan'} · ${esc(f.no)}</h3><div class="mut" style="margin-bottom:8px">${esc((B?f.supplierName:f.customerName)||'')}. Isi jumlah barang yang dikembalikan.</div>
 <div class="tw"><table><tr><th>Barang</th><th class="r">Bisa diretur</th><th class="r">Harga</th><th class="r">Jumlah retur</th></tr>${rows.map(r=>`<tr><td>${esc(r.i.name)}</td><td class="r">${fq(r.max)} ${esc(r.i.unit||'')}</td><td class="r">${rp(r.i.price)}</td><td class="r"><input class="rq" data-k="${r.k}" data-max="${r.max}" type="number" inputmode="decimal" step="any" min="0" style="width:84px" oninput="retTot()"></td></tr>`).join('')}</table></div>
 <div class="g2" style="margin-top:8px">${fld('r_date','Tanggal retur',dk(Date.now()),'date')}${fld('r_note','Alasan / catatan','')}</div>
 <div style="text-align:right;margin:10px 0 2px"><span class="mut">Nilai retur</span> <b id="r_tot" style="font-size:20px">${rp(0)}</b></div>
 <div class="g2">${fld('r_ref',B?'Uang kembali dari pemasok (Rp)':'Uang dikembalikan ke pelanggan (Rp)','','number','0','oninput="RET.touched=true"')}<div><label>${B?'Masuk ke rekening':'Dikeluarkan dari rekening'}</label>${accSel('r_acc')}</div></div>
 <div class="hint" id="r_h"></div>
 ${chk('r_stk',B?'Kurangi stok (barang dikembalikan ke pemasok)':'Tambah stok (barang kembali ke toko)',f.stock!==false)}
 <div class="acts2"><button class="btn pri" onclick="retSave(this)">Simpan Retur</button><button class="btn" onclick="${B?'purView':'sinView'}('${id}')">Batal</button></div>`,true);
}
function retLines(){
 if(!RET)return[];const B=RET.kind==='b',f=(B?PUR():SIN()).find(x=>x.id===RET.id);if(!f)return[];
 return[...document.querySelectorAll('.rq')].map(e=>{const it=(f.items||[])[+e.dataset.k],mx=+e.dataset.max,q=Math.min(mx,Math.max(0,+e.value||0));return q>0?{pid:it.pid,name:it.name,unit:it.unit||'',qty:q,price:+it.price||0,cogs:+it.cogs||0}:null}).filter(Boolean);
}
function retTot(){
 const B=RET.kind==='b',f=(B?PUR():SIN()).find(x=>x.id===RET.id);if(!f)return;
 const L=retLines(),C=retCalc(f,L),raw=B?purRaw(f):sinRaw(f),ex=Math.max(0,C.amount-raw);
 $('#r_tot').textContent=rp(C.amount);
 if(!RET.touched)$('#r_ref').value=ex>0?ex:'';
 const red=Math.min(C.amount,Math.max(0,raw));
 $('#r_h').textContent=C.amount>0?(red>0?(B?'Hutang ke pemasok berkurang ':'Piutang pelanggan berkurang ')+rp(red)+'. ':'')+(ex>0?'Sisa '+rp(ex)+' adalah uang yang sudah dibayar, '+(B?'isi kolom uang kembali bila pemasok mengembalikan uangnya.':'isi kolom uang dikembalikan bila Anda mengembalikan uang ke pelanggan.'):''):'';
}
async function retSave(btn){
 if(!RET)return;const B=RET.kind==='b',f=(B?PUR():SIN()).find(x=>x.id===RET.id);if(!f)return;
 const L=retLines();if(!L.length){alert('Isi jumlah barang yang diretur');return}
 const C=retCalc(f,L),raw=B?purRaw(f):sinRaw(f),R=Math.max(0,Math.round(+v('r_ref')||0)),acc=v('r_acc'),mx=Math.max(0,C.amount-raw);
 if(R>mx){alert('Uang kembali maksimal '+rp(mx)+' (bagian yang sudah dibayar).');return}
 const ret={id:'rt'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),ts:dts(v('r_date')),items:L,amount:C.amount,tax:C.tax,refund:R,acc:R>0?acc:'',stock:ck('r_stk'),note:v('r_note').trim(),by:cfg.nm||''};
 const st=L.filter(x=>trk(x.pid));btn.disabled=true;btn.textContent='Menyimpan…';let stokOk=false;
 try{
  if(ret.stock&&st.length){await pushPost('stock_bulk',{mode:B?'out':'add',hppMode:'none',note:(B?'[RB] ':'[RJ] ')+f.no,items:st.map(x=>({id:x.pid,qty:x.qty,note:((B?'[RB] ':'[RJ] ')+f.no).slice(0,100)}))});stokOk=true}
  await pushPost(B?'purchase':'sinvoice',Object.assign({},f,{returns:[...(f.returns||[]),ret]}));
  if(R>0&&acc){try{await pushQuiet('cf',{id:'cf'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:ret.ts,type:B?'in':'out',acc,to:'',cat:B?'Retur pembelian':'Retur penjualan',amount:R,note:'Retur '+f.no+' · '+((B?f.supplierName:f.customerName)||''),nonop:true,by:cfg.nm||'',ref:(B?'rb:':'rj:')+f.id+':'+ret.id});scheduleLoad()}catch(e){alert('Retur tersimpan, tetapi catatan arus kas gagal: '+e.message+'\nCatat manual di Arus Kas & Rekening.')}}
  closeDlg();render();
 }catch(e){btn.disabled=false;btn.textContent='Simpan Retur';alert(stokOk?'Stok sudah disesuaikan, tetapi retur belum tersimpan: '+e.message+'\n\nCek stok produk dan koreksi manual sebelum mengulang.':'Gagal menyimpan: '+e.message)}
}
function retUndo(kind,id,rid){
 const B=kind==='b',f=(B?PUR():SIN()).find(x=>x.id===id);if(!f)return;const r=(f.returns||[]).find(x=>x.id===rid);if(!r)return;
 const cfs=CFS().filter(x=>x.ref===(B?'rb:':'rj:')+id+':'+rid);
 if(!confirm('Batalkan retur ini?'+(r.stock?' Stok dikembalikan seperti sebelum retur.':'')+(cfs.length?' Catatan uang kembali di Arus Kas ikut dihapus.':'')))return;
 safe(async()=>{
  const st=(r.items||[]).filter(x=>trk(x.pid));
  if(r.stock&&st.length)await pushPost('stock_bulk',{mode:B?'add':'out',hppMode:'none',note:(B?'[RB-BATAL] ':'[RJ-BATAL] ')+f.no,items:st.map(x=>({id:x.pid,qty:x.qty,note:((B?'[RB-BATAL] ':'[RJ-BATAL] ')+f.no).slice(0,100)}))});
  await pushPost(B?'purchase':'sinvoice',Object.assign({},f,{returns:(f.returns||[]).filter(x=>x.id!==rid)}));
  for(const c of cfs)await pushQuiet('cf_del',{id:c.id});
 });
}

/* ---------- Uang muka pemasok ---------- */
function dpForm(sid){
 const sp=SUP().find(x=>x.id===sid);if(!sp)return;const l=[...(sp.dps||[])].sort((a,b)=>b.ts-a.ts),bal=supDp(sid);
 dlg(`<h3>Uang Muka · ${esc(sp.name)}</h3><div class="mut" style="margin-bottom:8px">Uang yang sudah dibayar lebih dulu ke pemasok. Nanti dipotong saat membayar faktur. Saldo saat ini <b>${rp(bal)}</b>.</div>
 <div class="g2">${fld('dp_amt','Jumlah uang muka (Rp)','','number')}<div><label>Dibayar dari rekening</label>${accSel('dp_acc')}</div>${fld('dp_date','Tanggal',dk(Date.now()),'date')}${fld('dp_note','Catatan','')}</div>
 <div class="acts2"><button class="btn pri" onclick="dpSave('${sid}',this)">Simpan Uang Muka</button><button class="btn" onclick="supDetail('${sid}')">Kembali</button></div>
 <b style="display:block;margin-top:12px">Riwayat uang muka</b><div class="tw">${l.length?`<table><tr><th>Tanggal</th><th>Catatan</th><th class="r">Jumlah</th><th></th></tr>${l.map(d=>`<tr><td>${dk(d.ts)}</td><td>${esc(d.note||'')}${d.acc?'<br><small class="mut">'+esc(accName(d.acc))+'</small>':''}</td><td class="r">${rp(d.amount)}</td><td><button class="btn sm del" onclick="dpDel('${sid}','${d.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<div class="mut" style="padding:8px">Belum ada uang muka.</div>'}</div>`,true);
}
function dpSave(sid,btn){
 const sp=SUP().find(x=>x.id===sid);if(!sp)return;const a=Math.round(+v('dp_amt')||0),acc=v('dp_acc');
 if(!(a>0)){alert('Isi jumlah uang muka');return}
 const d={id:'dp'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),ts:dts(v('dp_date')),amount:a,acc,note:v('dp_note').trim(),by:cfg.nm||''};
 safe(async()=>{
  await pushPost('supplier',Object.assign({},sp,{dps:[...(sp.dps||[]),d]}));
  if(acc){try{await pushQuiet('cf',{id:'cf'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:d.ts,type:'out',acc,to:'',cat:'Uang muka pemasok',amount:a,note:'Uang muka · '+sp.name+(d.note?' · '+d.note:''),nonop:true,by:cfg.nm||'',ref:'dp:'+sid+':'+d.id});scheduleLoad()}catch(e){alert('Uang muka tersimpan, tetapi catatan arus kas gagal: '+e.message+'\nCatat manual di Arus Kas & Rekening.')}}
 },btn);
}
function dpDel(sid,did){
 const sp=SUP().find(x=>x.id===sid);if(!sp)return;const d=(sp.dps||[]).find(x=>x.id===did);if(!d)return;
 if(supDp(sid)-d.amount<0){alert('Uang muka ini sebagian sudah dipotong ke faktur, jadi tidak bisa dihapus. Hapus/koreksi pembayaran fakturnya dulu.');return}
 const cfs=CFS().filter(x=>x.ref==='dp:'+sid+':'+did);
 if(!confirm('Hapus uang muka '+rp(d.amount)+'?'+(cfs.length?' Catatan di Arus Kas ikut dihapus.':'')))return;
 safe(async()=>{await pushPost('supplier',Object.assign({},sp,{dps:(sp.dps||[]).filter(x=>x.id!==did)}));for(const c of cfs)await pushQuiet('cf_del',{id:c.id})});
}

/* ---------- Bahan baku, resep, produksi ---------- */
const pmKind=p=>PM.k==='bahan'?!!p.bahan:!p.bahan;
const bahanList=ex=>D.products.filter(b=>b.bahan&&b.id!==ex).sort((x,y)=>String(x.name).localeCompare(String(y.name)));
function recRow(r,ex){
 const bl=bahanList(ex);
 return`<div class="prow rrow" style="display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:6px;align-items:center"><select class="rb" onchange="recCost()"><option value="">— pilih bahan —</option>${bl.map(b=>`<option value="${esc(b.id)}" ${r&&r.id===b.id?'selected':''}>${esc(b.name)} (${esc(b.unit||'')})</option>`).join('')}</select><input class="rq" type="number" inputmode="decimal" step="any" min="0" placeholder="Jumlah" value="${r?r.q:''}" oninput="recCost()"><button class="btn sm del" onclick="this.parentNode.remove();recCost()">✕</button></div>`;
}
function recAdd(ex){if(!bahanList(ex).length){alert('Belum ada bahan baku. Tambah produk, lalu centang “Bahan baku”, atau pakai filter Bahan baku untuk melihatnya.');return}$('#f_rec').insertAdjacentHTML('beforeend',recRow(null,ex));recCost()}
function recRows(){return[...document.querySelectorAll('#f_rec .rrow')].map(r=>({id:r.querySelector('.rb').value,q:+r.querySelector('.rq').value||0})).filter(x=>x.id&&x.q>0)}
function recCostVal(rows){return Math.round(sum(rows||recRows(),r=>{const b=D.products.find(x=>x.id===r.id);return(+r.q||0)*(b?+b.cogs||0:0)}))}
function recCost(){const h=$('#f_rech');if(!h)return;const rows=recRows();h.textContent=rows.length?'Biaya bahan per satuan: '+rp(recCostVal(rows))+(ck('f_rauto')?'. HPP produk akan diisi dengan angka ini.':'.'):'';}
function recUi(){const w=$('#f_recw');if(w)w.style.display=ck('f_bhn')?'none':'';if(ck('f_bhn')){const t=$('#f_trk');if(t)t.checked=true}}
function prodnForm(pre){
 const ps=D.products.filter(p=>!p.bahan&&(p.recipe||[]).length&&p.active!==false);
 if(!ps.length){alert('Belum ada produk yang punya resep. Buat resep dulu lewat Ubah produk.');return}
 dlg(`<h3>Catat Produksi</h3><div class="mut" style="margin-bottom:8px">Bahan baku dipotong sesuai resep, lalu stok produk jadi bertambah (kalau produknya menghitung stok).</div>
 <label>Produk yang dibuat</label><select id="pr_p" onchange="prodnHint()">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===pre?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 ${fld('pr_q','Jumlah hasil produksi','','number','','oninput="prodnHint()"')}${fld('pr_note','Catatan (opsional)','')}
 <div class="hint" id="pr_h"></div>
 <div class="acts2"><button class="btn pri" onclick="prodnSave(this)">Simpan Produksi</button><button class="btn" onclick="closeDlg()">Batal</button></div>`);
 prodnHint();
}
function prodnNeed(){const p=D.products.find(x=>x.id===v('pr_p')),q=+v('pr_q')||0;if(!p)return null;return{p,q,rows:(p.recipe||[]).map(r=>{const b=D.products.find(x=>x.id===r.id);return{b,id:r.id,need:Math.round(r.q*q*1000)/1000}}).filter(x=>x.b)}}
function prodnHint(){const n=prodnNeed(),h=$('#pr_h');if(!n||!h)return;h.innerHTML=n.q>0?n.rows.map(x=>`${esc(x.b.name)}: pakai <b>${fq(x.need)} ${esc(x.b.unit||'')}</b> (stok ${fq(+x.b.stock||0)})`+((+x.b.stock||0)<x.need?' <span class="badge v">kurang</span>':'')).join('<br>'):'Isi jumlah hasil produksi.'}
async function prodnSave(btn){
 const n=prodnNeed();if(!n||!(n.q>0)){alert('Isi jumlah hasil produksi');return}
 const kurang=n.rows.filter(x=>(+x.b.stock||0)<x.need);
 if(kurang.length&&!confirm('Stok kurang untuk: '+kurang.map(x=>x.b.name).join(', ')+'. Lanjutkan? Stok bahan akan menjadi minus.'))return;
 const note='[PRODUKSI] '+n.p.name+(v('pr_note').trim()?' · '+v('pr_note').trim():'');let outOk=false;
 btn.disabled=true;btn.textContent='Menyimpan…';
 try{
  await pushPost('stock_bulk',{mode:'out',note,items:n.rows.map(x=>({id:x.id,qty:x.need,note:note.slice(0,100)}))});outOk=true;
  if(n.p.trackStock!==false)await pushPost('stock_bulk',{mode:'add',hppMode:'avg',note,items:[{id:n.p.id,qty:n.q,buyPrice:recCostVal(n.p.recipe),note:note.slice(0,100)}]});
  closeDlg();render();
 }catch(e){btn.disabled=false;btn.textContent='Simpan Produksi';alert(outOk?'Bahan sudah dipotong, tetapi stok produk jadi belum bertambah: '+e.message+'\n\nTambahkan stok produk jadi manual lewat + Stok, jangan ulang produksinya.':'Gagal menyimpan: '+e.message)}
}

/* ---------- Impor bahan baku (template Excel) ---------- */
const BH={rows:[]};
function bhTpl(){
 bkSave('Template-Bahan-Baku',[['Nama','Satuan','Stok Awal','Harga Beli per Satuan (HPP)','Batas Stok Menipis','Kategori'],['Tepung terigu','gram',5000,12,1000,'Bahan'],['Gula pasir','gram',2000,15,500,'Bahan'],['Telur','butir',60,2200,12,'Bahan']]);
}
function bhOpen(){
 BH.rows=[];
 dlg(`<h3>Impor Bahan Baku</h3>
 <div class="mut" style="font-size:13.5px;line-height:1.5">1. Unduh template. 2. Hapus 3 baris contoh, isi bahan Anda (satu bahan per baris). 3. Simpan (tetap .xlsx atau CSV), lalu unggah di bawah.<br>Semua bahan otomatis ditandai <b>Bahan baku</b> dan tidak tampil di kasir. Nama yang sudah ada dilewati.</div>
 <div class="acts2" style="margin-top:10px"><button class="btn" onclick="bhTpl()">${ic('dl',16)} Unduh template bahan baku</button></div>
 <label>Unggah file Excel / CSV</label><input type="file" id="bh_file" accept=".xlsx,.xls,.csv,.txt" onchange="bhRead(this.files[0])">
 <div id="bh_prev" style="margin-top:12px"></div>
 <div class="acts2"><button class="btn" onclick="closeDlg()">Batal</button><button class="btn pri" id="bh_go" disabled onclick="bhApply(this)">Buat Bahan Baku</button></div>`,true);
}
function bhRead(f){
 if(!f)return;const el=$('#bh_prev'),rd=new FileReader(),isX=/\.xlsx?$/i.test(f.name);
 if(isX&&!window.XLSX){el.innerHTML='<div class="mut" style="color:var(--bad)">Pembaca Excel belum termuat (cek internet). Simpan file sebagai CSV lalu unggah lagi.</div>';return}
 const proc=rows=>{
  BH.rows=[];
  if(rows.length<2){el.innerHTML='<div class="mut">File kosong atau formatnya tidak dikenali.</div>';bhPrev();return}
  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));
  const c={name:ix('nama'),unit:ix('satuan'),stock:ix('stok'),cogs:ix('harga'),min:ix('batas'),cat:ix('kategori')};
  if(c.name<0){el.innerHTML='<div class="mut" style="color:var(--bad)">Kolom Nama tidak ditemukan. Pakai template dari tombol di atas.</div>';bhPrev();return}
  const g=(r,k)=>k>=0?String(r[k]==null?'':r[k]).trim():'';
  BH.rows=rows.slice(1).map(r=>({name:g(r,c.name),unit:g(r,c.unit)||'gram',stock:bkNum(g(r,c.stock)),cogs:bkNum(g(r,c.cogs)),min:bkNum(g(r,c.min)),cat:g(r,c.cat)||'Bahan'})).filter(r=>r.name);
  bhPrev();
 };
 rd.onload=e=>{try{
  if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
  else proc(bkCsv(String(e.target.result||'')));
 }catch(err){el.innerHTML='<div class="mut" style="color:var(--bad)">File tidak bisa dibaca: '+esc(err.message)+'</div>'}};
 isX?rd.readAsArrayBuffer(f):rd.readAsText(f);
}
function bhPrev(){
 const el=$('#bh_prev'),go=$('#bh_go');if(!el)return;
 const have=new Set(D.products.map(p=>String(p.name).trim().toLowerCase())),seen=new Set();BH.ok=[];
 const out=BH.rows.map(r=>{
  const k=r.name.toLowerCase();let st='ok',msg='';
  if(have.has(k)){st='skip';msg='Nama sudah ada'}else if(seen.has(k)){st='skip';msg='Dobel di file'}
  else if((r.stock!=null&&isNaN(r.stock))||(r.cogs!=null&&isNaN(r.cogs))||(r.min!=null&&isNaN(r.min))){st='bad';msg='Ada angka yang tidak valid'}
  else if((r.stock||0)<0||(r.cogs||0)<0){st='bad';msg='Tidak boleh minus'}
  seen.add(k);if(st==='ok')BH.ok.push(r);return{r,st,msg};
 });
 el.innerHTML=BH.rows.length?`<div style="margin-bottom:8px"><span class="badge g">${BH.ok.length} akan dibuat</span> ${out.length-BH.ok.length?`<span class="badge v">${out.length-BH.ok.length} dilewati</span>`:''}</div><div class="tw" style="max-height:34vh;overflow:auto"><table><tr><th>Bahan</th><th>Satuan</th><th class="r">Stok awal</th><th class="r">HPP</th><th>Status</th></tr>${out.slice(0,300).map(o=>`<tr><td>${esc(o.r.name)}</td><td>${esc(o.r.unit)}</td><td class="r">${fq(o.r.stock||0)}</td><td class="r">${rp(o.r.cogs||0)}</td><td>${o.st==='ok'?'<span class="badge g">Baru</span>':'<span class="badge v">'+esc(o.msg)+'</span>'}</td></tr>`).join('')}</table></div>`:'';
 if(go)go.disabled=!BH.ok.length;
}
async function bhApply(btn){
 if(!BH.ok.length)return;btn.disabled=true;let n=0;
 try{
  for(const r of BH.ok){
   btn.textContent='Membuat '+n+'/'+BH.ok.length+'…';
   await pushQuiet('product',{id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:r.name,sku:'',cat:r.cat,unit:r.unit,price:0,cogs:r.cogs||0,stock:r.stock||0,minStock:r.min||0,trackStock:true,active:true,bahan:true,recipe:[],updated:Date.now(),initStock:r.stock||0});
   n++;
  }
  closeDlg();scheduleLoad();render();alert(n+' bahan baku dibuat.');
 }catch(e){btn.disabled=false;btn.textContent='Buat Bahan Baku';alert('Berhenti setelah '+n+' bahan: '+e.message+'\n\nBahan yang sudah terbuat tidak akan dobel kalau Anda unggah ulang (nama yang sama dilewati).');scheduleLoad()}
}

(async function init(){
 if(baseUrl()&&cfg.hp&&cfg.pin&&idleMin()&&Date.now()-idleLast()>idleMin()*60000){cfg.pin='';cfg.nm='';saveCfg();try{clearCache()}catch(e){}}
 if(baseUrl()&&cfg.hp&&cfg.pin){
  $('#app').innerHTML='<div class="lock"><div class="lockbox" style="text-align:center">Memuat data…</div></div>';
  const c=await readCache();
  if(c){
   await loadFitur(baseUrl(),true);D=buildD();start();
   load().then(()=>{if(!$('#dlg').classList.contains('on')&&!MG.includes(tab))render()}).catch(e=>{if(/salah|dikunci|Terlalu|Ditolak/i.test(String(e&&e.message))){cfg.pin='';saveCfg();D=null;render()}});
   return;
  }
  try{await load();start();return}catch(e){}
 }
 render();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!busy&&Date.now()-loadedAt>60000&&!$('#dlg').classList.contains('on')&&!MG.includes(tab))load().then(render).catch(()=>{})});
</script>
