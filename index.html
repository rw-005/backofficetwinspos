<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWINS Backoffice</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--hd1:#1a44cc;--hd2:#2f6df5;--sh:0 6px 24px rgba(20,40,100,.08);--side:linear-gradient(180deg,#1a44cc,#0f2a7a)}
[data-theme=dark]{--bg:#070b16;--card:#0f1627;--tx:#e8edf9;--mut:#93a1bd;--pri:#5b8cff;--soft:#16223d;--bd:#1d2a45;--hd1:#10265e;--hd2:#1d44a3;--sh:0 6px 24px rgba(0,0,0,.35);--side:linear-gradient(180deg,#0c1c45,#060a14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;min-height:44px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--pri)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 5px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
svg{flex-shrink:0;vertical-align:middle}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.mut{color:var(--mut)}
.logo{font-weight:800;letter-spacing:.2em;font-size:19px}.logo span{font-weight:300;margin-left:.3em}
.shell{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.side .brand{padding:22px 22px 12px}.side .brand small{display:block;opacity:.65;font-size:12px;margin-top:2px;letter-spacing:.04em}
.ng{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:16px 22px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:12px;margin:2px 12px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,.86);background:none;border:0;width:calc(100% - 24px);text-align:left;cursor:pointer;font-weight:600;font-size:14.5px}
.ni:hover{background:rgba(255,255,255,.12)}
.ni.on{background:#fff;color:#1a44cc;box-shadow:0 6px 16px rgba(0,0,40,.25)}
[data-theme=dark] .ni.on{background:#1d2f63;color:#fff}
.sf{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.14)}
.sf .who{font-size:13px;opacity:.85;margin-bottom:10px}
.sf .acts{display:flex;gap:8px}
.sf .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:38px;padding:7px 11px;font-size:13px;flex:1}
.main{flex:1;min-width:0}
.tb{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--bd)}
.tb h2{margin:0;font-size:21px;font-weight:800}.tb .sub{font-size:13px;color:var(--mut)}
.tb .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
.hb{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);place-items:center;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:55}
.content{padding:20px 26px 40px;max-width:1500px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 17px;white-space:nowrap;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.kc small{display:block;color:var(--mut);font-size:13px}.kc b{font-size:21px;font-weight:800;display:block}
.kc .dlt{display:inline-block;margin-top:2px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.kc.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border:0;padding:22px}.kc.hero small{color:rgba(255,255,255,.85)}.kc.hero b{font-size:34px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h4{margin:0 0 4px;font-size:16px;font-weight:800}.card p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tool input{flex:1;min-width:200px}.tool select{width:auto;min-width:150px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--pri)}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.ft td{font-weight:800;border-top:2px solid var(--bd);background:var(--soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri)}
.badge.v{background:#fde4e8;color:var(--bad)}.badge.k{background:#fff0d1;color:var(--warn)}.badge.g{background:#dcf5e6;color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px}
.chart .c{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:linear-gradient(180deg,var(--hd2),var(--hd1));border-radius:6px 6px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:10.5px;color:var(--mut)}.axis span{flex:1;min-width:6px;text-align:center;overflow:hidden}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hd1),var(--hd2))}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rk{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.grow{flex:1;min-width:0}.val{text-align:right;font-weight:700}.val small{display:block;color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0 9px 26px;border-bottom:1px solid var(--bd);position:relative}.ins li:last-child{border:0}.ins li:before{content:'💡';position:absolute;left:0}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lockbox{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#dlg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:80}
#dlg.on{display:flex}
#dlgb{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#dlgb.wide{max-width:920px}
#dlgb h3{margin:0 0 8px}
.sumbox div{display:flex;justify-content:space-between;padding:2px 0;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.acts2{display:flex;gap:8px;margin-top:16px}.acts2 .btn{flex:1}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.strk{background:#fff;color:#111;border:1px dashed #bbb;border-radius:8px;padding:14px;font:12px/1.45 'Courier New',monospace;white-space:pre-wrap;margin:12px auto 0;max-width:300px}
.strk.w80{max-width:380px}
.note{background:var(--soft);border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px}
@media(max-width:1000px){
 .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s}
 .side.open{transform:none}.side.open~.scrim{display:block}
 .hb{display:grid}.tb{padding:12px 14px}.content{padding:14px 14px 40px}
 .two{grid-template-columns:1fr}.kc.hero b{font-size:28px}.tb .r{display:none}
}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.rs-s{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.rs-h{padding:13px 14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:14px}
.rs-h.g{background:rgba(18,161,80,.13)}.rs-h.y{background:rgba(217,138,6,.15)}.rs-h.b{background:rgba(36,87,245,.12)}.rs-h.p{background:rgba(124,58,237,.13)}
.rs-r{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--bd);font-size:14px}
.rs-r span:last-child{text-align:right;white-space:nowrap}
.rs-r.tot{font-weight:800}
.rs-k .kc{border-bottom-width:4px}
.kc.k1{border-bottom-color:#00c897}.kc.k2{border-bottom-color:#f5c518}.kc.k3{border-bottom-color:#0b84e5}.kc.k4{border-bottom-color:#6cb8f5}.kc.k5{border-bottom-color:#7c3aed}.kc.k6{border-bottom-color:#12a150}
.rs-h.o{background:rgba(229,56,79,.12)}
</style>

<body>
<div id="app"></div>
<div id="dlg" onclick="if(event.target===this)closeDlg()"><div id="dlgb"></div></div>
<script src="pelanggan.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const fq=q=>String(parseFloat((+q).toFixed(3)));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const p2=n=>String(n).padStart(2,'0');
const pct=v=>(isFinite(v)?v:0).toFixed(1)+'%';
const DAYN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const METHODS={tunai:'Tunai',qris:'QRIS',debit:'Kartu Debit',kredit:'Kartu Kredit',transfer:'Transfer Bank',ewallet:'E-Wallet',kasbon:'Kasbon'};
const CH={shopee:'ShopeeFood',grab:'GrabFood',gofood:'GoFood'};
const typeLabel=(t,ch)=>t==='online'?(CH[ch]||'Online'):t==='dine'?'Dine In':'Take Away';
const fmtT=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtH=ts=>new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDT=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const dur=ms=>{const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+'j '+(m%60)+'m'};
const stTxt=t=>t.status==='void'?'Refund Penuh':t.status==='partial'?'Refund Sebagian':'Selesai';
const stBadge=t=>t.status==='void'?'<span class="badge v">Refund penuh</span>':t.status==='partial'?'<span class="badge k">Refund sebagian</span>':'<span class="badge g">Selesai</span>';
const selTxt=v=>v===0?'Pas':(v>0?'+':'-')+rp(Math.abs(v));
const selClr=v=>v===0?'ok':v>0?'warn':'bad';

const IC={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
 box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
 clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
 trend:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
 wallet:'<path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4z"/>',
 menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
 refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
 moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
 store:'<path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 hist:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><polyline points="12 7 12 12 15 14"/>'
};
const ic=(n,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

const NAV=[
 ['Utama',[['ring','Ringkasan','home'],['analisa','Analisa Bisnis','trend']]],
 ['Laporan Penjualan',[['rsum','Ringkasan Penjualan','file'],['detail','Detail Penjualan','file'],['produk','Penjualan per Produk','box'],['kasir','Penjualan per Kasir','user'],['pkasir','Produk per Kasir','layers']]],
 ['Operasional',[['shift','Laporan Shift','clock'],['cash','Kas Masuk & Keluar','wallet']]],
 ['Pelanggan',[['pelanggan','Pelanggan','users']]],
 ['Pengaturan',[['mproduk','Produk & Stok','plus'],['mstok','Riwayat Stok','hist'],['mpromo','Promo','tag'],['moutlet','Outlet & Struk','store']]]
];
const TITLE={ring:['Ringkasan','Gambaran umum penjualan dan keuangan'],analisa:['Analisa Bisnis','Tren, margin, dan sorotan performa'],rsum:['Ringkasan Penjualan','Pendapatan, promo, pengembalian, dan laba kotor'],detail:['Detail Penjualan','Rincian setiap nota dan item yang terjual'],produk:['Penjualan per Produk','Performa tiap produk'],kasir:['Penjualan per Kasir','Kinerja masing-masing kasir'],pkasir:['Produk per Kasir','Produk apa saja yang dijual tiap kasir'],shift:['Laporan Shift','Buka-tutup kasir, rekonsiliasi kas, dan presensi'],cash:['Kas Masuk & Keluar','Pengeluaran operasional dan uang masuk lain'],
 pelanggan:['Pelanggan','Data pelanggan, harga spesial, dan penjualan per pelanggan'],mproduk:['Produk & Stok','Tambah, ubah, dan isi stok produk'],mstok:['Riwayat Stok','Catatan stok masuk dan penyesuaian'],mpromo:['Promo','Atur diskon otomatis di kasir'],moutlet:['Outlet & Struk','Info outlet dan tampilan struk']};
const MG=['mproduk','mstok','mpromo','moutlet'];

/* Isi dengan URL Web App (Apps Script) agar login hanya perlu PIN. Kosongkan = URL diminta sekali di layar login. */
const API_URL='';
const LK='twinsbo_cfg';
const baseUrl=()=>API_URL||cfg.url||'';
let cfg={};try{cfg=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
if(cfg.theme)document.documentElement.dataset.theme=cfg.theme;
const saveCfg=()=>{try{localStorage.setItem(LK,JSON.stringify(cfg))}catch(e){}};
let D=null,CUR=null,loadedAt=0,tab='ring',P={k:'today',from:'',to:''},busy=false,timer=null;
const DT={mode:'nota',kasir:'',status:'',q:''},PP={q:'',cat:'',k:'rev',d:-1},PK={k:''},PM={q:'',cat:'',low:false},SL={q:'',type:''};

function toggleTheme(){cfg.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=cfg.theme;saveCfg()}
function logout(){cfg.pin='';cfg.nm='';saveCfg();D=null;clearInterval(timer);render()}
function closeDlg(){$('#dlg').classList.remove('on')}
function dlg(html,wide){$('#dlgb').className=wide?'wide':'';$('#dlgb').innerHTML=html;$('#dlg').classList.add('on')}
function toggleSide(f){const s=$('#side');if(s)s.classList.toggle('open',f===undefined?!s.classList.contains('open'):f)}
function go(k){tab=k;render();window.scrollTo(0,0)}

async function load(){
 if(busy)return;busy=true;
 try{
  const u=baseUrl(),r=await fetch(u+(u.includes('?')?'&':'?')+'action=bopull&hp='+encodeURIComponent(cfg.hp||'')+'&pin='+encodeURIComponent(cfg.pin||''),{redirect:'follow'});
  const j=await r.json();if(!j.ok)throw new Error(j.err||'Ditolak server');
  const gone=j.dels||{},dat=j.data||{},o={};
  ['tx','refunds','shifts','cash','products','promos','customers'].forEach(k=>{const g=new Set(gone[k]||[]);o[k]=(dat[k]||[]).filter(x=>!g.has(x.id))});
  o.stocklog=dat.stocklog||[];const st=dat.settings||[];o.outlet=st.find(x=>x.id==='outlet')||{};o.receipt=st.find(x=>x.id==='receipt')||{};
  D=o;cfg.nm=j.name||'';loadedAt=Date.now();busy=false;return true;
 }catch(e){busy=false;throw e}
}
async function doLogin(){
 if(!API_URL)cfg.url=($('#u').value||'').trim();
 cfg.hp=$('#h').value.trim();cfg.pin=$('#t').value.trim();
 if(!baseUrl()||!cfg.hp||!cfg.pin){$('#e').textContent=API_URL?'Isi nomor HP dan PIN.':'Isi URL, nomor HP, dan PIN.';return}
 $('#e').style.color='var(--mut)';$('#e').textContent='Mengambil data…';
 try{await load();saveCfg();start()}catch(e){cfg.pin='';$('#e').style.color='var(--bad)';$('#e').textContent='Gagal: '+e.message}
}
function start(){render();clearInterval(timer);timer=setInterval(()=>{if($('#dlg').classList.contains('on')||MG.includes(tab))return;load().then(render).catch(()=>{})},60000)}
async function refresh(){try{await load();render()}catch(e){alert('Gagal ambil data: '+e.message)}}

/* ---------- rentang & agregasi ---------- */
function range(){
 const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(P.k==='today')return[d0,d0+864e5];
 if(P.k==='7d')return[d0-6*864e5,d0+864e5];

function newHpp(p,q,bp,m){const s=Math.max(0,+p.stock||0),c=+p.cogs||0;if(m==='none'||!(bp>0))return c;if(m==='last'||s<=0)return Math.round(bp);return Math.round((s*c+q*bp)/(s+q))}
function stockHint(id){
 const p=D.products.find(x=>x.id===id);if(!p)return;
 const add=v('f_mode')==='add',q=v('f_qty'),s=+p.stock||0,bp=v('f_bp');
 $('#f_buy').style.display=add?'':'none';
 if(q===''){$('#f_hint').textContent='';return}
 let t='Stok setelah disimpan: '+fq(add?s+(+q):+q)+' '+p.unit;
 if(add&&bp!=='')t+=' · total beli '+rp(q*bp)+' · HPP '+rp(p.cogs||0)+' → '+rp(newHpp(p,+q,+bp,v('f_hpp')));
 $('#f_hint').textContent=t;
}
function saveStock(id,btn){

 if(mode==='add'&&bp!==''&&!(+bp>=0)){alert('Harga beli tidak valid');return}
 safe(()=>push('stock',{id,mode,qty:+q,note:v('f_note').trim(),buyPrice:mode==='add'&&bp!==''?+bp:0,hppMode:v('f_hpp')}),btn);
}

function bkNum(s){s=String(s==null?'':s).replace(/rp/ig,'').replace(/\s/g,'');if(!s)return null;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?NaN:n}
function bkCsv(txt){
 txt=txt.replace(/^\uFEFF/,'').replace(/^sep=.?\r?\n/i,'');
 const first=txt.split(/\r?\n/).find(x=>x.trim())||'';
 const c=[[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===c){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows;
}

 if(isX&&!window.XLSX){el.innerHTML='<div class="mut" style="color:var(--bad)">Pembaca Excel belum termuat (cek internet). Simpan file sebagai CSV lalu unggah lagi.</div>';return}
 const proc=rows=>{
  BK.rows=[];
  if(rows.length<2){el.innerHTML='<div class="mut">File kosong atau formatnya tidak dikenali.</div>';bkPrev();return}
  const h=rows[0].map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),ix=k=>h.findIndex(x=>x.startsWith(k));
  const c={id:h.indexOf('id'),sku:ix('kode'),name:ix('nama'),qty:ix('jumlah'),bp:ix('hargabeli'),note:ix('catatan')};

  BK.rows=rows.slice(1).map(r=>({id:g(r,c.id),sku:g(r,c.sku),name:g(r,c.name),qty:bkNum(g(r,c.qty)),bp:c.bp>=0?bkNum(g(r,c.bp)):null,note:g(r,c.note).slice(0,40)}));

 };
 rd.onload=e=>{

   if(isX){const wb=XLSX.read(e.target.result,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(x=>x==null?'':String(x))).filter(r=>r.some(x=>x.trim()!=='')))}
   else proc(bkCsv(String(e.target.result||'')));

 };

function bkPrev(){

 if(!BK.rows.length){BK.ok=[];if(go)go.disabled=true;return}
 const set=BK.mode==='set',byId={},bySku={},byName={},seen={};
 D.products.forEach(p=>{byId[String(p.id)]=p;if(p.sku)bySku[String(p.sku).toLowerCase()]=p;byName[String(p.name).trim().toLowerCase()]=p});
 const out=[];BK.ok=[];let blank=0,bad=0,same=0;
 BK.rows.forEach(r=>{
  if(r.qty===null){blank++;return}
  const p=byId[r.id]||(r.sku&&bySku[r.sku.toLowerCase()])||(r.name&&byName[r.name.toLowerCase()])||null,s=p?(+p.stock||0):0;

 });

 L.push(two('TOTAL',rp(tot)));if(ck('r_pm'))L.push(two('Tunai',rp(Math.ceil(tot/50000)*50000)),two('Kembali',rp(Math.ceil(tot/50000)*50000-tot)));
 if(v('r_foot'))L.push('',ctr(v('r_foot')));
 e.textContent=L.join('\n');e.classList.toggle('w80',v('r_w')==='80');
}
